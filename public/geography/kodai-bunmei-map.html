<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>古代文明マップ｜歴史 探偵</title>
<style>
  :root{
    --night:#0B1420;
    --panel:#122132;
    --panel2:#0F1B29;
    --sea:#16293C;
    --land:#C7B48F;
    --coast:#7E7156;
    --ink:#F4EDE0;
    --muted:#8FA2B4;
    --line:#25384C;
    --ochre:#EFB13C;
    --jade:#48C3A9;
    --plum:#D07CC8;
    --vermilion:#FF6B57;
    --mincho:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
    --gothic:"Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,"Noto Sans JP",sans-serif;
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 600px at 20% -10%, #16273A 0%, transparent 60%),
      var(--night);
    color:var(--ink);
    font-family:var(--gothic);
    -webkit-font-smoothing:antialiased;
    padding:10px 12px 12px;
  }
  .shell{max-width:1480px;margin:0 auto}

  header{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:10px}
  .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
  h1{font-family:var(--mincho);font-weight:600;font-size:clamp(16px,2.1vw,21px);margin:0;letter-spacing:.04em;flex:none}
  h1 .sub{color:var(--ochre)}
  .lede{color:var(--muted);font-size:12px;line-height:1.5;margin:0;flex:1 1 280px;min-width:0}

  .bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 8px}
  .chip{
    font-family:var(--gothic);font-size:11px;color:var(--ink);
    background:var(--panel);border:1px solid var(--line);border-radius:999px;
    padding:5px 10px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
  }
  .chip:hover{border-color:#3D5771}
  .chip .dot{width:9px;height:9px;border-radius:50%;background:currentColor}
  .chip[data-on="true"]{background:#1B2E43;border-color:#3F6182}
  .chip[data-on="false"]{opacity:.42}
  .chip.c1{color:var(--ochre)} .chip.c2{color:var(--jade)} .chip.c3{color:var(--plum)} .chip.c4{color:var(--vermilion)}
  .chip.road{color:#9DB7CE}
  .spacer{flex:1}
  .btn{
    font-family:var(--gothic);font-size:12px;font-weight:700;letter-spacing:.04em;
    background:var(--ochre);color:#241703;border:none;border-radius:999px;
    padding:7px 16px;cursor:pointer;transition:.15s;white-space:nowrap;
  }
  .btn:hover{filter:brightness(1.08)}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}

  .grid{display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:12px}

  .mapcard{background:var(--panel2);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .scroller{overflow-x:auto;-webkit-overflow-scrolling:touch}
  svg.map{display:block;width:100%;height:auto;background:var(--sea)}
  .grat{stroke:#20374C;stroke-width:.6;fill:none}
  .land{fill:var(--land);stroke:var(--coast);stroke-width:.7;stroke-linejoin:round}
  .borders{fill:none;stroke:#8E8265;stroke-width:0.8;opacity:.75;stroke-dasharray:3 3}
  .cname{font-family:var(--gothic);font-size:12px;fill:#6E6350;letter-spacing:.08em;text-anchor:middle}
  .road{fill:none;stroke:#BFD3E6;stroke-width:2.2;stroke-dasharray:9 7;opacity:.85}
  .roadlabel{fill:#BFD3E6;font-size:13px;font-family:var(--gothic);letter-spacing:.18em}
  @media (prefers-reduced-motion:no-preference){
    .road{animation:march 3s linear infinite}
    @keyframes march{to{stroke-dashoffset:-32}}
  }

  .mk{cursor:pointer}
  .mk .halo{fill:currentColor;opacity:0}
  .mk .ring{fill:none;stroke:currentColor;stroke-width:2.4}
  .mk .core{fill:currentColor}
  .mk .lbl{font-family:var(--gothic);font-size:15px;font-weight:700;fill:#0B1420;paint-order:stroke;stroke:var(--land);stroke-width:5px;stroke-linejoin:round}
  .mk .yr{font-family:var(--mono);font-size:11px;fill:#4A4230;paint-order:stroke;stroke:var(--land);stroke-width:4px}
  .mk[data-state="future"]{opacity:.16;pointer-events:none}
  .mk[data-state="hidden"]{opacity:0;pointer-events:none}
  .mk:hover .halo{opacity:.22}
  .mk[data-sel="true"] .halo{opacity:.3}
  .mk[data-sel="true"] .ring{stroke-width:4}
  @media (prefers-reduced-motion:no-preference){
    .mk[data-sel="true"] .halo{animation:beat 1.8s ease-in-out infinite}
    @keyframes beat{0%,100%{transform:scale(1);opacity:.3}50%{transform:scale(1.25);opacity:.1}}
  }
  .mk .halo{transform-box:fill-box;transform-origin:center}

  /* time ruler */
  .ruler{padding:14px 16px 16px;border-top:1px solid var(--line);background:var(--panel)}
  .rulertop{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:8px}
  .year{font-family:var(--mono);font-size:26px;font-weight:600;color:var(--ochre);letter-spacing:.02em}
  .jera{font-family:var(--mincho);font-size:16px;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px 10px}
  .jera small{color:var(--muted);font-family:var(--gothic);font-size:11px;margin-right:6px}
  .hint{color:var(--muted);font-size:12px}
  input[type=range]{width:100%;accent-color:var(--ochre);height:26px}
  .ticks{position:relative;height:16px;font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:-2px}
  .ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
  .ticks span::before{content:"";position:absolute;left:50%;top:-5px;width:1px;height:4px;background:var(--line)}

  /* side panel */
  aside{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;min-height:420px;position:sticky;top:16px}
  .cat{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase}
  aside h2{font-family:var(--mincho);font-size:24px;margin:8px 0 2px;letter-spacing:.03em}
  .place{color:var(--muted);font-size:12px;margin-bottom:12px}
  .era{font-family:var(--mono);font-size:13px;color:var(--ochre);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 0;margin-bottom:12px}
  aside ul{margin:0;padding-left:1.1em}
  aside li{font-size:13.5px;line-height:1.85;margin-bottom:4px}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
  .tag{font-size:11.5px;background:#1B2E43;border:1px solid var(--line);border-radius:5px;padding:4px 9px;color:#CFE0EE}
  .empty{color:var(--muted);font-size:13px;line-height:1.9;padding-top:40px;text-align:center}
  .empty b{display:block;font-family:var(--mincho);font-size:17px;color:var(--ink);margin-bottom:8px}

  /* quiz */
  .q .cat{color:var(--jade)}
  .qtext{font-family:var(--mincho);font-size:19px;line-height:1.65;margin:10px 0 16px}
  .qmeta{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:6px}
  .feedback{border-radius:8px;padding:11px 13px;font-size:13.5px;line-height:1.7;margin-top:12px}
  .ok{background:#12362E;border:1px solid #2E7D6B;color:#A9EDDB}
  .ng{background:#3A1D1C;border:1px solid #8A403A;color:#FFC1B8}
  .score{font-family:var(--mono);font-size:40px;color:var(--ochre);text-align:center;margin:26px 0 6px}

  @media (max-width:900px){
    .grid{grid-template-columns:1fr}
    aside{position:static;min-height:0}
    svg.map{width:1000px}
    .scroller::after{content:"";display:block}
    .swipe{display:block !important}
  }
  .swipe{display:none;font-size:11px;color:var(--muted);text-align:center;padding:6px}

  /* Fill the frame. The svg scales by width alone, so without an explicit
     height the map leaves the bottom of a tall viewport empty. preserveAspect-
     Ratio="xMidYMid meet" then fits it to whichever axis runs out first. */
  html,body{height:100%}
  body{display:flex;flex-direction:column;overflow:hidden}
  .shell{flex:1;display:flex;flex-direction:column;min-height:0;width:100%}
  .grid{flex:1;min-height:0;align-items:stretch}
  .mapcard{display:flex;flex-direction:column;min-height:0}
  .scroller{flex:1;min-height:0;display:flex}
  svg.map{height:100%;flex:1}
  aside{overflow-y:auto;min-height:0}

  @media (max-width:1080px){
    /* Stacked on a narrow screen: let the page scroll normally again. */
    html,body{height:auto}
    body{display:block;overflow:auto}
    .shell{display:block}
    .grid{display:block}
    .mapcard{display:block;margin-bottom:16px}
    .scroller{display:block}
    svg.map{height:auto}
    aside{overflow:visible}
  }

  /* zoom + panel controls, overlaid on the map corner */
  .worldmap-zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:4px;z-index:5}
  .worldmap-zoom button{
    width:30px;height:30px;display:flex;align-items:center;justify-content:center;
    font-family:var(--gothic);font-size:15px;line-height:1;
    background:#122132ee;color:var(--ink);border:1px solid var(--line);border-radius:8px;
    cursor:pointer;transition:.15s;padding:0;
  }
  .worldmap-zoom button:hover:not(:disabled){border-color:#3F6182;background:#1B2E43}
  .worldmap-zoom button:disabled{opacity:.35;cursor:default}
  .grid.panel-hidden{grid-template-columns:minmax(0,1fr)}
  .grid.panel-hidden aside{display:none}
</style>
<script src="/components/world-map.js"></script>
</head>
<body>
<div class="shell">

<header>
  <div class="eyebrow">第2章 古代 ／ 第1節</div>
  <h1>古代文明マップ <span class="sub">— 文明はどこで生まれた？</span></h1>
  <p class="lede">スライダーを動かすと、その年までに生まれた文明があらわれます。地図の印をクリックすると、くわしい内容が出てきます。</p>
</header>

  <button class="chip c3" data-cat="rel" data-on="true"><span class="dot"></span>三大宗教</button>
  <button class="chip c4" data-cat="jp" data-on="true"><span class="dot"></span>日本列島</button>
  <button class="chip road" id="roadBtn" data-on="false"><span class="dot"></span>シルクロード</button>
  <button class="chip road" id="borderBtn" data-on="false"><span class="dot"></span>今の国境</button>

</div>

  tags:["縄文","弥生","古墳","飛鳥","奈良"]}

const ROAD=[[108.9,34.3],[103.8,36.1],[94.7,40.1],[85.0,41.5],[75.9,39.5],[66.9,39.7],[54.4,37.5],[44.4,33.3],[36.2,36.2],[23.7,38.0],[12.5,41.9]];

const QUIZ=[
 {q:"くさび形文字・太陰暦・60進法が生まれた文明はどこ？",a:"meso"},
 {q:"ナイル川の流域で、太陽暦とピラミッドがつくられた文明はどこ？",a:"egypt"},
 {q:"モヘンジョ=ダロなどの計画都市がつくられた文明はどこ？",a:"indus"},
 {q:"甲骨文字が使われ、殷（商）が栄えた文明はどこ？",a:"china"},
 {q:"「皇帝」を名のった始皇帝が、万里の長城を修築させた国はどこ？",a:"shinkan"},
 {q:"成人男子の市民による民会を中心とした民主政が行われたポリスはどこ？",a:"greece"},
 {q:"共和政から帝政に移り、道路や水道を整えた国はどこ？",a:"rome"},
 {q:"シャカが悟りを開き、「人は皆平等」と説いた宗教が生まれた場所はどこ？",a:"buddha"},
 {q:"イエスが説き、4世紀末にローマ帝国の国教となった宗教が生まれた場所はどこ？",a:"christ"},
 {q:"ムハンマドがアッラーの教えを伝えた都市はどこ？",a:"islam"}
];

/* ---------- build map ---------- */
const el=BASE.el;

// modern country names (shown with the border layer)
const COUNTRIES=[
 [29.5,23.5,"エジプト"],[42.0,35.8,"イラク"],[54.5,31.5,"イラン"],[46.5,25.5,"サウジアラビア"],
 [35.5,39.5,"トルコ"],[16.0,39.5,"イタリア"],[2.5,46.8,"フランス"],[69.8,30.8,"パキスタン"],
 [79.0,21.5,"インド"],[100.0,42.5,"中国"],[100.0,47.5,"モンゴル"],[10.0,28.0,"リビア"],
 [60.0,45.0,"カザフスタン"],[36.0,17.0,"スーダン"]];
const cn=document.getElementById("cnames");
COUNTRIES.forEach(([lon,lat,name])=>{
  const[x,y]=px(lon,lat);
  const t=el("text",{class:"cname",x:x,y:y});
  t.textContent=name; cn.appendChild(t);
});

// silk road
document.getElementById("roadPath").setAttribute("d","M"+ROAD.map(p=>px(p[0],p[1]).map(n=>n.toFixed(1)).join(",")).join("L"));
const rl=document.getElementById("roadLabel");
const[rlx,rly]=px(78,45); rl.setAttribute("x",rlx); rl.setAttribute("y",rly); rl.textContent="シルクロード";

// markers
const layer=document.getElementById("markers");
const nodes={};
DATA.forEach(d=>{
  const[x,y]=px(d.lon,d.lat);
  const g=el("g",{class:"mk",tabindex:"0",role:"button","aria-label":d.name});
  g.style.color=CAT[d.cat].color;
  g.appendChild(el("circle",{class:"halo",cx:x,cy:y,r:20}));
  g.appendChild(el("circle",{class:"ring",cx:x,cy:y,r:9}));
  g.appendChild(el("circle",{class:"core",cx:x,cy:y,r:3.4}));
  const t=el("text",{class:"lbl",x:x+d.dx,y:y+d.dy,"text-anchor":d.anchor});
  t.textContent=d.name; g.appendChild(t);
  const yr=el("text",{class:"yr",x:x+d.dx,y:y+d.dy+14,"text-anchor":d.anchor});
  yr.textContent=d.from<0?"前"+(-d.from):"後"+d.from; g.appendChild(yr);
  g.addEventListener("click",()=>pick(d.id));
  g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pick(d.id);}});
  layer.appendChild(g);
  nodes[d.id]={g,label:t,yr,data:d};
});

// timeline ticks, placed at their true position on the range
const TICKS=[[-4000,"前4000"],[-3000,"前3000"],[-2000,"前2000"],[-1000,"前1000"],[0,"紀元"],[800,"後800"]];
const tk=document.getElementById("ticks");
TICKS.forEach(([y,label])=>{
  const s=document.createElement("span");
  s.textContent=label;
  s.style.left=((y+4000)/4800*100).toFixed(2)+"%";
  tk.appendChild(s);
});

/* ---------- state ---------- */
let year=-4000, selected=null, cats={river:1,med:1,rel:1,jp:1}, quiz=null;

function jpEra(y){
  if(y<-400)return"縄文時代";
  if(y<250)return"弥生時代";
  if(y<592)return"古墳時代";
  if(y<710)return"飛鳥時代";
  return"奈良時代";
}
function yearText(y){return y<0?"紀元前"+(-y)+"年":"紀元"+(y===0?1:y)+"年";}

function render(){
  document.getElementById("yearOut").textContent=yearText(year);
  document.getElementById("jeraOut").innerHTML='<small>日本は</small>'+jpEra(year);
  DATA.forEach(d=>{
    const n=nodes[d.id];
    let st="on";
    if(!cats[d.cat])st="hidden";
    else if(year<d.from)st="future";
    n.g.setAttribute("data-state",st);
    n.g.setAttribute("data-sel",selected===d.id?"true":"false");
    const show=(st==="on")?"":"none";
    n.label.style.display=show; n.yr.style.display=show;
  });
  const found=DATA.filter(d=>year>=d.from&&cats[d.cat]).length;
  document.getElementById("hint").textContent=quiz?"地図から答えをえらぼう":"見つかった文明：" + found + " / " + DATA.length;
}


/* ---------- LEEA progress bridge ----------
   Reports to the LEEA app (src/components/geography/GeographyMapView.tsx)
   which markers Leo has opened and how his quiz went. The map never writes
   storage itself — it only reports, so the app stays the single writer and
   the same progress reaches Supabase. Opened standalone (no parent frame),
   every call below is a no-op and the map behaves exactly as before. */
const LEEA_MAP_ID="kodai-bunmei-map";
const leeaOpened=new Set();
function leeaReport(quizResult){
  if(window.parent===window) return;
  try{
    window.parent.postMessage({
      type:"LEEA_GEO_PROGRESS",
      mapId:LEEA_MAP_ID,
      explored:leeaOpened.size,
      exploredTotal:DATA.length,
      quiz:quizResult||undefined
    },window.location.origin);
  }catch(e){/* never let reporting break the map */}
}

function pick(id){
  if(quiz){answer(id);return;}
  showPanel();
  selected=id; render();
  leeaOpened.add(id); leeaReport();
  const d=DATA.find(x=>x.id===id);
  document.getElementById("panel").innerHTML=
    '<div class="cat" style="color:'+CAT[d.cat].color+'">'+CAT[d.cat].name+'</div>'+
    '<h2>'+d.name+'</h2>'+
    '<div class="place">'+d.place+'</div>'+
    '<div class="era">'+d.era+'</div>'+
    '<ul>'+d.facts.map(f=>'<li>'+f+'</li>').join('')+'</ul>'+
    '<div class="tags">'+d.tags.map(t=>'<span class="tag">'+t+'</span>').join('')+'</div>';
}

/* ---------- controls ---------- */
const slider=document.getElementById("slider");
slider.addEventListener("input",e=>{year=+e.target.value;render();});

document.querySelectorAll("#filters .chip[data-cat]").forEach(b=>{
  b.addEventListener("click",()=>{
    const c=b.dataset.cat, on=b.dataset.on!=="true";
    b.dataset.on=on; cats[c]=on?1:0;
    if(!on&&selected&&DATA.find(d=>d.id===selected).cat===c){selected=null;resetPanel();}
    render();
  });
});

const roadBtn=document.getElementById("roadBtn");
roadBtn.addEventListener("click",()=>{
  const on=roadBtn.dataset.on!=="true";
  roadBtn.dataset.on=on;
  document.getElementById("roadLayer").style.display=on?"":"none";
});

const borderBtn=document.getElementById("borderBtn");
borderBtn.addEventListener("click",()=>{
  const on=borderBtn.dataset.on!=="true";
  borderBtn.dataset.on=on;
  document.getElementById("borderLayer").style.display=on?"":"none";
});

function resetPanel(){
  document.getElementById("panel").className="";
  document.getElementById("panel").innerHTML='<div class="empty"><b>地図の印をクリック</b>どんな文明が、いつ、どこで生まれたのかを調べよう。</div>';
}

/* ---------- quiz ---------- */
const quizBtn=document.getElementById("quizBtn");
quizBtn.addEventListener("click",()=>{quiz?endQuiz():startQuiz();});

function startQuiz(){
  showPanel();
  quiz={order:QUIZ.map((q,i)=>i).sort(()=>Math.random()-.5),i:0,score:0,locked:false};
  quizBtn.textContent="クイズをやめる"; quizBtn.classList.add("ghost");
  year=800; slider.value=800;
  Object.keys(cats).forEach(k=>cats[k]=1);
  document.querySelectorAll("#filters .chip[data-cat]").forEach(b=>b.dataset.on="true");
  selected=null; render(); askQ();
}
function endQuiz(){
  quiz=null; quizBtn.textContent="クイズに挑戦"; quizBtn.classList.remove("ghost");
  resetPanel(); render();
}
function askQ(){
  const q=QUIZ[quiz.order[quiz.i]];
  document.getElementById("panel").className="q";
  document.getElementById("panel").innerHTML=
    '<div class="qmeta"><span>第 '+(quiz.i+1)+' 問 / '+QUIZ.length+'</span><span>正解 '+quiz.score+'</span></div>'+
    '<div class="cat">クイズ</div>'+
    '<div class="qtext">'+q.q+'</div>'+
    '<div class="hint">地図の印をクリックして答えよう</div>';
}
function answer(id){
  if(quiz.locked)return;
  quiz.locked=true;
  const q=QUIZ[quiz.order[quiz.i]];
  const correct=id===q.a;
  if(correct)quiz.score++;
  selected=q.a; render();
  const ans=DATA.find(d=>d.id===q.a);
  const box=document.createElement("div");
  box.className="feedback "+(correct?"ok":"ng");
  box.innerHTML=correct?"正解！　<b>"+ans.name+"</b>":"おしい！　正解は <b>"+ans.name+"</b>（"+ans.place+"）";
  document.getElementById("panel").appendChild(box);
  const next=document.createElement("button");
  next.className="btn"; next.style.marginTop="14px";
  next.textContent=quiz.i<QUIZ.length-1?"次の問題へ":"結果を見る";
  next.addEventListener("click",()=>{
    if(quiz.i<QUIZ.length-1){quiz.i++;quiz.locked=false;selected=null;render();askQ();}
    else showScore();
  });
  document.getElementById("panel").appendChild(next);
}
function showScore(){
  leeaReport({correct:quiz.score,total:QUIZ.length});
  const p=document.getElementById("panel");
  const msg=quiz.score>=9?"かんぺき！ 探偵レベル MAX":quiz.score>=7?"よくできました！":quiz.score>=4?"あと少し。地図をもう一度見てみよう":"もう一度、地図を調べてみよう";
  p.innerHTML='<div class="cat">けっか</div><div class="score">'+quiz.score+' / '+QUIZ.length+'</div>'+
    '<div class="place" style="text-align:center;font-size:14px">'+msg+'</div>';
  const again=document.createElement("button");
  again.className="btn"; again.style.cssText="margin:18px auto 0;display:block";
  again.textContent="もう一度";
  again.addEventListener("click",startQuiz);
  p.appendChild(again);
  const back=document.createElement("button");
  back.className="btn ghost"; back.style.cssText="margin:10px auto 0;display:block";
  back.textContent="地図にもどる";
  back.addEventListener("click",endQuiz);
  p.appendChild(back);
}

// on narrow screens: centre the map on the Middle East, and bring the card into view
const scroller=document.querySelector(".scroller");
function centreMap(){
  if(scroller.scrollWidth>scroller.clientWidth){
    scroller.scrollLeft=scroller.scrollWidth*0.42-scroller.clientWidth/2;
  }
}
window.addEventListener("resize",centreMap);
const _pick=pick;
pick=function(id){
  _pick(id);
  if(window.innerWidth<900){
    document.getElementById("panel").scrollIntoView({behavior:"smooth",block:"nearest"});
  }
};

render();
centreMap();

/* ---------- zoom + collapsible panel (shared behaviour) ---------- */
enableZoom(BASE);

// The panel toggle joins the zoom cluster rather than the control bar, which
// is already full. Collapsing it hands the whole width to the map — a world
// map is width-limited, so this is what actually makes it bigger.
const grid=document.querySelector(".grid");
const panelToggle=document.createElement("button");
panelToggle.type="button";
document.querySelector(".worldmap-zoom").appendChild(panelToggle);

function setPanelHidden(hidden){
  grid.classList.toggle("panel-hidden",hidden);
  panelToggle.textContent=hidden?"\u25c2":"\u25b8";
  panelToggle.title=hidden?"パネルを開く":"パネルを閉じる";
  panelToggle.setAttribute("aria-label",panelToggle.title);
  panelToggle.setAttribute("aria-expanded",String(!hidden));
}
panelToggle.addEventListener("click",()=>setPanelHidden(!grid.classList.contains("panel-hidden")));
setPanelHidden(false);

/** Anything that writes the panel opens it first — otherwise a click on the
    map would look like it did nothing while the panel was collapsed. */
function showPanel(){ if(grid.classList.contains("panel-hidden")) setPanelHidden(false); }
</script>
</body>
</html>
