<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test · Units 7–9</title>
<style>
/* ═══════════════════════════════════════════════════════════════════════
   This is a TEST, so it is built to look like the printed test page, not
   like the LEEA practice apps. No module cards, no modals, no emoji
   chrome, no colour rewards — one paper page, questions 1 to 42 in the
   publisher's own order and wording.

   The one thing paper does for free and a screen does not: on paper the
   picture and the reading sit in front of you the whole time you answer.
   Every section that has a picture, a reading or a track keeps it in a
   sticky panel that stays put while the questions scroll past it.
   No system font stack is loaded from the network, so nothing can stall.
   ═══════════════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#111111;      /* printed text            */
  --ink2:#3F3F46;
  --ink3:#71717A;     /* instructions, meta      */
  --rule:#A1A1AA;     /* answer lines, blanks    */
  --hair:#D4D4D8;     /* light rules             */
  --pencil:#1D4ED8;   /* what Leo writes in      */
  --pencil-bg:#EFF6FF;
  --desk:#E4E4E7;     /* behind the page         */
  --paper:#FFFFFF;
  --fn:Arial,'Helvetica Neue',Helvetica,'Segoe UI',sans-serif;
}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--fn);background:var(--desk);color:var(--ink);font-size:16px;line-height:1.65}

/* ── thin status strip ─────────────────────────────────────────────── */
.bar{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:1px solid var(--hair);
     height:38px;display:flex;align-items:center;justify-content:space-between;
     padding:0 14px;font-size:.78rem;font-weight:700;color:var(--ink3)}
.bar b{color:var(--ink);font-weight:700}
.bar .saved{color:#15803D;opacity:0;transition:opacity .3s}
.bar .saved.on{opacity:1}

/* ── the page ──────────────────────────────────────────────────────── */
.page{max-width:820px;margin:0 auto;background:var(--paper);padding:26px 26px 90px;
      box-shadow:0 0 0 1px #D4D4D8}
@media(min-width:880px){.page{padding:34px 46px 110px;margin:14px auto}}

.sheet-hd{border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:6px}
.sheet-title{font-size:1.08rem;font-weight:700;letter-spacing:.2px}
.sheet-meta{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:8px;font-size:.84rem;color:var(--ink2)}
.sheet-meta span{white-space:nowrap}
.sheet-meta u{text-decoration:none;border-bottom:1px solid var(--rule);padding:0 26px 0 4px}
.sheet-note{font-size:.8rem;color:var(--ink3);margin:12px 0 4px;line-height:1.6}

/* ── a section of the test ─────────────────────────────────────────── */
.sec{padding-top:24px;margin-top:22px;border-top:1px solid var(--hair)}
.sec:first-of-type{border-top:none;margin-top:8px}
.instr{font-size:.98rem;font-weight:700;margin-bottom:2px}
.instr .tr{float:right;font-weight:700;color:var(--ink3);font-size:.84rem;letter-spacing:.5px}
.sub{font-size:.82rem;color:var(--ink3);margin-bottom:10px}
.example{font-size:.9rem;font-style:italic;color:var(--ink2);margin:10px 0 4px}

/* Media that must stay in view while the questions are answered. Block
   layout on a phone (the panel sticks above the questions), two columns
   from 900px (it sticks beside them). In both cases the sticky element is
   a child of a box as tall as the whole section, which is what lets it
   travel — a grid row of its own would pin it to its own height. */
.with-media{display:block}
.media{position:sticky;top:38px;z-index:20;background:var(--paper);
       padding:8px 0 10px;border-bottom:1px solid var(--hair);margin-bottom:12px;
       box-shadow:0 8px 10px -8px rgba(0,0,0,.22)}
.qs{display:block}
@media(min-width:900px){
  .with-media{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);
              gap:26px;align-items:start}
  .media{border-bottom:none;padding-bottom:0;margin-bottom:0;box-shadow:none}
}

.media img{width:100%;height:auto;max-height:25vh;object-fit:contain;display:block;
           border:1px solid var(--hair);cursor:zoom-in}
@media(min-width:900px){.media img{max-height:none}}
.media audio{width:100%;margin-top:6px;height:34px}
.track-lbl{font-size:.74rem;font-weight:700;color:var(--ink3);letter-spacing:1px;margin-top:8px}
.zoom{font-size:.76rem;color:var(--pencil);background:none;border:none;font-family:var(--fn);
      font-weight:700;cursor:pointer;padding:5px 0 0}

/* reading passage — scrolls inside itself on a phone so it never eats the screen */
.passage{border:1px solid var(--hair);padding:12px 14px;max-height:30vh;overflow:auto}
@media(min-width:900px){.passage{max-height:72vh}}
.passage h4{font-size:.98rem;font-weight:700;text-align:center;margin-bottom:8px}
.passage p{font-size:.92rem;line-height:1.7;margin-bottom:9px;text-align:justify}
.passage p:last-child{margin-bottom:0}

/* ── word box, exactly as it is printed ────────────────────────────── */
.box{border:1px solid var(--ink);padding:9px 12px;margin:10px 0 4px;
     display:flex;flex-wrap:wrap;gap:6px 26px;justify-content:center;font-size:.93rem;font-weight:700;
     background:var(--paper)}
/* A word box is reference material: on paper the eye goes back to it for every
   blank, so it stays in view the same way the picture and the reading do —
   pinned on its own when the section has no media panel, inside the panel when
   it has one. */
.box.pin{position:sticky;top:38px;z-index:20;box-shadow:0 8px 10px -8px rgba(0,0,0,.22)}
.media .box{margin:10px 0 0}
@media(min-width:900px){.box.pin{box-shadow:none}}

/* ── one question ─────────────────────────────────────────────────── */
.item{display:flex;gap:8px;align-items:flex-start;padding:9px 0;border-bottom:1px dotted #E4E4E7}
.item:last-child{border-bottom:none}
.num{font-weight:700;min-width:26px;flex-shrink:0;text-align:right}
.ilabel{font-weight:700;min-width:24px;flex-shrink:0}
.body{flex:1;min-width:0;font-size:.95rem;line-height:1.85}

/* the blank that carries the answer, printed as "____ 8." */
.blank{flex-shrink:0;min-width:46px;height:26px;border-bottom:1.5px solid var(--rule);
       text-align:center;font-weight:700;color:var(--pencil);font-size:.92rem;line-height:26px}
.blank.filled{border-bottom-color:var(--pencil)}

/* an inline blank inside a sentence is a select with no chrome */
.inl{font-family:var(--fn);font-size:.95rem;font-weight:700;color:var(--pencil);
     background:transparent;border:none;border-bottom:1.5px solid var(--rule);
     border-radius:0;padding:1px 2px;min-width:112px;max-width:100%;
     -webkit-appearance:none;appearance:none;cursor:pointer}
.inl:focus{outline:none;border-bottom-color:var(--pencil);background:var(--pencil-bg)}
.inl.filled{border-bottom-color:var(--pencil)}
.inl.short{min-width:56px;text-align:center}

/* options, laid out down-then-across the way the sheet prints them */
.opts{display:grid;grid-template-rows:repeat(2,auto);grid-auto-flow:column;
      gap:2px 20px;margin-top:5px}
.opts.two{grid-template-rows:auto}
.opt{text-align:left;background:none;border:1px solid transparent;border-radius:3px;
     font-family:var(--fn);font-size:.93rem;color:var(--ink);cursor:pointer;padding:4px 7px}
.opt:hover{background:#FAFAFA;border-color:var(--hair)}
.opt .k{font-weight:700;margin-right:7px}
.opt.picked{background:var(--pencil-bg);border-color:var(--pencil);color:var(--pencil);font-weight:700}

/* ruled writing lines, like the underscores on the sheet */
.lines{width:100%;font-family:var(--fn);font-size:.95rem;color:var(--pencil);font-weight:700;
       border:none;border-radius:0;background-image:repeating-linear-gradient(
         transparent,transparent 31px,var(--rule) 31px,var(--rule) 32px);
       line-height:32px;padding:0;resize:none;overflow:hidden}
.lines:focus{outline:none}

/* ── speaking ─────────────────────────────────────────────────────── */
.dad-note{border-left:3px solid var(--ink);padding:6px 0 6px 11px;font-size:.86rem;
          color:var(--ink2);margin:10px 0}
.sp-show{background:var(--paper);border:1px solid var(--ink);padding:9px 14px;font-family:var(--fn);
         font-size:.88rem;font-weight:700;cursor:pointer;width:100%;margin-top:4px}
.sp{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dotted #E4E4E7}
.sp-tick{width:26px;height:26px;flex-shrink:0;border:1.5px solid var(--rule);background:var(--paper);
         cursor:pointer;font-size:.9rem;line-height:1;color:var(--pencil);font-weight:700}
.sp.ok .sp-tick{border-color:var(--pencil);background:var(--pencil-bg)}
.sp-q{font-size:.92rem;line-height:1.6}
.sp-a{font-size:.82rem;color:var(--ink3);margin-top:3px}

/* ── the small footer that closes each section ─────────────────────── */
.sec-foot{display:flex;gap:10px;align-items:center;margin-top:14px;padding-top:11px;
          border-top:1px solid var(--hair);flex-wrap:wrap}
.f-done{background:var(--paper);border:1.5px solid var(--ink);color:var(--ink);font-family:var(--fn);
        font-size:.83rem;font-weight:700;padding:8px 15px;cursor:pointer}
.f-done:disabled{border-color:var(--hair);color:#A1A1AA;cursor:not-allowed}
.f-done.is-done{background:var(--ink);color:var(--paper)}
.f-redo{background:none;border:none;color:var(--ink3);font-family:var(--fn);font-size:.8rem;
        font-weight:700;cursor:pointer;padding:8px 4px;text-decoration:underline}
.f-state{font-size:.79rem;color:var(--ink3);margin-left:auto}

/* ── answer section (the score), printed like the key page ─────────── */
.answers{margin-top:34px;padding-top:20px;border-top:2px solid var(--ink)}
.answers h3{font-size:1.02rem;font-weight:700;margin-bottom:3px}
.locked{font-size:.86rem;color:var(--ink3);padding:14px 0}
.total{display:flex;align-items:baseline;gap:10px;margin:14px 0 4px}
.total b{font-size:2.5rem;font-weight:700;line-height:1}
.total span{font-size:.92rem;color:var(--ink2)}
.pend{font-size:.85rem;color:var(--ink2);border-left:3px solid var(--ink);padding:5px 0 5px 11px;margin:10px 0}
.brk{width:100%;border-collapse:collapse;margin-top:10px;font-size:.88rem}
.brk td{padding:6px 4px;border-bottom:1px solid var(--hair)}
.brk td:last-child{text-align:right;font-weight:700;white-space:nowrap}
.brk tr.open td:last-child{color:var(--pencil)}
.mark{border:1px solid var(--hair);padding:11px 13px;margin-top:11px}
.mark-h{font-size:.82rem;font-weight:700;color:var(--ink3);margin-bottom:6px}
.mark-said{font-size:.9rem;line-height:1.65;white-space:pre-wrap;border-left:2px solid var(--hair);
           padding-left:10px;margin-bottom:7px;color:var(--ink)}
.mark-key{font-size:.83rem;color:var(--ink2);margin-bottom:8px;line-height:1.55}
.steps{display:flex;gap:5px;flex-wrap:wrap}
.step{background:var(--paper);border:1px solid var(--rule);font-family:var(--fn);font-size:.85rem;
      font-weight:700;padding:5px 12px;cursor:pointer;color:var(--ink2)}
.step.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}

/* ── zoom ─────────────────────────────────────────────────────────── */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:90;display:none;
    align-items:center;justify-content:center;padding:8px;cursor:zoom-out}
.lb.open{display:flex}
.lb img{max-width:100%;max-height:94vh;object-fit:contain}
</style>
</head>

    n:41

    image:PIC_BASE+'q42-town-park.png',
    imageAlt:'A town with a park. A girl on a bicycle pulls a boy on a skateboard. A mother pushes a small child on a swing. A boy flies a kite. Children spin on a merry-go-round. Signs point to the mall, the zoo, the city center and the airport, and there is an ice cream shop and a toy store.',

    n:42,

      {say:'Say',q:'Look at the girl on the bicycle. What is she doing with the boy on the skateboard?',a:'She is pulling the boy on the skateboard.'},

      {say:'Ask',q:'Are they riding toward the mall?',a:'No, they’re riding away from the mall.'},
      {say:'Ask',q:'What is the mom in the park doing?',a:'The mom is pushing the daughter (on the swings).'},
      {say:'Ask',q:'How do you swing?',a:'You push and pull your legs up and down.'},
      {say:'Say',q:'The mom gave the boy the kite. What is another way to say that sentence using “to”?',a:'The mom gave the kite to him / to the boy.'},
      {say:'Ask',q:'What are the children doing on the merry-go-round?',a:'They are spinning / turning.'},
      {say:'Ask',q:'How can the children on the merry-go-round get dizzier?',a:'The faster they go, the dizzier they get. / They can push more / faster.'}

/* ═══════════════════════════════════════════════════════════════════════
   ENGINE — generic. Nothing below this line knows about Units 7–9.
   The whole test renders as one page: every section is laid out at load,
   so the picture, the reading and the track for a section are on screen
   the entire time its questions are being answered.
   ═══════════════════════════════════════════════════════════════════════ */
var SP = 'leea-4-t7-9-test-';
var HW_ID = new URLSearchParams(location.search).get('hw') || 'leo-4-t7-9-test';
var PARTS = TEST.parts;
var MC = PARTS.length;

function lSave(k,v){try{localStorage.setItem(SP+k,JSON.stringify(v));}catch(e){}}
function lLoad(k,fb){try{var v=localStorage.getItem(SP+k);return v!==null?JSON.parse(v):(fb===undefined?null:fb);}catch(e){return fb===undefined?null:fb;}}
function lDrop(k){try{localStorage.removeItem(SP+k);}catch(e){}}

function saveScore(score,total,done,extra){
  var data={score:score,total:total,pct:total?Math.round(score/total*100):0,done:done,timestamp:new Date().toISOString()};
  if(extra)for(var x in extra)data[x]=extra[x];
  lSave('score',data);
  try{
    localStorage.setItem(HW_ID+'-score',JSON.stringify(data));
    if(done)localStorage.setItem(HW_ID+'-done',JSON.stringify(true));
  }catch(e){}
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function partById(id){for(var i=0;i<PARTS.length;i++)if(PARTS[i].id===id)return PARTS[i];return null;}
function getAns(p){return lLoad(p.id+'-ans',{})||{};}
function setAns(p,key,val){var a=getAns(p);a[key]=val;lSave(p.id+'-ans',a);flashSaved();}

/* ── marking ────────────────────────────────────────────────────────── */
function norm(s){
  return String(s||'').toLowerCase()
    .replace(/[‘’ʼ]/g,"'").replace(/[“”]/g,'"')
    .replace(/[.,!?;:]+$/g,'').replace(/\s+/g,' ').trim();
}

/** What a section is worth, what Leo earned automatically, what Dad still owes. */
function markPart(p){
  var a=getAns(p), got=0, max=0, pending=[];
  if(p.kind==='speaking'){
    var ticks=lLoad(p.id+'-ticks',[])||[];
    max=p.pts;
    for(var t=0;t<p.prompts.length;t++)if(ticks[t])got++;
    return {got:got,max:max,pending:pending,dadOnly:true};
  }
  if(p.kind==='writing'){
    max=p.pts;
    var dm=lLoad(p.id+'-dad',null);
    if(dm!==null)got=dm;
    else pending.push({key:p.id+':'+p.n,part:p,n:p.n,max:p.pts,said:a.text||'',
                      sample:'Rubric: '+p.rubric.join(' · ')});
    return {got:got,max:max,pending:pending,dadOnly:true};
  }
  for(var i=0;i<p.questions.length;i++){
    var q=p.questions[i], key=String(q.n), given=a[key];
    max+=p.pts;
    if(p.kind==='multi'){
      var picked=given||[], right=0, wrong=0;
      for(var j=0;j<picked.length;j++){(q.ans.indexOf(picked[j])>=0?right++:wrong++);}
      if(wrong===0)got+=(right>=2?p.pts:right>=1?1:0);
    } else if(p.kind==='text'){
      var dmq=lLoad(p.id+'-dad-'+key,null);
      if(q.ans && norm(given)===norm(q.ans)) got+=p.pts;
      else if(dmq!==null) got+=dmq;
      else if(String(given||'').trim()!=='' || q.ans)
        pending.push({key:p.id+':'+key,part:p,n:q.n,max:p.pts,said:given||'',
                      sample:q.ans||q.sample||''});
    } else {
      if(given!==undefined && given!==null && String(given)===String(q.ans)) got+=p.pts;
    }
  }
  return {got:got,max:max,pending:pending,dadOnly:!!p.dadMarks};
}

function totals(){
  var got=0,max=0,pending=[];
  for(var i=0;i<PARTS.length;i++){
    var m=markPart(PARTS[i]);
    got+=m.got;max+=m.max;pending=pending.concat(m.pending);
  }
  return {got:got,max:max,pending:pending};
}

function partComplete(p){
  var a=getAns(p);
  if(p.kind==='speaking')return !!lLoad(p.id+'-seen',false);
  if(p.kind==='writing')return !!a.choice && String(a.text||'').trim().length>0;
  for(var i=0;i<p.questions.length;i++){
    var v=a[String(p.questions[i].n)];
    if(p.kind==='multi'){if(!v||v.length<2)return false;}
    else if(p.kind==='text'){if(String(v||'').trim()==='')return false;}
    else if(v===undefined||v===null||v==='')return false;
  }
  return true;
}
function isDone(p){return !!lLoad(p.id+'-done',false);}

/* ── the page ───────────────────────────────────────────────────────── */
/** Whether a section carries something that must stay in view while answering. */
function hasMedia(p){return !!(p.image||p.passage||p.audio);}

function mediaHtml(p){
  var h='';
  if(p.image){
    h+='<img src="'+esc(p.image)+'" alt="'+esc(p.imageAlt||'')+'" onclick="openLb(\''+esc(p.image)+'\')">'
      +'<button class="zoom" onclick="openLb(\''+esc(p.image)+'\')">See the picture bigger</button>';
  }
  if(p.passage){
    h+='<div class="passage"><h4>'+esc(p.passage.title)+'</h4>';
    for(var i=0;i<p.passage.paragraphs.length;i++)h+='<p>'+esc(p.passage.paragraphs[i])+'</p>';
    h+='</div>';
  }
  if(p.audio){
    h+='<div class="track-lbl">TR '+esc(p.track)+'</div>'
      +'<audio controls preload="none" src="'+esc(p.audio)+'"></audio>';
  }
  return h + boxHtml(p,false);
}

function boxHtml(p,pinned){
  if(!p.bank||p.kind==='buttons'||p.kind==='multi')return '';
  /* Q1's bank is the A–G labels printed on the picture itself, not a word box. */
  if(p.questions&&p.questions[0]&&p.questions[0].label&&p.bank.length<=7&&p.bank[0].length===1)return '';
  var h='<div class="box'+(pinned?' pin':'')+'">';
  for(var i=0;i<p.bank.length;i++)h+='<span>'+esc(p.bank[i])+'</span>';
  return h+'</div>';
}

function selectHtml(p,key,given,extraClass){
  var h='<select class="inl '+(extraClass||'')+(given?' filled':'')+'" onchange="onSelect(\''+p.id+'\',\''+esc(key)+'\',this)">'
    +'<option value=""></option>';
  for(var b=0;b<p.bank.length;b++){
    var v=p.bank[b];
    h+='<option value="'+esc(v)+'"'+(given===v?' selected':'')+'>'+esc(v)+'</option>';
  }
  return h+'</select>';
}

function questionsHtml(p){
  var a=getAns(p), h='';

  if(p.kind==='speaking'){
    var ticks=lLoad(p.id+'-ticks',[])||[], seen=!!lLoad(p.id+'-seen',false);
    h+='<div class="dad-note">Dad asks each question out loud. Leo answers from the picture. '
      +'1 point each.</div>';
    if(!seen)h+='<button class="sp-show" id="'+p.id+'-show" onclick="showPrompts(\''+p.id+'\')">Dad: show the 10 questions</button>';
    h+='<div id="'+p.id+'-prompts"'+(seen?'':' hidden')+'>';
    for(var s=0;s<p.prompts.length;s++){
      var pr=p.prompts[s];
      h+='<div class="sp'+(ticks[s]?' ok':'')+'" id="'+p.id+'-sp-'+s+'">'
        +'<button class="sp-tick" onclick="tickSp(\''+p.id+'\','+s+')">'+(ticks[s]?'✓':'')+'</button>'
        +'<div><div class="sp-q"><b>'+(s+1)+'. '+esc(pr.say)+'</b> '+esc(pr.q)+'</div>'
        +'<div class="sp-a">Expected: '+esc(pr.a)+'</div></div></div>';
    }
    return h+'</div>';
  }

  if(p.kind==='writing'){
    h+='<div class="item"><span class="num">'+p.n+'.</span><div class="body">';
    for(var w=0;w<p.prompts.length;w++){
      var pw=p.prompts[w];
      h+='<button class="opt'+(a.choice===pw.k?' picked':'')+'" style="display:block;width:100%;margin-bottom:5px;line-height:1.6" '
        +'onclick="pickWriting(\''+p.id+'\',\''+pw.k+'\')"><span class="k">'+pw.k+'.</span>'+pw.t+'</button>';
    }
    h+='<textarea class="lines" rows="6" oninput="typeWriting(\''+p.id+'\',this)">'+esc(a.text||'')+'</textarea>';
    return h+'</div></div>';
  }

  for(var i=0;i<p.questions.length;i++){
    var q=p.questions[i], key=String(q.n), given=a[key];
    h+='<div class="item">';

    if(p.kind==='select'){
      if(q.label){
        /* "1) ____" — the sheet's numbered sub-answers */
        h+='<span class="ilabel">'+esc(q.label)+'</span><div class="body">'+selectHtml(p,key,given,'short')+'</div>';
      } else if(p.blankFirst){
        /* "____ 30. The first electric skateboard was built in" */
        h+=selectHtml(p,key,given)+'<span class="num">'+esc(q.n)+'.</span>'
          +'<div class="body">'+esc(q.before)+'</div>';
      } else {
        h+='<span class="num">'+esc(q.n)+'.</span><div class="body">'
          +(q.before?esc(q.before)+' ':'')+selectHtml(p,key,given)+(q.after?' '+esc(q.after):'')+'</div>';
      }
    } else if(p.kind==='buttons'||p.kind==='multi'){
      var shown=p.kind==='multi'?(given||[]).join(', '):(given||'');
      h+='<span class="blank'+(shown?' filled':'')+'" id="'+p.id+'-bl-'+i+'">'+esc(shown)+'</span>'
        +'<span class="num">'+esc(q.n)+'.</span><div class="body">'+esc(q.stem)
        +'<div class="opts'+(q.options.length<=2?' two':'')+'" id="'+p.id+'-op-'+i+'">';
      for(var o=0;o<q.options.length;o++){
        var op=q.options[o];
        var on=(p.kind==='multi')?((given||[]).indexOf(op.k)>=0):(given===op.k);
        h+='<button class="opt'+(on?' picked':'')+'" data-k="'+esc(op.k)+'" onclick="'
          +(p.kind==='multi'?'toggleMulti':'pickOne')+'(\''+p.id+'\',\''+esc(key)+'\',\''+esc(op.k)+'\','+i+')">'
          +'<span class="k">'+esc(op.k)+'.</span>'+esc(op.t)+'</button>';
      }
      h+='</div></div>';
    } else if(p.kind==='text'){
      h+='<span class="num">'+esc(q.n)+'.</span><div class="body">'+esc(q.stem)
        +'<textarea class="lines" rows="2" oninput="typeText(\''+p.id+'\',\''+esc(key)+'\',this)">'+esc(given||'')+'</textarea></div>';
    }
    h+='</div>';
  }
  return h;
}

function sectionHtml(p,i){
  /* With a media panel the box rides inside it; without one it pins itself. */
  var inner = (hasMedia(p)?'':boxHtml(p,true))
            + (p.example?'<div class="example">'+esc(p.example)+'</div>':'')
            + '<div id="'+p.id+'-qs">'+questionsHtml(p)+'</div>';
  var body = hasMedia(p)
    ? '<div class="with-media"><div class="media">'+mediaHtml(p)+'</div><div class="qs">'+inner+'</div></div>'
    : inner;
  return '<section class="sec" id="'+p.id+'">'
    +'<div class="instr">'+(p.track?'<span class="tr">TR: '+esc(p.track)+'</span>':'')+esc(p.instr)+'</div>'
    +(p.sub?'<div class="sub">'+esc(p.sub)+'</div>':'')
    + body
    +'<div class="sec-foot">'
      +'<button class="f-done" id="'+p.id+'-done-btn" onclick="markDone(\''+p.id+'\')"></button>'
      +'<button class="f-redo" id="'+p.id+'-redo" onclick="redoPart(\''+p.id+'\')">Clear this section</button>'
      +'<span class="f-state" id="'+p.id+'-state"></span>'
    +'</div></section>';
}

function renderTest(){
  var h='';
  for(var i=0;i<PARTS.length;i++)h+=sectionHtml(PARTS[i],i);
  document.getElementById('test').innerHTML=h;
  for(var k=0;k<PARTS.length;k++){refreshFoot(PARTS[k].id);sizeLines(PARTS[k].id);}
  refreshBar();
}

/* Ruled textareas grow with what is written, so nothing is ever hidden. */
function grow(el){el.style.height='auto';el.style.height=(Math.ceil(el.scrollHeight/32)*32)+'px';}
function sizeLines(pid){
  var els=document.querySelectorAll('#'+pid+' .lines');
  for(var i=0;i<els.length;i++)grow(els[i]);
}

function refreshFoot(id){
  var p=partById(id), btn=document.getElementById(id+'-done-btn'), st=document.getElementById(id+'-state');
  if(!btn)return;
  var ok=partComplete(p), done=isDone(p);
  btn.disabled=!ok;
  btn.classList.toggle('is-done',done);
  btn.textContent=done?'Finished ✓':'Finished';
  st.textContent=done?'':(ok?'ready':'not finished yet');
  /* The done-key writes itself the moment the section is finished; the button
     is how Leo confirms it, not how the data gets saved. */
  if(ok&&!done){lSave(id+'-done',true);btn.classList.add('is-done');btn.textContent='Finished ✓';st.textContent='';}
  recordScore();
}

function refreshBar(){
  var done=0;for(var i=0;i<PARTS.length;i++)if(isDone(PARTS[i]))done++;
  document.getElementById('secCount').textContent=done+' of '+MC+' done';
  renderAnswers(done===MC);
}
var savedTimer;
function flashSaved(){
  var el=document.getElementById('saved');
  el.classList.add('on');clearTimeout(savedTimer);
  savedTimer=setTimeout(function(){el.classList.remove('on');},1200);
}

/* ── answering ──────────────────────────────────────────────────────── */
function onSelect(pid,key,el){
  setAns(partById(pid),key,el.value);
  el.classList.toggle('filled',el.value!=='');
  refreshFoot(pid);refreshBar();
}
function pickOne(pid,key,k,i){
  setAns(partById(pid),key,k);
  var opts=document.querySelectorAll('#'+pid+'-op-'+i+' .opt');
  for(var b=0;b<opts.length;b++)opts[b].classList.toggle('picked',opts[b].dataset.k===k);
  var bl=document.getElementById(pid+'-bl-'+i);
  bl.textContent=k;bl.classList.add('filled');
  refreshFoot(pid);refreshBar();
}
function toggleMulti(pid,key,k,i){
  var p=partById(pid),a=getAns(p),cur=(a[key]||[]).slice(),at=cur.indexOf(k);
  if(at>=0)cur.splice(at,1);else cur.push(k);
  setAns(p,key,cur);
  var opts=document.querySelectorAll('#'+pid+'-op-'+i+' .opt');
  for(var b=0;b<opts.length;b++)opts[b].classList.toggle('picked',cur.indexOf(opts[b].dataset.k)>=0);
  var bl=document.getElementById(pid+'-bl-'+i);
  bl.textContent=cur.join(', ');bl.classList.toggle('filled',cur.length>0);
  refreshFoot(pid);refreshBar();
}
function typeText(pid,key,el){setAns(partById(pid),key,el.value);grow(el);refreshFoot(pid);refreshBar();}
function pickWriting(pid,k){
  var p=partById(pid);setAns(p,'choice',k);
  var opts=document.querySelectorAll('#'+pid+'-qs .opt');
  for(var b=0;b<opts.length;b++)opts[b].classList.toggle('picked',opts[b].querySelector('.k').textContent===k+'.');
  refreshFoot(pid);refreshBar();
}
function typeWriting(pid,el){setAns(partById(pid),'text',el.value);grow(el);refreshFoot(pid);refreshBar();}
function showPrompts(pid){
  document.getElementById(pid+'-prompts').hidden=false;
  var b=document.getElementById(pid+'-show');if(b)b.remove();
  lSave(pid+'-seen',true);refreshFoot(pid);refreshBar();
}
function tickSp(pid,i){
  var t=(lLoad(pid+'-ticks',[])||[]).slice();
  t[i]=!t[i];lSave(pid+'-ticks',t);flashSaved();
  var row=document.getElementById(pid+'-sp-'+i);
  row.classList.toggle('ok',!!t[i]);
  row.querySelector('.sp-tick').textContent=t[i]?'✓':'';
  refreshFoot(pid);refreshBar();
}

function markDone(id){lSave(id+'-done',true);refreshFoot(id);refreshBar();}
var redoTimers={};
function redoPart(id){
  var btn=document.getElementById(id+'-redo');
  if(btn.dataset.armed){
    clearTimeout(redoTimers[id]);delete btn.dataset.armed;btn.textContent='Clear this section';
    var p=partById(id);
    lDrop(id+'-ans');lDrop(id+'-done');lDrop(id+'-ticks');lDrop(id+'-seen');lDrop(id+'-dad');
    if(p.questions)for(var i=0;i<p.questions.length;i++)lDrop(id+'-dad-'+p.questions[i].n);
    document.getElementById(id+'-qs').innerHTML=questionsHtml(p);
    sizeLines(id);refreshFoot(id);refreshBar();
    return;
  }
  btn.dataset.armed='1';btn.textContent='Tap again to clear';
  redoTimers[id]=setTimeout(function(){delete btn.dataset.armed;btn.textContent='Clear this section';},3000);
}

/* ── the answer section ─────────────────────────────────────────────── */
function recordScore(){
  var t=totals(), allDone=true;
  for(var i=0;i<PARTS.length;i++)if(!isDone(PARTS[i]))allDone=false;
  saveScore(t.got,t.max,allDone,{pending:t.pending.length});
  document.getElementById('hdScore').textContent=allDone?t.got:'';
}
function renderAnswers(unlocked){
  var el=document.getElementById('answers');
  if(!unlocked){
    var done=0;for(var i=0;i<PARTS.length;i++)if(isDone(PARTS[i]))done++;
    el.innerHTML='<h3>Answer Section</h3><div class="locked">Opens when all '+MC
      +' sections are finished — '+done+' so far. Go through it with Dad.</div>';
    return;
  }
  var t=totals();
  var h='<h3>Answer Section</h3>'
    +'<div class="total"><b>'+t.got+'</b><span>out of '+t.max+' points · '
    +(t.max?Math.round(t.got/t.max*100):0)+'%</span></div>';
  h+= t.pending.length
    ? '<div class="pend">'+t.pending.length+' answer'+(t.pending.length>1?'s are':' is')
      +' still for Dad to mark. The score goes up as he marks them.</div>'
    : '<div class="pend">Everything is marked. This is the final score.</div>';
  h+='<table class="brk">';
  for(var i=0;i<PARTS.length;i++){
    var p=PARTS[i],m=markPart(p);
    h+='<tr'+(m.pending.length?' class="open"':'')+'><td>'+(i+1)+'. '+esc(p.name)
      +'</td><td>'+m.got+' / '+m.max+'</td></tr>';
  }
  h+='</table>';
  for(var k=0;k<t.pending.length;k++){
    var pn=t.pending[k];
    h+='<div class="mark"><div class="mark-h">Question '+pn.n+' — Dad marks out of '+pn.max+'</div>'
      +'<div class="mark-said">'+(esc(pn.said)||'(nothing written)')+'</div>'
      +(pn.sample?'<div class="mark-key">'+esc(pn.sample)+'</div>':'')
      +'<div class="steps">';
    for(var s=0;s<=pn.max;s++)
      h+='<button class="step" onclick="dadMark(\''+pn.key+'\','+s+')">'+s+'</button>';
    h+='</div></div>';
  }
  el.innerHTML=h;
}
function dadMark(key,val){
  var bits=key.split(':'), pid=bits[0], qn=bits[1], p=partById(pid);
  if(p.kind==='writing')lSave(pid+'-dad',val);
  else lSave(pid+'-dad-'+qn,val);
  recordScore();refreshBar();
  document.getElementById('answers').scrollIntoView({block:'nearest'});
}

/* ── zoom ───────────────────────────────────────────────────────────── */
function openLb(src){
  document.getElementById('lb-img').src=src;
  document.getElementById('lb').classList.add('open');
}
function closeLb(){document.getElementById('lb').classList.remove('open');}

renderTest();
</script>
