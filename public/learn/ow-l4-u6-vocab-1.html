<style>

<script>
/* ═══════════════════════════════════════════════════════════════════════

   SAVE_PREFIX: leea-4-6-vocab-1-
   HOMEWORK_ID: leo-4-6-vocab-1
   moduleCount 13 (tabs 0-12) · moduleKeyFormat tab-{i}-done · scoreKey score (tab 11)

═══════════════════════════════════════════════════════════════════════ */
const SAVE_PREFIX='leea-4-6-vocab-1-';
const HOMEWORK_ID='leo-4-6-vocab-1';
const TAB_COUNT=13;
const TABS=[
 {icon:'📚',name:'Academic'},{icon:'🔥',name:'Warm Up'},{icon:'🎯',name:'Present'},
 {icon:'🃏',name:'Flashcards'},{icon:'🧠',name:'Sort'},{icon:'📖',name:'Reading'},
 {icon:'📝',name:'Practice'},{icon:'🔤',name:'Unscramble'},{icon:'🔗',name:'Match'},
 {icon:'☀️',name:'Apply'},{icon:'🎭',name:'Wrap Up'},{icon:'✅',name:'Quiz'},{icon:'⚽',name:'Dribble!'}
];
const TAB_INIT={},TAB_RESET={},TAB_RESTORE={};

function lSave(k,v){try{localStorage.setItem(SAVE_PREFIX+k,JSON.stringify(v));}catch(e){}}
function lLoad(k){try{const r=localStorage.getItem(SAVE_PREFIX+k);return r?JSON.parse(r):null;}catch(e){return null;}}
function lDel(k){try{localStorage.removeItem(SAVE_PREFIX+k);}catch(e){}}
function el(t,c,x){const n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n;}
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function boldWord(s,w){
  const stem=String(w).replace(/^(a|an|the)\s+/i,'').replace(/_/g,' ');
  try{return s.replace(new RegExp('('+stem.split(/\s+/).join('[-\\s]')+'\\w*)','i'),'<b>$1</b>');}catch(e){return s;}
}

/* ── TR 6.2, in the audio script's own running order. Never re-sorted: the
      Match recap has to read back in the order Leo hears the track. The shark

const WORDS=[
 {w:'pollution',    e:'🛢️', ipa:'pəˈluːʃən',       norm:'pollution', def:'trash or harmful things that make air, water, or land dirty', jp:'汚染（おせん）', tr:'There is too much pollution.'},
 {w:'a resource',   e:'♻️', ipa:'ˈriːsɔrs',        norm:'resource',  def:'something useful in nature, like water, fish, or trees',        jp:'資源（しげん）', tr:'We need to protect our resources.'},
 {w:'disappear',    e:'❌', ipa:'ˌdɪsəˈpɪr',       norm:'disappear', def:'to go away so it cannot be seen',                                jp:'消（き）える',   tr:'Animals and plants can disappear.'},
 {w:'a creature',   e:'🦀', ipa:'ˈkriːtʃər',       norm:'creature',  def:'a living animal, especially a strange or interesting one',       jp:'生き物（いきもの）', tr:'An octopus is a sea creature.'},
 {w:'a layer',      e:'🌊', ipa:'ˈleɪər',          norm:'layer',     def:'one level of something — like the top, middle, or bottom of the ocean', jp:'層（そう）', tr:'Most fish live in the top layer of the water.'},
 {w:'a zone',       e:'🌍', ipa:'zoʊn',            norm:'zone',      def:'a part or area, like one section of the ocean',                  jp:'区域（くいき）', tr:'The top layer is the sunlit zone.'},
 {w:'sunlight',     e:'☀️', ipa:'ˈsʌnlaɪt',        norm:'sunlight',  def:'the light that comes from the sun',                              jp:'日光（にっこう）', tr:'Plants need sunlight.'},
 {w:'midnight',     e:'🌌', ipa:'ˈmɪdnaɪt',        norm:'midnight',  def:'the middle of the night — also the name for the deepest, darkest ocean zone', jp:'真夜中（まよなか）', tr:'The midnight zone is very dark.'},
 {w:'a whale',      e:'🐋', ipa:'weɪl',            norm:'whale',     def:'a very large sea animal that breathes air',                      jp:'クジラ',        tr:'The whale is the biggest sea creature.'},
 {w:'a squid',      e:'🦑', ipa:'skwɪd',           norm:'squid',     def:'a sea animal with a long body and many arms',                    jp:'イカ',          tr:'Are all squid red?'},
 {w:'a dolphin',    e:'🐬', ipa:'ˈdɒlfɪn',         norm:'dolphin',   def:'a smart sea animal that lives in groups and breathes air',       jp:'イルカ',        tr:'Dolphins are very friendly.'},
 {w:'fish',         e:'🐟', ipa:'fɪʃ',             norm:'fish',      def:'an animal with fins and gills that lives in water',              jp:'魚（さかな）',  tr:'There are many fish in the sunlit zone.'},
 {w:'a shark',      e:'🦈', ipa:'ʃɑrk',            norm:'shark',     def:'a large fish with sharp teeth that lives in the ocean',          jp:'サメ',          tr:'A shark lives in the sunlit zone.'},
 {w:'a sea turtle', e:'🐢', ipa:'siː ˈtɜrtəl',     norm:'sea turtle',def:'a turtle that lives in the ocean and swims with flippers',       jp:'ウミガメ',      tr:'A sea turtle can swim fast.'},

 {w:'sea sponges',  e:'🧽', ipa:'siː ˈspʌndʒɪz',   norm:'sea sponges',def:'soft sea animals that live on the ocean floor',                 jp:'海綿（かいめん）', tr:'Sea sponges are colorful.'}
];

/* Academic Language for Unit 6, from the unit's academicWordIds. */
const ACADEMIC=[
 {w:'obligation', e:'⚖️', ipa:'ˌɒbləˈɡeɪʃən', def:'something you must or have to do — a duty or rule',  jp:'義務（ぎむ）',   s:'We use have to and must to talk about an obligation.'},

 {w:'definition', e:'🏷️', ipa:'ˌdɛfəˈnɪʃən', def:'a statement that tells what a word or idea means',   jp:'定義（ていぎ）', s:'The reading gives a definition of the word polyps.'},

/* ── progress + footers (save/restore rules 1, 4, 5) ── */
function refreshProgress(){

/* ── answer-position variation ──────────────────────────────────────────
   The authored MCQ data lists the correct option first so it is readable in
   the source. Left alone, Leo could score 100% on every quiz by always
   tapping the top button, so each item is permuted here — deterministically
   from its own question text, so the layout is stable across reloads and a
   restored answer still lines up with the option it was saved against. */
function hashText(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h>>>0;}
/* splitmix32. A plain LCG was tried first and its low bits cycle, which
   produced a shuffle that never picked option A — so consume the high bits. */
function mix32(a){a=(a+0x9e3779b9)>>>0;let z=a;z=Math.imul(z^(z>>>16),0x21f0aaad)>>>0;z=Math.imul(z^(z>>>15),0x735a2d97)>>>0;return (z^(z>>>15))>>>0;}
function varyItem(item){
  if(!item||!Array.isArray(item.opts)||typeof item.correct!=='number')return item;
  const answer=item.opts[item.correct];
  const opts=item.opts.slice();
  let state=hashText(String(item.q));
  for(let i=opts.length-1;i>0;i--){
    state=mix32(state);
    const j=Math.floor((state/4294967296)*(i+1));
    const t=opts[i];opts[i]=opts[j];opts[j]=t;
  }
  item.opts=opts;item.correct=opts.indexOf(answer);
  return item;
}
function varyAll(list){list.forEach(varyItem);return list;}

function gapItems(list,n,seed){
  return list.slice(0,n).map((w,i)=>{

    let q=w.tr;
    try{q=w.tr.replace(new RegExp(stem.split(/\s+/).join('[-\\s]')+'\\w*','i'),'______');}catch(e){}

    return {q:q,opts:opts,correct:opts.indexOf(w.w),jp:w.jp};
  });
}

    function solve(){row.classList.add('filled');inp.value=letters;inp.disabled=true;ck.disabled=true;ck.textContent='✓';}
    ck.onclick=()=>{
      if(inp.value.trim().toLowerCase()===letters.toLowerCase()){
        if(st.indexOf(i)<0)st.push(i);lSave('tab-7-solved',st);solve();up();
      }else{row.classList.add('err');setTimeout(()=>row.classList.remove('err'),400);}
    };
    inp.onkeydown=(ev)=>{if(ev.key==='Enter')ck.onclick();};
    if(st.indexOf(i)>=0)solve();
  });
  srcPill(h,'unit-6/vocabulary.json');
  function up(){c.textContent=st.length+' / '+pick.length;if(st.length>=pick.length)markDone(7);}
  up();
};

TAB_INIT[8]=function(){

  h.appendChild(hdr('🔗 Match','TR 6.2 — Listen and repeat'));
  h.appendChild(hint('Match each word to the sentence the audio actually says, so you know how it sounds in a real sentence.'));
  const st=lLoad('tab-8-matched')||[];

  const grid=el('div','mgrid'),left=el('div','mcol'),right=el('div','mcol');
  grid.appendChild(left);grid.appendChild(right);h.appendChild(grid);
  const recap=el('div','mrecap');
  recap.appendChild(el('div','mrecap-title','📼 Audio-script order — Word · Emoji · Sentence'));
  const table=document.createElement('table');recap.appendChild(table);h.appendChild(recap);
  /* Rows are pre-rendered hidden in TR order and revealed in place, so the
     recap always reads back in the order Leo hears — never match order. */
  const rows={};
  WORDS.forEach((w,i)=>{
    const tr=document.createElement('tr');tr.style.display='none';
    const a=document.createElement('td');a.className='mr-word';a.textContent=w.w;
    const b=document.createElement('td');b.className='mr-emoji';b.textContent=w.e;
    const d=document.createElement('td');d.className='mr-sent';d.textContent=w.tr;
    tr.appendChild(a);tr.appendChild(b);tr.appendChild(d);table.appendChild(tr);rows[i]=tr;
  });
  const L={},R={};let sel=null;
  WORDS.forEach((w,i)=>{
    const b=el('button','mitem',w.e+'  '+w.w);b.dataset.idx=String(i);
    b.onclick=()=>{if(b.classList.contains('lock'))return;if(sel)sel.classList.remove('sel');sel=b;b.classList.add('sel');};
    L[i]=b;left.appendChild(b);
  });
  shuffle(WORDS.map((_,i)=>i)).forEach(i=>{
    const b=el('button','mitem m-right',WORDS[i].tr);
    b.onclick=()=>{
      if(!sel||b.classList.contains('lock'))return;
      if(Number(sel.dataset.idx)===i){
        sel.classList.remove('sel');sel.classList.add('lock');b.classList.add('lock');
        if(st.indexOf(i)<0)st.push(i);lSave('tab-8-matched',st);
        rows[i].style.display='';recap.classList.add('show');sel=null;up();
      }else{b.classList.add('err');setTimeout(()=>b.classList.remove('err'),400);}
    };
    R[i]=b;right.appendChild(b);
  });
  srcPill(h,'Student Book TR 6.2 · the shark line is the card example — TR 6.2 is truncated there in the source');
  st.forEach(i=>{L[i].classList.add('lock');R[i].classList.add('lock');rows[i].style.display='';recap.classList.add('show');});
  function up(){c.textContent=st.length+' / '+WORDS.length;if(st.length>=WORDS.length)markDone(8);}
  up();
};

/* ═══ TAB 11 — QUIZ (scored — the only tab that writes `score`) ═══ */
const QUIZ=[
 {q:'Which word means “trash or harmful things that make water dirty”?',opts:['pollution','a resource','a layer'],correct:0,jp:'汚染（おせん）'},
 {q:'Which word means “a part or area of the ocean”?',opts:['a zone','a creature','midnight'],correct:0,jp:'区域（くいき）'},
 {q:'“Most fish live in the top ______ of the water.”',opts:['layer','zone','resource'],correct:0,jp:'層（そう）'},
 {q:'Which sea animal breathes air and is the biggest?',opts:['a whale','a shark','a squid'],correct:0,jp:'クジラです。'},
 {q:'“We need to protect our ______.”',opts:['resources','creatures','layers'],correct:0,jp:'資源を守る必要があります。'},
 {q:'Which creature has eight arms?',opts:['an octopus','a sea turtle','a dolphin'],correct:0,jp:'タコです。'},
 {q:'“Animals and plants can ______.”',opts:['disappear','sunlight','midnight'],correct:0,jp:'消えてしまうことがあります。'},
 {q:'Which word names the deepest, darkest ocean zone?',opts:['midnight','sunlight','twilight'],correct:0,jp:'midnight zone です。'},
 {q:'Sea sponges live ______.',opts:['on the ocean floor','in the sky','on the beach'],correct:0,jp:'海綿は海底にすんでいます。'},
 {q:'Which word means “a living animal, especially a strange one”?',opts:['a creature','a resource','a layer'],correct:0,jp:'生き物（いきもの）'},
 {q:'“Plants need ______.”',opts:['sunlight','pollution','garbage'],correct:0,jp:'植物には日光が必要です。'},
 {q:'A sea turtle swims with its ______.',opts:['flippers','arms','fins and gills'],correct:0,jp:'ウミガメはひれ足で泳ぎます。'}
];
TAB_INIT[11]=function(){
  const h=document.getElementById('body-11');
  h.appendChild(hdr('✅ Vocabulary Quiz','12 questions — 10 or more to pass'));
  const active=el('div'),result=el('div');h.appendChild(active);h.appendChild(result);
  const saved=lLoad('score');
  const bar=el('div','quiz-progress');active.appendChild(bar);
  const card=el('div','qcard');active.appendChild(card);
  let cur=0,score=0,wrong=[];
  const PASS=10;
  function render(){
    bar.innerHTML='';
    QUIZ.forEach((_,i)=>bar.appendChild(el('div','qdot'+(i<cur?' on':'')+(i===cur?' now':''))));
    card.innerHTML='';
    const it=QUIZ[cur];
    card.appendChild(el('div','qtext',(cur+1)+'. '+it.q));
    const grp=el('div','opt-group');
    it.opts.forEach((t,oi)=>{
      const b=el('button','opt',t);
      b.onclick=()=>{
        const all=grp.querySelectorAll('.opt');
        for(let i=0;i<all.length;i++){all[i].disabled=true;if(i===it.correct)all[i].classList.add('good');}
        if(oi===it.correct)score++;else{b.classList.add('bad');wrong.push(cur+1);}
        if(it.jp)card.appendChild(el('div','jp-note','🇯🇵 '+it.jp));
        setTimeout(()=>{cur++;if(cur>=QUIZ.length)finish();else render();},900);
      };
      grp.appendChild(b);
    });
    card.appendChild(grp);
  }
  function finish(){
    saveScore(score,QUIZ.length,{pass:score>=PASS,wrongQuestions:wrong});
    show({score:score,total:QUIZ.length,percent:Math.round(score/QUIZ.length*100),pass:score>=PASS,wrongQuestions:wrong});
    markDone(11);
  }
  /* Rule 3: a finished quiz comes back as its result, never restarted. */
  function show(rec){
    active.style.display='none';result.innerHTML='';
    const pass=rec.pass!=null?rec.pass:rec.score>=PASS;
    const box=el('div','result-card '+(pass?'pass':'fail'));
    box.appendChild(el('div','result-trophy',pass?'🏆':'💪'));
    box.appendChild(el('div','result-score',rec.score+' / '+rec.total));
    box.appendChild(el('div','result-sub',pass?'You passed! '+rec.percent+'%':'Almost — you need '+PASS+' to pass. Tap ↺ Redo to try again.'));
    if(rec.wrongQuestions&&rec.wrongQuestions.length)box.appendChild(el('div','result-sub','Look again at question(s): '+rec.wrongQuestions.join(', ')));
    result.appendChild(box);
    markDone(11,true);
  }
  if(saved&&saved.done){show(saved);}else{render();}
  srcPill(h,'Formative assessment — Vocabulary 1');
};

/* ── small helpers used by the tabs above ── */
function hdr(title,sub){
  const d=el('div');d.appendChild(el('div','section-title',title));
  if(sub)d.appendChild(el('div','section-sub',sub));return d;
}
function hint(text){return el('div','dad-hint',text);}
function rebuild(i){
  const body=document.getElementById('body-'+i);
  body.innerHTML='';
  TAB_INIT[i]._done=false;TAB_INIT[i]();TAB_INIT[i]._done=true;
}

/* ── boot ── */
(function(){
  const nav=document.getElementById('tab-nav'),stack=document.getElementById('tab-stack');
  TABS.forEach((t,i)=>{
    const b=el('button','tab-btn');b.id='tb'+i;
    b.appendChild(el('span','tab-icon',t.icon));
    b.appendChild(el('span','tab-name',t.name));
    b.onclick=()=>showTab(i);
    nav.appendChild(b);
    const pane=el('div','tab-content');pane.id='tc'+i;
    const body=el('div','tab-body');body.id='body-'+i;pane.appendChild(body);
    const banner=el('div','done-banner','Nice work! Mark it below.');banner.id='banner-'+i;body.appendChild(banner);
    const foot=el('div','tab-footer');
    const redo=el('button','btn-redo','↺ Redo');redo.id='redo-'+i;redo.onclick=()=>doRedo(i);
    const done=el('button','btn-complete','Mark '+t.name+' complete ✓');done.id='complete-'+i;done.disabled=true;
    done.onclick=()=>markDone(i);
    foot.appendChild(redo);foot.appendChild(done);pane.appendChild(foot);
    stack.appendChild(pane);
  });
  const last=lLoad('last-tab');
  showTab(typeof last==='number'&&last>=0&&last<TAB_COUNT?last:0);
  refreshProgress();
})();
</script>
