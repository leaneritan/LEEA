<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leo · Unit 1 · Reading — Tornado Trouble</title>
<script src="/components/charts.js"></script>
<script src="/components/wordweb.js"></script>
<script src="/components/chart-picker.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=Noto+Sans+JP:wght@400;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=Noto+Sans+JP:wght@400;700&display=swap"></noscript>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --or:#EA580C;--or-d:#9A3412;--or-l:#FFF7ED;--or-b:#FED7AA;
  --sky:#0369A1;--sky-d:#0C4A6E;--sky-l:#F0F9FF;--sky-b:#BAE6FD;
  --pur:#7C3AED;--pur-l:#F5F3FF;--pur-b:#DDD6FE;
  --red:#DC2626;--red-l:#FEF2F2;--red-b:#FECACA;
  --amber:#F59E0B;--amber-l:#FFFBEB;--yellow:#FACC15;--yellow-b:#FDE68A;
  --green:#16A34A;--green-d:#15803D;--green-l:#F0FDF4;--green-b:#BBF7D0;
  --ink:#111;--ink-2:#374151;--ink-3:#6B7280;--border:#E5E7EB;
  --paper:#FFFDF8;--navy:#0f172a;--storm:#334155;
}
html,body{height:100%;font-family:'Outfit',sans-serif;background:var(--paper);color:var(--ink)}
body{display:flex;flex-direction:column}
.jp{font-family:'Noto Sans JP','Outfit',sans-serif}

.app-header{background:linear-gradient(120deg,var(--storm),var(--sky));color:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.app-header .logo{font-size:24px}
.app-header .title{font-size:19px;font-weight:800;line-height:1.1}
.app-header .subtitle{font-size:13px;opacity:.9;margin-top:2px}
.app-header .badge-row{margin-left:auto;display:flex;gap:8px;align-items:center}
.prog-pill{background:rgba(255,255,255,.22);border-radius:20px;padding:5px 14px;font-size:13px;font-weight:700;white-space:nowrap}
.dad-btn{background:rgba(255,255,255,.18);color:#fff;border:2px solid rgba(255,255,255,.5);border-radius:20px;padding:5px 12px;font-size:13px;font-weight:800;font-family:'Outfit',sans-serif;cursor:pointer;white-space:nowrap}

/* LANDING */
.landing-screen{flex:1;display:flex;align-items:center;justify-content:center;padding:30px 16px;gap:20px;background:linear-gradient(135deg,#F1F5F9,#E0F2FE);overflow-y:auto;flex-wrap:wrap}
.mode-card{background:#fff;border:3px solid var(--border);border-radius:18px;padding:30px 24px;font-family:'Outfit',sans-serif;cursor:pointer;min-width:260px;max-width:360px;flex:1;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.08)}
.mode-card:hover{transform:translateY(-3px)}
.mode-card.sb{border-color:var(--sky)}
.mode-card.wb{border-color:var(--or)}
.mc-icon{font-size:66px;line-height:1}
.mc-title{font-size:24px;font-weight:900}
.mode-card.sb .mc-title{color:var(--sky-d)}
.mode-card.wb .mc-title{color:var(--or-d)}
.mc-sub{font-size:14px;color:var(--ink-3);line-height:1.5}
.mc-prog{background:#F3F4F6;color:var(--ink-2);padding:6px 14px;border-radius:99px;font-size:12px;font-weight:800;margin-top:6px}
.mode-card.sb .mc-prog.has-prog{background:var(--sky);color:#fff}
.mode-card.wb .mc-prog.has-prog{background:var(--or);color:#fff}
.mode-pane{flex:1;display:none;flex-direction:column;overflow:hidden}
.mode-back-bar{background:#fff;border-bottom:1px solid var(--border);padding:5px 14px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.mode-back-bar button{background:none;border:2px solid var(--border);border-radius:8px;padding:4px 10px;font-size:12px;font-weight:700;color:var(--ink-2);cursor:pointer;font-family:'Outfit',sans-serif}
.mode-label{font-size:13px;font-weight:800}

/* TAB NAV */
.tab-nav{display:flex;overflow-x:auto;background:#fff;border-bottom:2px solid var(--border);flex-shrink:0;scrollbar-width:none}
.tab-nav::-webkit-scrollbar{display:none}
.tab-btn{flex-shrink:0;padding:10px 12px;font-weight:700;font-family:'Outfit',sans-serif;border:none;background:none;cursor:pointer;color:var(--ink-3);border-bottom:3px solid transparent;margin-bottom:-2px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;min-width:76px}
.tab-btn .tab-icon{font-size:18px}
.tab-btn .tab-name{font-size:11px;letter-spacing:.3px}
.tab-btn.active{color:var(--sky);border-bottom-color:var(--sky)}
#wb-mode .tab-btn.active{color:var(--or);border-bottom-color:var(--or)}
.tab-btn.done::after{content:'✓';position:absolute;top:4px;right:6px;color:var(--green);font-weight:900;font-size:12px}

.tab-content{display:none;flex:1;overflow-y:auto;flex-direction:column}
.tab-content.active{display:flex}
.tab-body{flex:1;padding:18px 20px;display:flex;flex-direction:column;gap:14px;max-width:900px;width:100%;margin:0 auto}
.tab-footer{flex-shrink:0;border-top:2px solid var(--border);background:#fff;padding:10px 20px;display:flex;gap:10px}
.section-title{font-size:21px;font-weight:900;color:var(--navy)}
.section-sub{font-size:14px;color:var(--ink-3);font-weight:600;margin-top:2px}
.dad-hint{background:var(--amber-l);border:2px solid var(--yellow-b);border-radius:12px;padding:10px 16px;font-size:14px;font-weight:600;color:var(--ink-2);line-height:1.45}
.klabel{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--sky);margin-top:10px;display:flex;align-items:center;gap:8px}
.klabel .kdone{display:none;color:var(--green);letter-spacing:0;text-transform:none}
.klabel.ok .kdone{display:inline}
.blk{display:flex;flex-direction:column;gap:12px}

.btn-complete{flex:1;background:var(--green);color:#fff;border:none;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:800;font-family:'Outfit',sans-serif;cursor:pointer}
.btn-complete:disabled{background:var(--border);color:var(--ink-3);cursor:not-allowed}
.btn-complete.confirmed{background:var(--green-d)}
.btn-redo{width:110px;flex-shrink:0;background:#fff;color:var(--red);border:2px solid var(--red-b);border-radius:12px;padding:12px 8px;font-size:13px;font-weight:800;font-family:'Outfit',sans-serif;cursor:pointer}
.btn-redo.armed{background:var(--red-l);border-color:var(--red)}
.done-banner{display:none;background:var(--green-l);border:2px solid var(--green-b);border-radius:12px;padding:12px 18px;font-size:16px;font-weight:800;color:var(--green-d);text-align:center}
.done-banner.show{display:block;animation:pop .35s}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.shake{animation:shake .35s}

/* MCQ */
.opt{display:block;width:100%;text-align:left;background:#fff;border:3px solid var(--border);border-radius:12px;padding:11px 16px;font-size:16px;font-weight:700;color:var(--ink);cursor:pointer;font-family:'Outfit',sans-serif;margin-top:8px}
.opt:hover{border-color:var(--sky)}
.opt.good{background:var(--green-l);border-color:var(--green);color:var(--green-d)}
.opt.bad{background:var(--red-l);border-color:var(--red);animation:shake .35s}
.opt:disabled{cursor:default}
.opt:disabled:not(.good){opacity:.55}
.opt2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt2 .opt{text-align:center}
.qcard{background:#fff;border:3px solid var(--border);border-radius:14px;padding:14px 18px}
.qcard.solved{border-color:var(--green-b)}
.qcard.missed{border-color:var(--amber)}
.qtext{font-size:16px;font-weight:800;color:var(--navy);line-height:1.4}
.qclue{font-size:13px;color:var(--ink-3);font-weight:700;margin-bottom:4px}
.qwhy{display:none;margin-top:8px;font-size:14px;color:var(--green-d);font-weight:700}
.qcard.solved .qwhy{display:block}
.qjp{display:none;margin-top:4px;font-size:13px;color:var(--ink-3)}
.qcard.solved .qjp{display:block}
.quiz-fb{margin-top:8px;font-weight:700;font-size:14px;min-height:0}
.quiz-fb.ok{color:var(--green-d)}.quiz-fb.no{color:var(--red)}.quiz-fb.show{color:#92400E}

/* FLASHCARDS */
.flashcard-wrap{perspective:1000px;min-height:270px;cursor:pointer;max-width:560px;width:100%;margin:0 auto}
.flashcard{width:100%;min-height:270px;position:relative;transform-style:preserve-3d;transition:transform .5s ease}
.flashcard.flipped{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:8px;text-align:center}
.fc-front{background:linear-gradient(135deg,var(--storm),var(--sky));color:#fff;border:4px solid var(--sky-b)}
#wb-mode .fc-front{background:linear-gradient(135deg,var(--or-d),var(--or));border-color:var(--or-b)}
.fc-back{background:linear-gradient(135deg,#fff,var(--sky-l));border:4px solid var(--sky);transform:rotateY(180deg)}
.fc-emoji{font-size:54px;line-height:1}
.fc-word{font-size:30px;font-weight:900}
.fc-pos{font-size:13px;font-weight:700;background:rgba(255,255,255,.22);border-radius:12px;padding:3px 12px}
.fc-def{font-size:16px;color:var(--ink-2);font-weight:700;line-height:1.35}
.fc-tap{font-size:12px;font-weight:700;opacity:.8;letter-spacing:.06em}
.fc-sample{font-size:15px;background:#fff;border:2px solid var(--sky-b);border-radius:10px;padding:7px 12px;font-weight:700;color:var(--sky-d)}
.fc-jp{font-size:14px;color:var(--ink-3);font-weight:700;display:none}
.fc-jp.revealed{display:block}
.fc-jp-btn{background:none;border:1px dashed #D1D5DB;border-radius:20px;padding:4px 14px;font-size:12px;font-weight:700;color:var(--ink-3);cursor:pointer;font-family:'Outfit',sans-serif}
.fc-nav{display:flex;justify-content:space-between;align-items:center;margin-top:12px;max-width:560px;width:100%;margin-left:auto;margin-right:auto}
.fc-nav button{background:var(--navy);color:#fff;border:none;border-radius:10px;padding:9px 18px;font-weight:800;font-family:'Outfit',sans-serif;cursor:pointer}
.fc-dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.fc-dot{width:9px;height:9px;border-radius:50%;background:var(--border)}
.fc-dot.seen{background:var(--sky-b)}
.fc-dot.on{background:var(--sky)}

/* MATCH */
.match-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:12px}
.mcol{display:flex;flex-direction:column;gap:8px}
.mbtn{background:#fff;border:3px solid var(--border);border-radius:12px;padding:10px 12px;font-size:15px;font-weight:700;font-family:'Outfit',sans-serif;text-align:left;cursor:pointer;color:var(--ink)}
.mbtn.sel{border-color:var(--amber);background:var(--amber-l)}
.mbtn.matched{border-color:var(--green-b);background:var(--green-l);color:var(--green-d);opacity:.8;cursor:default}
.mbtn.err{animation:shake .35s;border-color:var(--red)}

/* TYPED */
.type-row{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
.type-row .pre{font-size:17px;font-weight:800;color:var(--navy)}
.type-in{flex:1;min-width:160px;border:3px solid var(--border);border-radius:12px;padding:11px 14px;font-size:17px;font-family:'Outfit',sans-serif;font-weight:700}
.type-in:focus{outline:none;border-color:var(--sky)}
.type-go{background:var(--sky);color:#fff;border:none;border-radius:12px;padding:10px 18px;font-size:18px;font-weight:900;cursor:pointer;font-family:'Outfit',sans-serif}
.type-go:disabled{opacity:.4}
.long-in{width:100%;min-height:150px;border:3px solid var(--border);border-radius:12px;padding:12px 14px;font-size:16px;font-family:'Outfit',sans-serif;line-height:1.6;resize:vertical}
.long-in:focus{outline:none;border-color:var(--sky)}
.counter{font-size:13px;font-weight:800;color:var(--ink-3);margin-top:6px}
.counter b.ok{color:var(--green-d)}

/* SORT restore */
.sort-static{display:grid;gap:12px}
.sort-static .col{border:2px solid var(--green-b);border-radius:12px;overflow:hidden;background:#fff}
.sort-static .col h4{padding:8px 12px;color:#fff;font-size:15px}
.sort-static .col div{padding:6px 12px;font-size:14px;font-weight:700;border-top:1px solid var(--border)}
.sort-host .dnd-tile{white-space:normal !important;font-size:15px !important;padding:8px 14px !important}

/* ORDER + FIND */
.ord-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.ord-done{background:var(--green-l);border:2px solid var(--green-b);border-radius:10px;padding:8px 12px;font-weight:700;color:var(--green-d);font-size:15px}
.ord-done b{display:inline-block;min-width:26px}
.ord-bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tile{background:#fff;border:3px solid var(--sky-b);border-radius:12px;padding:9px 14px;font-size:15px;font-weight:700;cursor:pointer;font-family:'Outfit',sans-serif;color:var(--ink);text-align:left}
.tile:hover{border-color:var(--sky)}
.tile.found{background:var(--green-l);border-color:var(--green);color:var(--green-d);cursor:default}
.tile.nope{background:var(--red-l);border-color:var(--red);animation:shake .35s}
.tile.nope-done{opacity:.45;border-style:dashed;cursor:default}
.find-count{font-size:13px;font-weight:800;color:var(--sky-d);margin-top:6px}

/* PASSAGE */
.passage-block{background:#fff;border:3px solid var(--sky-b);border-radius:14px;padding:16px 20px;font-size:18px;line-height:1.85}
.passage-block .pnum{font-size:12px;font-weight:900;letter-spacing:.12em;color:var(--sky);display:block;margin-bottom:4px}
.passage-block .tag{background:#DBEAFE;border-bottom:2px solid var(--sky);padding:0 4px;border-radius:4px;font-weight:800;cursor:pointer}
.passage-block .sig{background:#FEF3C7;border-bottom:2px solid var(--amber);padding:0 4px;border-radius:4px;font-weight:800;cursor:pointer}
.passage-block b.kw{color:var(--or-d)}
.gloss{display:none;margin-top:8px;background:var(--sky-l);border-radius:10px;padding:8px 12px;font-size:15px;font-weight:700;color:var(--sky-d)}
.gloss.show{display:block}
.para{display:flex;flex-direction:column;gap:10px}
.para.locked{opacity:.35;pointer-events:none;filter:grayscale(1)}
.para .lock-note{display:none;font-size:13px;font-weight:800;color:var(--ink-3)}
.para.locked .lock-note{display:block}
.fact-box{background:var(--pur-l);border:2px solid var(--pur-b);border-radius:14px;padding:12px 16px;font-size:16px;font-weight:700;color:#4C1D95}

/* CHART */
.cmp-table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;border:2px solid var(--border)}
.cmp-table th{background:var(--storm);color:#fff;padding:10px;text-align:left;font-size:14px}
.cmp-table td{padding:9px 10px;border-top:1px solid var(--border);font-size:15px;font-weight:700}
.cmp-table td.q{color:var(--ink-3)}
.cmp-table td.a{color:var(--green-d);background:var(--green-l)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#fff;border:2px solid var(--sky-b);border-radius:20px;padding:5px 12px;font-size:14px;font-weight:700}
.web-host{min-height:80px}

/* QUIZ */
.quiz-progress{display:flex;gap:5px}
.quiz-progress div{flex:1;height:8px;border-radius:4px;background:var(--border)}
.quiz-progress div.answered{background:var(--sky)}
.quiz-result{text-align:center;padding:16px}
.quiz-result .trophy{font-size:66px}
.quiz-result .qscore{font-size:36px;font-weight:900;color:var(--navy);margin:8px 0}
.wrong-review{background:var(--red-l);border:2px solid var(--red-b);border-radius:10px;padding:10px 14px;text-align:left;margin-top:8px;font-size:14px;line-height:1.5}

/* DAD */
.dad-ov{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:80;display:none;align-items:flex-end;justify-content:center}
.dad-ov.open{display:flex}
.dad-modal{background:var(--paper);width:100%;max-width:760px;max-height:90vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden}
.dad-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:#fff;border-bottom:2px solid var(--border);font-size:17px}
.dad-x{background:var(--border);border:none;border-radius:10px;padding:8px 12px;font-weight:800;font-family:'Outfit',sans-serif;cursor:pointer}
.dad-body{padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.dad-sec{background:#fff;border:2px solid var(--border);border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.5}
.dad-sec h4{font-size:15px;color:var(--navy);margin-bottom:4px}
.dad-row{color:var(--red);border-top:1px solid var(--border);padding:4px 0}
.dad-row i{color:var(--ink-2)}
@media (max-width:620px){
  .match-grid{grid-template-columns:1fr}.sort-static{grid-template-columns:1fr !important}
  .tab-body{padding:14px 16px}.app-header .subtitle{display:none}
  .sort-host .dnd-zones{flex-direction:column}
  .badge-row{flex-direction:column;align-items:flex-end}
}
</style>
</head>
<body>

<div class="app-header">
  <div class="logo">🌪️</div>
  <div>
    <div class="title">Unit 1 · Reading — Tornado Trouble</div>
    <div class="subtitle">Extreme Weather · SB pp. 16–17 · TR 1.8 · WB pp. 8–9</div>
  </div>
  <div class="badge-row"><button class="dad-btn" onclick="openDad()">👨 Dad’s view</button><div class="prog-pill" id="prog-pill">0 / 13 done</div></div>
</div>

<div class="landing-screen" id="landing">
  <button class="mode-card sb" onclick="enterMode('sb')">
    <div class="mc-icon">📘</div>
    <div class="mc-title">Student Book</div>
    <div class="mc-sub">Tornado Trouble — storm chasing with Josh Wurman · the slides, again on your own · 8 tabs</div>
    <div class="mc-prog" id="mc-prog-sb">0 / 8 done</div>
  </button>
  <button class="mode-card wb" onclick="enterMode('wb')">
    <div class="mc-icon">📒</div>
    <div class="mc-title">Workbook</div>
    <div class="mc-sub">Weather Change — WB pp. 8–9 · TR 1.3 · 5 tabs</div>
    <div class="mc-prog" id="mc-prog-wb">0 / 5 done</div>
  </button>
</div>

<div class="mode-pane" id="sb-mode">
  <div class="mode-back-bar"><button onclick="backToLanding()">◀ Back to menu</button><span class="mode-label">📘 Student Book — Tornado Trouble</span></div>
  <div class="tab-nav" id="nav-sb"></div>
  <div id="panes-sb" style="flex:1;display:flex;flex-direction:column;overflow:hidden"></div>
</div>

<div class="mode-pane" id="wb-mode">
  <div class="mode-back-bar"><button onclick="backToLanding()">◀ Back to menu</button><span class="mode-label">📒 Workbook — Weather Change</span></div>
  <div class="tab-nav" id="nav-wb"></div>
  <div id="panes-wb" style="flex:1;display:flex;flex-direction:column;overflow:hidden"></div>
</div>

<div class="dad-ov" id="dad-ov"><div class="dad-modal">
  <div class="dad-head"><b>👨 Dad’s view — Leo’s wrong first tries</b><button class="dad-x" onclick="closeDad()">✕ Close</button></div>
  <div class="dad-body" id="dad-body"></div>
</div></div>
<script>
/* ═════════════════════════════════════════════════════════════════════
   LEVEL 5 UNIT 1 READING — LEO APP (Tornado Trouble + Weather Change)
   SAVE_PREFIX: leea-5-1-reading- · HOMEWORK_ID: leo-5-1-reading
   moduleCount 13 = 📘 SB 8 (tab-{i}-done, i 0-7) + 📒 WB 5 (wb-tab-{i}-done, i 0-4)
   Quiz scores: score (SB tab 4) · wb-score (WB tab 4) · last-mode / last-tab / wb-last-tab

   A COMPANION TO THE TEACHER DECK (public/lessons/ow-l5-u1-reading.html).
   Leo does this alone after the lesson; every SB tab replays the slides it
   comes from, with the slides' own words, sentences and answers first.
     Vocab        <- slides 1, 7, 9-16 (the deck's eight word cards) + 13, 17
     Word Games   <- slides 7, 8, 9-12, 14, 15, 16, 17, 18
     Strategy     <- slides 4, 5, 19, 36 (Visualize · detail words · think aloud)
     Read         <- slides 22-24 (before), 25-33 (P1-P3 + checks), 24 (facts)
     Questions    <- slides 35, 38-46, 62 (Activity 2, Activity 3, the orders)
     Compare      <- slides 47-50 (Activity 4 chart, Venn, compare sentences)
     My Storm     <- slides 52-61 (word web, tell your storm, role-play, soccer)
     Quiz         <- 10 questions over the whole reading
   WB tabs use WB pp. 8-9: the 7 WB-only words (OW5-U1-RD-WB), Weather Change
   (TR 1.3), Activity 2 (Circle the best answer: c, b, a) and Activity 3 (KWL).

   Every tab is a list of blocks; each block saves as Leo answers, restores
   its own DOM, and the tab's done-key saves itself when every block is done.
═════════════════════════════════════════════════════════════════════ */
const SAVE_PREFIX = 'leea-5-1-reading-';
const HOMEWORK_ID = 'leo-5-1-reading';
const SB_TABS = 8, WB_TABS = 5;
function lSave(k,v){ try{ localStorage.setItem(SAVE_PREFIX+k, JSON.stringify(v)); }catch(e){} }
function lLoad(k){ try{ const r = localStorage.getItem(SAVE_PREFIX+k); return r ? JSON.parse(r) : null; }catch(e){ return null; } }
function lDel(k){ try{ localStorage.removeItem(SAVE_PREFIX+k); }catch(e){} }
const $ = id => document.getElementById(id);
function shuffle(a){ const b = a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function strip(h){ return String(h).replace(/<[^>]+>/g,''); }
function norm(s){ return String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/[.,!?;:"“”]/g,' ').replace(/\s+/g,' ').trim(); }

/* Homework flag: learnerProgress.ts reads `leea-<homeworkId>-done` exactly. */
function clearHomeworkFlag(){
  try{ localStorage.removeItem('leea-' + HOMEWORK_ID + '-done'); }catch(e){}
  try{ if(window.LEEA_CLOUD && typeof window.LEEA_CLOUD.saveProgress === 'function') window.LEEA_CLOUD.saveProgress(HOMEWORK_ID, 'leea-' + HOMEWORK_ID + '-done', null); }catch(e){}
}
function saveHomeworkFlag(value){
  try{ localStorage.setItem('leea-' + HOMEWORK_ID + '-done', JSON.stringify(value)); }catch(e){}
  try{ if(window.LEEA_CLOUD && typeof window.LEEA_CLOUD.saveProgress === 'function') window.LEEA_CLOUD.saveProgress(HOMEWORK_ID, 'leea-' + HOMEWORK_ID + '-done', value); }catch(e){}
}

/* ═══ TAB MACHINERY — a tab key K is 'tab-N' (SB) or 'wb-tab-N' (WB) ═══ */
const TABS = {};            // K -> tab config (filled by defineTab)
const TAB_INIT = {};        // K -> init(); TAB_INIT[K]._init once rendered
function isDone(K){ return !!lLoad(K + '-done'); }
function modeOf(K){ return K.indexOf('wb-') === 0 ? 'wb' : 'sb'; }
function blocksDone(K){ const t = TABS[K]; return t.blocks.filter(b => BLOCK_DONE[b.type] && BLOCK_DONE[b.type](K + '-' + b.id, b)).length; }
function blocksTotal(K){ return TABS[K].blocks.filter(b => BLOCK_DONE[b.type]).length; }
function refreshProg(){
  try{
    let sb = 0, wb = 0;
    Object.keys(TABS).forEach(K=>{ const d = isDone(K); if(d){ if(modeOf(K)==='wb') wb++; else sb++; } const b = $('tb-'+K); if(b) b.classList.toggle('done', d); });
    const a = $('mc-prog-sb'); a.textContent = sb + ' / ' + SB_TABS + ' done'; a.classList.toggle('has-prog', sb > 0);
    const c = $('mc-prog-wb'); c.textContent = wb + ' / ' + WB_TABS + ' done'; c.classList.toggle('has-prog', wb > 0);
    $('prog-pill').textContent = (sb + wb) + ' / ' + (SB_TABS + WB_TABS) + ' done';
    if(sb + wb >= SB_TABS + WB_TABS){ if(!localStorage.getItem('leea-' + HOMEWORK_ID + '-done')) saveHomeworkFlag({ complete:true, completedAt:new Date().toISOString() }); }
    else if(localStorage.getItem('leea-' + HOMEWORK_ID + '-done')) clearHomeworkFlag();
  }catch(e){}
}
function paintFooter(K){
  const cb = $('complete-' + K); if(!cb) return;
  if(isDone(K)){ cb.disabled = false; cb.classList.add('confirmed'); cb.textContent = '✓ ' + TABS[K].name + ' done'; }
  else { cb.disabled = true; cb.classList.remove('confirmed'); cb.textContent = 'Finish the activities first (' + blocksDone(K) + ' / ' + blocksTotal(K) + ')'; }
  TABS[K].blocks.forEach(b=>{ const l = $('kl-' + K + '-' + b.id); if(l && BLOCK_DONE[b.type]) l.classList.toggle('ok', !!BLOCK_DONE[b.type](K + '-' + b.id, b)); });
}
function finishTab(K){
  try{
    $('done-' + K).classList.add('show');
    if(!isDone(K)) lSave(K + '-done', { done:true, completedAt:new Date().toISOString() });
    paintFooter(K); refreshProg();
  }catch(e){}
}
/* Called by every block after progress: the done-key saves itself. */
function checkTab(K){ if(blocksDone(K) >= blocksTotal(K)) finishTab(K); else paintFooter(K); }
function completeTab(K){ checkTab(K); }
function redoTab(K){
  try{
    const btn = $('redo-' + K);
    if(!btn.classList.contains('armed')){ btn.classList.add('armed'); btn.textContent = 'Tap again ↺'; setTimeout(()=>{ btn.classList.remove('armed'); btn.textContent = '↺ Redo'; }, 3000); return; }
    btn.classList.remove('armed'); btn.textContent = '↺ Redo';
    Object.keys(localStorage).filter(k => k.indexOf(SAVE_PREFIX + K + '-') === 0).forEach(k => localStorage.removeItem(k));
    if(K === 'tab-4') lDel('score');
    if(K === 'wb-tab-4') lDel('wb-score');
    $('done-' + K).classList.remove('show');
    renderTab(K); paintFooter(K); refreshProg();
  }catch(e){}
}
function openTab(K){
  try{
    const m = modeOf(K);
    document.querySelectorAll('#nav-' + m + ' .tab-btn').forEach(b => b.classList.toggle('active', b.id === 'tb-' + K));
    document.querySelectorAll('#panes-' + m + ' .tab-content').forEach(c => c.classList.toggle('active', c.id === 'tc-' + K));
    if(!TAB_INIT[K]._init) renderTab(K);
    paintFooter(K);
    lSave(m === 'wb' ? 'wb-last-tab' : 'last-tab', K);
  }catch(e){}
}
/* Locked-pattern entry points (SB / WB parallel names). */
function showTab(n){ openTab('tab-' + n); }
function wbShowTab(n){ openTab('wb-tab-' + n); }
function markComplete(n){ completeTab('tab-' + n); }
function wbMarkComplete(n){ completeTab('wb-tab-' + n); }
function doRedo(n){ redoTab('tab-' + n); }
function wbDoRedo(n){ redoTab('wb-tab-' + n); }

function renderTab(K){
  const t = TABS[K];
  $('blocks-' + K).innerHTML = t.blocks.map(b =>
    (b.label ? '<div class="klabel" id="kl-' + K + '-' + b.id + '">' + b.label + ' <span class="kdone">✓ done</span></div>' : '') +
    (b.hint ? '<div class="dad-hint">' + b.hint + '</div>' : '') +
    '<div class="blk" id="' + K + '-' + b.id + '"></div>').join('');
  t.blocks.forEach(b => { try{ BLOCK_RENDER[b.type](K + '-' + b.id, K + '-' + b.id, b, K); }catch(e){ console.error(b.type, e); } });
  TAB_INIT[K]._init = true;
  if(isDone(K)) $('done-' + K).classList.add('show');
}
function defineTab(K, cfg){
  cfg.k = K; TABS[K] = cfg; TAB_INIT[K] = function(){ renderTab(K); };
}
function buildShell(){
  ['sb','wb'].forEach(m=>{
    const order = m === 'sb' ? SB_NAV : WB_NAV;
    $('nav-' + m).innerHTML = order.map(K => '<button class="tab-btn" id="tb-' + K + '" onclick="openTab(\'' + K + '\')"><span class="tab-icon">' + TABS[K].icon + '</span><span class="tab-name">' + TABS[K].name + '</span></button>').join('');
    $('panes-' + m).innerHTML = order.map(K => { const t = TABS[K]; return '<div class="tab-content" id="tc-' + K + '"><div class="tab-body">' +
      '<div><div class="section-title">' + t.title + '</div><div class="section-sub">' + t.sub + '</div></div>' +
      (t.hint ? '<div class="dad-hint">' + t.hint + '</div>' : '') +
      '<div id="blocks-' + K + '" style="display:flex;flex-direction:column;gap:12px"></div>' +
      '<div class="done-banner" id="done-' + K + '">' + t.done + '</div></div>' +
      '<div class="tab-footer"><button class="btn-redo" id="redo-' + K + '" onclick="redoTab(\'' + K + '\')">↺ Redo</button><button class="btn-complete" id="complete-' + K + '" onclick="completeTab(\'' + K + '\')" disabled>Finish the activities first</button></div></div>'; }).join('');
  });
}
function enterMode(m){
  lSave('last-mode', m);
  $('landing').style.display = 'none';
  $('sb-mode').style.display = m === 'sb' ? 'flex' : 'none';
  $('wb-mode').style.display = m === 'wb' ? 'flex' : 'none';
  const last = lLoad(m === 'wb' ? 'wb-last-tab' : 'last-tab');
  openTab(last && TABS[last] && modeOf(last) === m ? last : (m === 'wb' ? WB_NAV[0] : SB_NAV[0]));
}
function backToLanding(){
  lSave('last-mode', 'landing');
  $('landing').style.display = 'flex'; $('sb-mode').style.display = 'none'; $('wb-mode').style.display = 'none';
  refreshProg();
}

/* ── Wrong first tries, for Dad (cleared with the tab's Redo) ── */
function logAtt(K, rec){ const a = lLoad(K + '-att') || []; a.push(rec); lSave(K + '-att', a); }
function openDad(){
  let h = '<div class="dad-hint">Leo’s <b>wrong first tries</b>, exactly as he tapped or typed them.</div>', any = false;
  SB_NAV.concat(WB_NAV).forEach(K=>{
    const a = lLoad(K + '-att') || []; if(!a.length) return; any = true;
    h += '<div class="dad-sec"><h4>' + (modeOf(K)==='wb' ? '📒 ' : '📘 ') + esc(TABS[K].name) + (isDone(K) ? ' ✓' : '') + ' — ' + a.length + '</h4>' +
      a.map(r => '<div class="dad-row">✖ ' + (r.q ? '<i>' + esc(r.q) + '</i> → ' : '') + '<b>' + esc(r.a) + '</b></div>').join('') + '</div>';
  });
  if(!any) h += '<div class="dad-sec">No wrong first tries yet. 🎉</div>';
  $('dad-body').innerHTML = h; $('dad-ov').classList.add('open');
}
function closeDad(){ $('dad-ov').classList.remove('open'); }

/* ═════════════════════════════════════════════════════════════════════
   BLOCKS. Each: render(host, key, cfg, K) + done(key, cfg).
═════════════════════════════════════════════════════════════════════ */
const BLOCK_RENDER = {}, BLOCK_DONE = {}, BS = {};

/* note — static html, no progress */
BLOCK_RENDER.note = (host, key, b) => { $(host).innerHTML = b.html; };

/* flash — the deck's word cards; every card flipped = done */
BLOCK_RENDER.flash = function(host, key, b, K){
  BS[host] = { key, b, K, i:0 };
  $(host).innerHTML = '<div class="flashcard-wrap" onclick="fcFlip(\'' + host + '\')"><div class="flashcard" id="' + host + '-card">' +
    '<div class="fc-face fc-front"><div class="fc-emoji" id="' + host + '-em"></div><div class="fc-word" id="' + host + '-w"></div><div class="fc-pos" id="' + host + '-pos"></div><div class="fc-tap">TAP TO FLIP</div></div>' +
    '<div class="fc-face fc-back"><div class="fc-def" id="' + host + '-def"></div><div class="fc-sample" id="' + host + '-s"></div><button class="fc-jp-btn" id="' + host + '-jb" onclick="fcJp(event,\'' + host + '\')">🇯🇵 日本語</button><div class="fc-jp jp" id="' + host + '-jp"></div></div></div></div>' +
    '<div class="fc-nav"><button onclick="fcStep(\'' + host + '\',-1)">◀ Back</button><div class="fc-dots" id="' + host + '-dots"></div><button onclick="fcStep(\'' + host + '\',1)">Next ▶</button></div>';
  fcPaint(host);
};
BLOCK_DONE.flash = (key, b) => (lLoad(key) || []).length >= b.words.length;
function fcPaint(host){
  const s = BS[host], w = s.b.words[s.i], seen = new Set(lLoad(s.key) || []);
  $(host + '-card').classList.remove('flipped');
  $(host + '-em').textContent = w.emoji; $(host + '-w').textContent = w.word; $(host + '-pos').textContent = w.pos;
  $(host + '-def').textContent = w.def; $(host + '-s').innerHTML = w.sample;
  $(host + '-jp').textContent = '🇯🇵 ' + w.jp; $(host + '-jp').classList.remove('revealed'); $(host + '-jb').textContent = '🇯🇵 日本語';
  $(host + '-dots').innerHTML = s.b.words.map((x,i)=>'<div class="fc-dot' + (seen.has(i) ? ' seen' : '') + (i === s.i ? ' on' : '') + '"></div>').join('');
}
function fcFlip(host){
  const s = BS[host];
  if($(host + '-card').classList.toggle('flipped')){
    const seen = new Set(lLoad(s.key) || []); seen.add(s.i); lSave(s.key, Array.from(seen));
    const d = $(host + '-dots').children[s.i]; if(d) d.classList.add('seen');
    checkTab(s.K);
  }
}
function fcStep(host, d){ const s = BS[host]; s.i = (s.i + d + s.b.words.length) % s.b.words.length; fcPaint(host); }
function fcJp(e, host){ e.stopPropagation(); const on = $(host + '-jp').classList.toggle('revealed'); $(host + '-jb').textContent = on ? '🇯🇵 隠す' : '🇯🇵 日本語'; }

/* mcq — { clue?, q, opts, ok, why?, jp? }. Retry until right; saved as solved. */
BLOCK_RENDER.mcq = function(host, key, b, K){
  BS[host] = { key, b, K };
  $(host).innerHTML = b.items.map((it,i)=>{
    const opts = (b.keep || it.keep) ? it.opts.map((o,oi)=>({ text:o, ok:oi===it.ok })) : shuffle(it.opts.map((o,oi)=>({ text:o, ok:oi===it.ok })));
    return '<div class="qcard" data-idx="' + i + '">' + (it.clue ? '<div class="qclue">' + it.clue + '</div>' : '') +
      '<div class="qtext">' + (b.nonum ? '' : (i+1) + '. ') + it.q + '</div><div class="' + (it.two || b.two ? 'opt2' : '') + '">' +
      opts.map(o=>'<button class="opt" data-ok="' + (o.ok ? 1 : 0) + '" onclick="mcqPick(this,\'' + host + '\',' + i + ')">' + o.text + '</button>').join('') + '</div>' +
      (it.why ? '<div class="qwhy">💡 ' + it.why + '</div>' : '') + (it.jp ? '<div class="qjp jp">🇯🇵 ' + it.jp + '</div>' : '') + '</div>';
  }).join('');
  (lLoad(key) || []).forEach(i=>{ const c = $(host).querySelector('[data-idx="' + i + '"]'); if(c) mcqSolve(c); });
};
BLOCK_DONE.mcq = (key, b) => (lLoad(key) || []).length >= b.items.length;
function mcqSolve(card){ card.classList.add('solved'); card.querySelectorAll('.opt').forEach(o=>{ o.disabled = true; if(o.dataset.ok === '1') o.classList.add('good'); }); }
function mcqPick(btn, host, i){
  const card = btn.closest('.qcard'); if(!card || card.classList.contains('solved')) return;
  const s = BS[host], right = btn.dataset.ok === '1';
  if(!card.dataset.tried){ card.dataset.tried = '1'; if(!right) logAtt(s.K, { q:strip(s.b.items[i].q), a:strip(btn.innerHTML) }); }
  if(right){
    mcqSolve(card);
    const set = new Set(lLoad(s.key) || []); set.add(i); lSave(s.key, Array.from(set));
    if(s.b.after) s.b.after(host);
    checkTab(s.K);
  } else { btn.classList.add('bad'); setTimeout(()=>btn.classList.remove('bad'), 380); }
}

/* match — tap a clue, then its answer. pairs: [{ l, r }] */
BLOCK_RENDER.match = function(host, key, b, K){
  BS[host] = { key, b, K, sel:null };
  const right = shuffle(b.pairs.map((p,i)=>({ t:p.r, i })));
  $(host).innerHTML = '<div class="match-grid"><div class="mcol">' +
    b.pairs.map((p,i)=>'<button class="mbtn" id="' + host + '-l' + i + '" onclick="mtL(\'' + host + '\',' + i + ')">' + p.l + '</button>').join('') +
    '</div><div class="mcol">' + right.map((x,k)=>'<button class="mbtn" id="' + host + '-r' + k + '" data-t="' + esc(x.t) + '" onclick="mtR(\'' + host + '\',' + k + ')">' + x.t + '</button>').join('') + '</div></div>' +
    '<div class="quiz-fb" id="' + host + '-fb"></div>';
  (lLoad(key) || []).forEach(i=>mtPaint(host, i));
};
BLOCK_DONE.match = (key, b) => (lLoad(key) || []).length >= b.pairs.length;
function mtPaint(host, i){
  const s = BS[host], t = s.b.pairs[i].r;
  $(host + '-l' + i).classList.add('matched'); $(host + '-l' + i).disabled = true;
  const r = Array.from($(host).querySelectorAll('.mcol:last-child .mbtn')).find(x => x.dataset.t === esc(t) && !x.classList.contains('matched'));
  if(r){ r.classList.add('matched'); r.disabled = true; }
}
function mtL(host, i){ const s = BS[host]; $(host).querySelectorAll('.mbtn.sel').forEach(x=>x.classList.remove('sel')); s.sel = i; $(host + '-l' + i).classList.add('sel'); }
function mtR(host, k){
  const s = BS[host], btn = $(host + '-r' + k), fb = $(host + '-fb');
  if(s.sel === null){ fb.className = 'quiz-fb no'; fb.textContent = 'Tap a clue on the left first.'; return; }
  const p = s.b.pairs[s.sel];
  if(btn.dataset.t === esc(p.r)){
    const m = new Set(lLoad(s.key) || []); m.add(s.sel); lSave(s.key, Array.from(m));
    $(host + '-l' + s.sel).classList.remove('sel'); mtPaint(host, s.sel); s.sel = null;
    fb.className = 'quiz-fb ok'; fb.textContent = '✅ Match! ' + (m.size >= s.b.pairs.length ? 'All matched.' : '');
    checkTab(s.K);
  } else {
    logAtt(s.K, { q:strip(p.l), a:strip(btn.innerHTML) });
    btn.classList.add('err'); setTimeout(()=>btn.classList.remove('err'), 380);
    fb.className = 'quiz-fb no'; fb.textContent = 'Not that one — read the clue again.';
  }
}

/* typed — { p, pre?, post?, ans?[..] | free (min words), model }. Two tries, then the answer. */
BLOCK_RENDER.typed = function(host, key, b, K){
  BS[host] = { key, b, K };
  const st = lLoad(key) || {};
  $(host).innerHTML = b.items.map((it,i)=>{
    const s = st[i] || {};
    return '<div class="qcard" id="' + host + '-c' + i + '"><div class="qtext">' + (i+1) + '. ' + it.p + '</div><div class="type-row">' +
      (it.pre ? '<span class="pre">' + esc(it.pre) + '</span>' : '') +
      '<input class="type-in" id="' + host + '-in' + i + '" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="' + (it.ph || 'type here…') + '" value="' + esc(s.last || '') + '" onkeydown="if(event.key===\'Enter\')tyCheck(\'' + host + '\',' + i + ')">' +
      (it.post ? '<span class="pre">' + esc(it.post) + '</span>' : '') +
      '<button class="type-go" onclick="tyCheck(\'' + host + '\',' + i + ')">✓</button></div><div class="quiz-fb" id="' + host + '-fb' + i + '"></div></div>';
  }).join('');
  b.items.forEach((it,i)=>{ const s = st[i]; if(s && s.done) tyDone(host, i, s); });
};
BLOCK_DONE.typed = (key, b) => { const st = lLoad(key) || {}; return b.items.every((x,i)=>st[i] && st[i].done); };
function tyDone(host, i, s){
  const it = BS[host].b.items[i], fb = $(host + '-fb' + i), card = $(host + '-c' + i);
  $(host + '-in' + i).disabled = true; card.querySelector('.type-go').disabled = true;
  const full = (it.pre || '') + (s.last || '') + (it.post || '');
  if(s.shown){ card.classList.add('missed'); fb.className = 'quiz-fb show'; fb.textContent = '👀 The answer: ' + it.model + ' — say it aloud.'; }
  else { card.classList.add('solved'); fb.className = 'quiz-fb ok'; fb.textContent = '✅ ' + full + (it.free && it.model ? '   (Dad’s idea: ' + it.model + ')' : '') + (it.say ? ' — ' + it.say : ' — read it aloud!'); }
}
function tyCheck(host, i){
  const S = BS[host], it = S.b.items[i], st = lLoad(S.key) || {}, s = st[i] || (st[i] = { tries:0 });
  if(s.done) return;
  const text = $(host + '-in' + i).value.trim(); if(!text) return;
  const words = norm(text).split(' ').filter(Boolean).length;
  const ok = it.free ? words >= (it.min || 1) : it.ans.some(a => norm(a) === norm(text));
  s.tries++; s.last = text;
  if(!ok) logAtt(S.K, { q:strip(it.p), a:text });
  if(ok) s.done = true; else if(!it.free && s.tries >= 2){ s.done = true; s.shown = true; }
  lSave(S.key, st);
  if(s.done){ tyDone(host, i, s); checkTab(S.K); }
  else { const fb = $(host + '-fb' + i); fb.className = 'quiz-fb no'; fb.textContent = '💡 ' + (it.free ? 'Write at least ' + (it.min || 1) + ' words.' : (it.clue || 'Check the spelling.') + '  (one more try)'); const inp = $(host + '-in' + i); inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake'); }
}

/* sort — pickChart('classification sort'); a finished sort restores as its columns. */
BLOCK_RENDER.sort = function(host, key, b, K){
  const done = new Set(lLoad(key) || []);
  $(host).innerHTML = b.sorts.map(s=>(s.intro ? '<div class="dad-hint">' + s.intro + '</div>' : '') + '<div class="sort-host" id="host-' + s.id + '"></div>').join('');
  b.sorts.forEach(s=>{
    if(done.has(s.id) || typeof window.pickChart !== 'function'){ sortStatic(s); return; }
    $('host-' + s.id).innerHTML = window.pickChart('classification sort', { id:s.id, tiles:shuffle(s.tiles), zones:s.zones,
      onComplete: function(){ const d = new Set(lLoad(key) || []); d.add(s.id); lSave(key, Array.from(d)); setTimeout(()=>sortStatic(s), 900); checkTab(K); } });
  });
};
BLOCK_DONE.sort = (key, b) => (lLoad(key) || []).length >= b.sorts.length;
function sortStatic(s){
  $('host-' + s.id).innerHTML = '<div class="sort-static" style="grid-template-columns:repeat(' + s.zones.length + ',1fr)">' + s.zones.map(z=>
    '<div class="col"><h4 style="background:' + z.color + '">' + z.label + '</h4>' + s.tiles.filter(t=>t.answer === z.key).map(t=>'<div>' + t.text + '</div>').join('') + '</div>').join('') + '</div>' +
    (s.win ? '<div class="dad-hint" style="margin-top:8px">✅ ' + s.win + '</div>' : '');
}

/* order — tap the steps in order. sets: [{ title, steps:[in order], end? }] */
BLOCK_RENDER.order = function(host, key, b, K){
  BS[host] = { key, b, K };
  $(host).innerHTML = b.sets.map((s,si)=>'<div class="qcard" id="' + host + '-s' + si + '"><div class="qtext">' + s.title + '</div><div class="ord-list" id="' + host + '-l' + si + '"></div><div class="ord-bank" id="' + host + '-b' + si + '"></div><div class="quiz-fb" id="' + host + '-f' + si + '"></div></div>').join('');
  b.sets.forEach((s,si)=>ordPaint(host, si));
};
BLOCK_DONE.order = (key, b) => { const st = lLoad(key) || {}; return b.sets.every((s,si)=>(st[si] || 0) >= s.steps.length); };
function ordPaint(host, si){

/* read — paragraphs; the next one unlocks when this one's checks are solved.
   text markup: [[words|gloss]] blue word · {{words|gloss}} signal word · **bold** */
function markup(text, host, pi){
  let g = 0;
  return text.replace(/\*\*(.+?)\*\*/g, '<b class="kw">$1</b>')
    .replace(/\[\[(.+?)\|(.+?)\]\]|\{\{(.+?)\|(.+?)\}\}/g, (m, a, ag, s, sg) => '<span class="' + (a ? 'tag' : 'sig') + '" data-g="' + esc((a || s) + ' — ' + (ag || sg)) + '" onclick="glossShow(this,\'' + host + '-g' + pi + '\')">' + (a || s) + '</span>');
}
function glossShow(el, id){ const g = $(id); g.textContent = '🔎 ' + el.dataset.g; g.classList.add('show'); }
BLOCK_RENDER.read = function(host, key, b, K){
  $(host).innerHTML = b.paras.map((p,pi)=>'<div class="para" id="' + host + '-p' + pi + '"><div class="lock-note">🔒 Answer the checks above to unlock this paragraph.</div>' +
    '<div class="passage-block"><span class="pnum">' + p.label + '</span>' + markup(p.text, host, pi) + '<div class="gloss" id="' + host + '-g' + pi + '"></div></div>' +
    (p.items && p.items.length ? '<div class="klabel">🤔 Think about it</div><div class="blk" id="' + host + '-q' + pi + '"></div>' : '') + '</div>').join('');
  b.paras.forEach((p,pi)=>{ if(p.items && p.items.length) BLOCK_RENDER.mcq(host + '-q' + pi, key + '-p' + pi, { items:p.items, after:()=>readLock(host, key, b) }, K); });
  readLock(host, key, b);
};
function readLock(host, key, b){
  let open = true;
  b.paras.forEach((p,pi)=>{ $(host + '-p' + pi).classList.toggle('locked', !open); if(p.items && p.items.length && (lLoad(key + '-p' + pi) || []).length < p.items.length) open = false; });
}
BLOCK_DONE.read = (key, b) => b.paras.every((p,pi)=>!p.items || !p.items.length || (lLoad(key + '-p' + pi) || []).length >= p.items.length);

    $(host + '-t').innerHTML = '<tr>' + b.head.map(h=>'<th>' + h + '</th>').join('') + '</tr>' + b.rows.map(r=>'<tr><td><b>' + r.label + '</b></td>' + r.cells.map(c=>{ const k = n++; return solved.has(k) ? '<td class="a">' + c.opts[0] + '</td>' : '<td class="q">❓</td>'; }).join('') + '</tr>').join('');

BLOCK_DONE.chart = (key, b) => (lLoad(key) || []).length >= b.rows.reduce((n,r)=>n + r.cells.length, 0);

/* write — a longer piece; saves as he types; done when it meets the targets. */
BLOCK_RENDER.write = function(host, key, b, K){
  BS[host] = { key, b, K };
  const s = lLoad(key) || {};
  $(host).innerHTML = '<div class="qcard"><div class="qtext">' + b.p + '</div><textarea class="long-in" id="' + host + '-ta" placeholder="' + (b.ph || 'Write here…') + '" oninput="wrInput(\'' + host + '\')">' + esc(s.text || '') + '</textarea><div class="counter" id="' + host + '-cn"></div>' +
    '<div class="type-row"><button class="type-go" id="' + host + '-go" onclick="wrCheck(\'' + host + '\')">✓ I’m finished</button></div><div class="quiz-fb" id="' + host + '-fb"></div></div>';
  wrCount(host);
  if(s.done){ $(host + '-fb').className = 'quiz-fb ok'; $(host + '-fb').textContent = '✅ Saved — read it to Dad!'; $(host).querySelector('.qcard').classList.add('solved'); }

BLOCK_DONE.write = key => !!(lLoad(key) || {}).done;
function wrStats(host){
  const b = BS[host].b, text = $(host + '-ta').value, low = text.toLowerCase();
  const used = (b.targets || []).filter(t => new RegExp('\\b' + t.re, 'i').test(low)).map(t => t.w);
  const sentences = (text.match(/[^.!?]+[.!?]+/g) || []).filter(x => x.trim().split(/\s+/).length >= 3).length;
  return { used, sentences };
}
function wrCount(host){
  const b = BS[host].b, st = wrStats(host);
  $(host + '-cn').innerHTML = 'Sentences: <b class="' + (st.sentences >= b.sentences ? 'ok' : '') + '">' + st.sentences + ' / ' + b.sentences + '</b>' +
    (b.targets ? ' · Target words: <b class="' + (st.used.length >= b.need ? 'ok' : '') + '">' + st.used.length + ' / ' + b.need + '</b>' + (st.used.length ? ' (' + st.used.join(', ') + ')' : '') : '');
}
function wrInput(host){ const S = BS[host], s = lLoad(S.key) || {}; s.text = $(host + '-ta').value; lSave(S.key, s); wrCount(host); }
function wrCheck(host){
  const S = BS[host], b = S.b, st = wrStats(host), s = lLoad(S.key) || {}, fb = $(host + '-fb');
  s.text = $(host + '-ta').value;
  if(st.sentences >= b.sentences && (!b.targets || st.used.length >= b.need)){ s.done = true; lSave(S.key, s); fb.className = 'quiz-fb ok'; fb.textContent = '✅ Saved — read it to Dad!'; $(host).querySelector('.qcard').classList.add('solved'); checkTab(S.K); }

}

/* quiz — one try each, scored; progress saves after every answer. */
BLOCK_RENDER.quiz = function(host, key, b, K){
  BS[host] = { key, b, K };
  $(host).innerHTML = '<div id="' + host + '-act"><div class="quiz-progress" id="' + host + '-pr"></div><div class="qcard" style="margin-top:12px" id="' + host + '-qc"></div></div><div id="' + host + '-res" style="display:none"></div>';
  const saved = lLoad(b.scoreKey);
  if(saved && saved.done){ qzResult(host, saved); return; }
  qzRender(host);
};
BLOCK_DONE.quiz = (key, b) => !!(lLoad(b.scoreKey) || {}).done;
function qzState(host){ return lLoad(BS[host].key + '-progress') || { idx:0, score:0, wrong:[] }; }
function qzRender(host){
  const S = BS[host], items = S.b.items, p = qzState(host);
  $(host + '-pr').innerHTML = items.map((x,i)=>'<div class="' + (i < p.idx ? 'answered' : '') + '"></div>').join('');
  if(p.idx >= items.length){ qzFinish(host); return; }
  const it = items[p.idx], card = $(host + '-qc'); card.classList.remove('solved');
  card.innerHTML = '<div class="qtext">Q' + (p.idx+1) + '. ' + it.q + '</div>' + shuffle(it.opts.map((o,oi)=>({ text:o, ok:oi===it.ok }))).map(o=>'<button class="opt" data-ok="' + (o.ok ? 1 : 0) + '" onclick="qzPick(\'' + host + '\',this)">' + o.text + '</button>').join('') +
    '<div class="quiz-fb" id="' + host + '-fb"></div>' + (it.jp ? '<div class="qjp jp">🇯🇵 ' + it.jp + '</div>' : '');
}
function qzPick(host, btn){
  const S = BS[host], card = $(host + '-qc'); if(card.classList.contains('solved')) return;
  const p = qzState(host), it = S.b.items[p.idx], right = btn.dataset.ok === '1', fb = $(host + '-fb');
  mcqSolve(card);
  if(right){ p.score++; fb.className = 'quiz-fb ok'; fb.textContent = 'Correct! 🎉'; }
  else { btn.classList.add('bad'); fb.className = 'quiz-fb no'; fb.textContent = 'The right answer is in green.'; p.wrong.push({ q:strip(it.q), chose:strip(btn.innerHTML), answer:strip(it.opts[it.ok]) }); logAtt(S.K, { q:strip(it.q), a:strip(btn.innerHTML) }); }
  p.idx++; lSave(S.key + '-progress', p);
  setTimeout(()=>qzRender(host), 1400);
}
function qzFinish(host){
  const S = BS[host], p = qzState(host), total = S.b.items.length, percent = Math.round(p.score / total * 100);
  const d = { score:p.score, total, percent, done:true, timestamp:new Date().toISOString(),
    trophy: percent >= 80 ? '🏆' : percent >= 50 ? '🥈' : '💪',
    text: percent >= 80 ? S.b.win : percent >= 50 ? 'Great effort!' : 'Keep practicing — read it again and try once more!',
    wrongQuestions: p.wrong.map(w=>w.q), wrong: p.wrong };
  lSave(S.b.scoreKey, d); lDel(S.key + '-progress'); qzResult(host, d); checkTab(S.K);
}
function qzResult(host, d){
  $(host + '-act').style.display = 'none';
  const rz = $(host + '-res'); rz.style.display = 'block'; const wrong = d.wrong || [];
  rz.innerHTML = '<div class="quiz-result"><div class="trophy">' + d.trophy + '</div><div class="qscore">' + d.score + ' / ' + d.total + '</div><div style="font-weight:800;font-size:18px">' + d.text + '</div>' +
    (wrong.length ? '<div class="wrong-review"><b>Go over these:</b><br>' + wrong.map(w=>'• ' + esc(w.q) + '<br>&nbsp;&nbsp;You chose: <b style="color:var(--red)">' + esc(w.chose) + '</b> · Answer: <b style="color:var(--green-d)">' + esc(w.answer) + '</b>').join('<br>') + '</div>' : '<div class="dad-hint" style="margin-top:10px">Perfect — no mistakes! 🏆</div>') + '</div>';
}
