<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 1 · Writing — Safe not Sorry!</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Oswald:wght@600;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Oswald:wght@600;700&display=swap"></noscript>
<script src="/components/charts.js"></script>
<script src="/components/chart-picker.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --or:#F97316;--ord:#EA580C;--orl:#FFF7ED;
  --bl:#3B82F6;--bld:#1D4ED8;--bll:#EFF6FF;
  --ye:#FDE047;--yed:#EAB308;
  --gn:#16A34A;--gnd:#15803D;--gnl:#F0FDF4;--gnb:#BBF7D0;
  --rd:#DC2626;--rdl:#FEE2E2;--rdb:#FECACA;
  --am:#D97706;--aml:#FFFBEB;
  --pu:#7C3AED;--pul:#F5F3FF;
  --ink:#111111;--ink2:#374151;--ink3:#6B7280;
  --paper:#FAFAF7;--surf:#FFFFFF;--bdr:#E5E7EB;
  --fn:'Nunito',sans-serif;--fnh:'Oswald',sans-serif;
}
body{font-family:var(--fn);background:var(--paper);color:var(--ink);min-height:100vh;overflow-x:hidden}
.jp{font-family:'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif}

/* HEADER + HERO */
.app-hdr{background:var(--ink);padding:0 16px;height:50px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200}
.hdr-left{display:flex;align-items:center;gap:8px}
.hdr-badge{background:var(--ye);color:var(--ink);font-family:var(--fnh);font-size:.6rem;font-weight:700;letter-spacing:2px;padding:2px 7px;border-radius:2px}
.hdr-title{font-family:var(--fnh);font-size:.85rem;font-weight:700;color:#fff;letter-spacing:1px}
.hdr-unit{font-size:.7rem;font-weight:700;color:var(--or)}
.hdr-btns{display:flex;gap:6px}
.mbk{background:rgba(255,255,255,.15);border:none;color:#fff;font-family:var(--fn);font-size:.72rem;font-weight:800;padding:5px 11px;border-radius:20px;cursor:pointer;flex-shrink:0}
.hero{background:linear-gradient(135deg,var(--or),var(--ord));padding:20px 16px 16px;text-align:center}
.hero-kick{font-family:var(--fnh);font-size:.6rem;font-weight:700;letter-spacing:3px;color:rgba(255,255,255,.75);margin-bottom:6px}
.hero-title{font-family:var(--fnh);font-size:1.4rem;font-weight:700;color:#fff;letter-spacing:1px}
.hero-title span{color:var(--ye)}
.hero-sub{font-size:.8rem;color:rgba(255,255,255,.9);font-weight:700;margin-top:4px}
.hero-em{font-size:1.3rem;margin-top:8px}
.hero-pill{display:inline-block;margin-top:8px;background:rgba(0,0,0,.18);color:#fff;font-weight:800;font-size:.75rem;padding:3px 12px;border-radius:20px}
.prog-wrap{background:rgba(0,0,0,.15);height:4px}
.prog-fill{height:100%;background:var(--ye);transition:width .5s;width:0%}
.hw-banner{background:var(--bll);border-bottom:2px solid var(--bl);padding:8px 16px;font-size:.8rem;font-weight:700;color:var(--bld);display:none;align-items:center;gap:8px}

/* HOME GRID */
.home{max-width:680px;margin:0 auto;padding:16px 14px 80px}
.sec-lbl{font-family:var(--fnh);font-size:.62rem;font-weight:700;letter-spacing:3px;color:var(--ink3);margin-bottom:10px;margin-top:20px;display:flex;align-items:center;gap:8px}
.sec-lbl::after{content:'';flex:1;height:1px;background:var(--bdr)}
.mod-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mod-card{background:var(--surf);border:2px solid var(--bdr);border-radius:4px;padding:13px 13px 11px;cursor:pointer;transition:all .2s;position:relative;text-align:left;font-family:var(--fn)}
.mod-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.1)}
.mod-card.ow:hover{border-color:var(--or)}
.mod-card.wb:hover{border-color:var(--bl)}
.mod-card.quiz:hover{border-color:var(--yed)}
.mod-card.always{border-color:#D8B4FE;background:linear-gradient(180deg,#fff,#FAF5FF)}
.mod-card.always:hover{border-color:var(--pu)}
.mod-card.wide{grid-column:1/-1}
.mod-icon{font-size:1.5rem;margin-bottom:5px}
.mod-name{font-weight:800;font-size:.82rem;color:var(--ink);margin-bottom:2px}
.mod-desc{font-size:.7rem;color:var(--ink3);font-weight:600;line-height:1.4}
.mod-badge{font-family:var(--fnh);font-size:.55rem;font-weight:700;letter-spacing:1px;padding:2px 6px;border-radius:2px;margin-top:7px;display:inline-block}
.badge-new{background:var(--paper);color:var(--ink3);border:1px solid var(--bdr)}
.badge-done{background:#D1FAE5;color:var(--gn)}
.badge-prog{background:var(--orl);color:var(--ord)}
.mod-tag{position:absolute;top:6px;right:6px;font-family:var(--fnh);font-size:.5rem;font-weight:700;letter-spacing:1px;color:var(--pu);background:var(--pul);padding:2px 6px;border-radius:2px}

/* MODAL */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;display:none;overflow-y:auto}
.modal.open{display:block}
.mbox{background:var(--surf);min-height:100vh;display:flex;flex-direction:column;max-width:680px;margin:0 auto}
.mhd{padding:13px 14px;display:flex;align-items:center;gap:10px;color:#fff;position:sticky;top:0;z-index:10;flex-shrink:0}
.mhd.or{background:var(--or)}.mhd.bl{background:var(--bl)}.mhd.ye{background:var(--yed)}.mhd.pu{background:var(--pu)}
.mhd-title{font-weight:900;font-size:1rem;flex:1;letter-spacing:.3px;text-shadow:0 1px 3px rgba(0,0,0,.25)}
.mhd-num{font-family:var(--fnh);font-size:.6rem;font-weight:700;letter-spacing:1px;opacity:.8}
.mhd-close{background:rgba(255,255,255,.18);border:none;color:#fff;width:28px;height:28px;border-radius:50%;font-size:.85rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mbody{flex:1;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--paper)}
.mod-footer{display:flex;gap:8px;margin-top:10px;position:sticky;bottom:0;background:var(--paper);padding:8px 0}
.mark-btn{flex:1;background:var(--gn);color:#fff;border:none;border-radius:4px;padding:11px 14px;font-family:var(--fn);font-size:.82rem;font-weight:800;cursor:pointer}
.mark-btn:disabled{background:var(--ink3);cursor:not-allowed;opacity:.6}
.mark-btn.confirmed{background:var(--gnd)}
.redo-btn{background:var(--rd);color:#fff;border:none;border-radius:4px;padding:11px 14px;font-family:var(--fn);font-size:.78rem;font-weight:800;cursor:pointer;min-width:96px}
.redo-btn.armed{background:#7F1D1D}
.done-banner{display:none;background:#D1FAE5;border:2px solid #6EE7B7;border-radius:4px;padding:11px 13px;font-size:.88rem;font-weight:800;color:#065F46;text-align:center}
.done-banner.show{display:block;animation:pop .35s}
@keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .35s}

/* SHARED CARDS */
.dad-card{background:#D1FAE5;border:2px solid #A7F3D0;border-radius:4px;padding:11px 13px;font-size:.82rem;font-weight:700;color:#065F46;line-height:1.5}
.info-card{background:var(--bll);border:2px solid #BFDBFE;border-radius:4px;padding:10px 12px;font-size:.8rem;font-weight:700;color:var(--bld);line-height:1.55}
.section-h{font-family:var(--fnh);font-size:.75rem;font-weight:700;letter-spacing:2px;color:var(--ink);margin-top:8px;display:flex;align-items:center;gap:6px}
.section-h::after{content:'';flex:1;height:1px;background:var(--bdr)}
.section-h .kdone{display:none;color:var(--gn);letter-spacing:0;font-family:var(--fn);font-size:.72rem}
.section-h.ok .kdone{display:inline}
.blk{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#fff;border:1px solid #FDBA74;border-radius:20px;padding:3px 10px;font-size:.78rem;font-weight:700;color:var(--ord)}
.passage{background:var(--aml);border:2px solid #FCD34D;border-left:4px solid var(--am);border-radius:0 4px 4px 0;padding:11px 14px;font-size:.92rem;font-weight:600;line-height:1.75;color:var(--ink)}
.passage .ptitle{font-family:var(--fnh);font-weight:700;font-size:.8rem;color:var(--am);letter-spacing:1px;margin-bottom:4px;text-transform:uppercase}
.passage .tag{background:#DBEAFE;border-bottom:2px solid var(--bl);padding:0 3px;border-radius:3px;font-weight:800;cursor:pointer}
.passage .sig{background:#FED7AA;border-bottom:2px solid var(--or);padding:0 3px;border-radius:3px;font-weight:800;cursor:pointer}
.gloss{display:none;margin-top:8px;background:var(--bll);border-radius:4px;padding:7px 11px;font-size:.82rem;font-weight:700;color:var(--bld)}
.gloss.show{display:block}
.para{display:flex;flex-direction:column;gap:9px}
.para.locked{opacity:.35;pointer-events:none;filter:grayscale(1)}
.para .lock-note{display:none;font-size:.75rem;font-weight:800;color:var(--ink3)}
.para.locked .lock-note{display:block}

/* MCQ */
.qcard{background:var(--surf);border:2px solid var(--bdr);border-radius:4px;padding:11px 13px}
.qcard.solved{border-color:#6EE7B7}
.qcard.missed{border-color:#FCD34D}
.qtext{font-size:.9rem;font-weight:800;color:var(--ink);line-height:1.45}
.qclue{font-size:.7rem;color:var(--ink3);font-weight:800;margin-bottom:3px;letter-spacing:.3px}
.opt{display:block;width:100%;text-align:left;background:var(--surf);border:2px solid var(--bdr);border-radius:4px;padding:9px 12px;font-family:var(--fn);font-size:.86rem;font-weight:700;color:var(--ink);cursor:pointer;margin-top:7px}
.opt:hover:not(:disabled){background:var(--paper);border-color:var(--or)}
.opt.good{background:#D1FAE5;border-color:var(--gn);color:var(--gnd)}
.opt.bad{background:var(--rdl);border-color:var(--rd);color:var(--rd);animation:shake .3s}
.opt:disabled{cursor:default}
.opt:disabled:not(.good){opacity:.5}
.opt2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.opt2 .opt{text-align:center}
.qwhy{display:none;margin-top:7px;font-size:.8rem;color:var(--gnd);font-weight:700}
.qcard.solved .qwhy{display:block}
.qjp{display:none;margin-top:4px;font-size:.78rem;color:var(--ink3)}
.qcard.solved .qjp{display:block}
.fb{margin-top:7px;font-weight:800;font-size:.8rem;min-height:0}
.fb.ok{color:var(--gnd)}.fb.no{color:var(--rd)}.fb.show{color:#92400E}

/* FLASHCARD (canonical) */
.flashcard-wrap{perspective:1000px;min-height:250px;cursor:pointer;max-width:560px;width:100%;margin:0 auto}
.flashcard{width:100%;min-height:250px;position:relative;transform-style:preserve-3d;transition:transform .5s ease}
.flashcard.flipped{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;width:100%;min-height:250px;backface-visibility:hidden;border-radius:6px;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;text-align:center;border:2px solid var(--bdr);background:var(--surf)}
.fc-back{transform:rotateY(180deg);border-color:var(--pu);background:var(--pul)}
.fc-emoji{font-size:2.5rem;line-height:1}
.fc-word{font-family:var(--fnh);font-size:1.5rem;font-weight:700;color:var(--ink);letter-spacing:.5px}
.fc-pos{font-size:.7rem;font-weight:700;color:var(--ink3);letter-spacing:1px;text-transform:uppercase}
.fc-tap{font-size:.65rem;color:var(--ink3);font-weight:600;font-style:italic;margin-top:4px}
.fc-def{font-size:.95rem;font-weight:700;color:var(--ink);line-height:1.4}
.fc-sample{font-size:.84rem;font-weight:600;color:var(--ink2);line-height:1.55;font-style:italic}
.fc-sample b{color:var(--pu);font-style:normal}
.fc-jp{font-size:.82rem;color:var(--pu);font-weight:700;display:none;line-height:1.5}
.fc-jp.revealed{display:block}
.fc-jp-btn{background:none;border:1px dashed #d1d5db;border-radius:20px;padding:3px 12px;font-size:.68rem;font-weight:700;color:var(--ink3);cursor:pointer;font-family:var(--fn);margin-top:2px}
.fc-nav{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px;max-width:560px;width:100%;margin-left:auto;margin-right:auto}
.fc-nav button{background:var(--surf);border:2px solid var(--bdr);border-radius:4px;padding:7px 14px;font-family:var(--fn);font-size:.78rem;font-weight:700;color:var(--ink2);cursor:pointer}
.fc-dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.fc-dot{width:9px;height:9px;border-radius:50%;background:var(--bdr)}
.fc-dot.seen{background:#C4B5FD}
.fc-dot.on{background:var(--pu)}

/* MATCH / TILES / ORDER */
.match-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}
.mcol{display:flex;flex-direction:column;gap:7px}
.mbtn{background:var(--surf);border:2px solid var(--bdr);border-radius:4px;padding:9px 11px;font-size:.84rem;font-weight:700;font-family:var(--fn);text-align:left;cursor:pointer;color:var(--ink)}
.mbtn.sel{border-color:var(--am);background:var(--aml)}
.mbtn.matched{border-color:#6EE7B7;background:#D1FAE5;color:var(--gnd);opacity:.85;cursor:default}
.mbtn.err{animation:shake .35s;border-color:var(--rd)}
.ord-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.ord-done{background:#D1FAE5;border:2px solid #A7F3D0;border-radius:4px;padding:7px 11px;font-weight:700;color:var(--gnd);font-size:.85rem}
.ord-done b{display:inline-block;min-width:24px}
.ord-bank{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.tile{background:var(--surf);border:2px solid #FDBA74;border-radius:4px;padding:8px 12px;font-size:.84rem;font-weight:700;cursor:pointer;font-family:var(--fn);color:var(--ink);text-align:left}
.tile:hover{border-color:var(--or)}
.tile.found{background:#D1FAE5;border-color:var(--gn);color:var(--gnd);cursor:default}
.tile.nope{background:var(--rdl);border-color:var(--rd);animation:shake .35s}
.tile.nope-done{opacity:.45;border-style:dashed;cursor:default}
.find-count{font-size:.75rem;font-weight:800;color:var(--bld);margin-top:6px}

/* SORT (static restore) */
.sort-static{display:grid;gap:10px}
.sort-static .col{border:2px solid #6EE7B7;border-radius:4px;overflow:hidden;background:#fff}
.sort-static .col h4{padding:7px 10px;color:#fff;font-size:.82rem}
.sort-static .col div{padding:5px 10px;font-size:.8rem;font-weight:700;border-top:1px solid var(--bdr)}
.sort-host .dnd-tile{white-space:normal !important;font-size:.86rem !important;padding:7px 12px !important}

/* TYPED + WRITE */
.type-row{display:flex;gap:7px;margin-top:8px;align-items:center;flex-wrap:wrap}
.type-row .pre{font-size:.92rem;font-weight:800;color:var(--ink)}
.type-in{flex:1;min-width:150px;border:2px solid var(--bdr);border-radius:4px;padding:9px 11px;font-size:.92rem;font-family:var(--fn);font-weight:700}
.type-in:focus{outline:none;border-color:var(--or)}
.type-go{background:var(--or);color:#fff;border:none;border-radius:4px;padding:9px 16px;font-size:.95rem;font-weight:900;cursor:pointer;font-family:var(--fn)}
.type-go:disabled{opacity:.4}
.ghost{background:#fff;color:var(--ink2);border:2px solid var(--bdr);border-radius:4px;padding:8px 12px;font-size:.8rem;font-weight:800;cursor:pointer;font-family:var(--fn)}
.text-ta{width:100%;border:2px solid var(--bdr);border-radius:4px;padding:10px 12px;font-family:var(--fn);font-size:.92rem;font-weight:600;color:var(--ink);background:var(--surf);outline:none;resize:vertical;min-height:220px;line-height:1.65}
.text-ta:focus{border-color:var(--or)}
.meter{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px;margin-top:6px}
.meter div{background:#fff;border:2px solid var(--bdr);border-radius:4px;padding:6px 9px;font-size:.74rem;font-weight:800;color:var(--ink3)}
.meter div b{display:block;font-size:1rem;color:var(--ink2)}
.meter div.ok{border-color:#6EE7B7;background:#F0FDF4;color:var(--gnd)}
.meter div.ok b{color:var(--gnd)}
.flags{font-size:.8rem;font-weight:800;color:var(--rd);margin-top:6px;line-height:1.5}
.found-words{font-size:.75rem;font-weight:700;color:var(--ink3);margin-top:4px;line-height:1.5}

/* TAP-THE-WORDS passage */
.tapbox{background:#fff;border:2px solid var(--bdr);border-radius:4px;padding:12px 14px;font-size:.95rem;line-height:2;font-weight:600}
.tapbox .w{cursor:pointer;border-radius:3px}
.tapbox .w.miss{background:var(--rdl);color:var(--rd)}
.tapbox .t{cursor:pointer;border-radius:3px}
.tapbox .t.hit{font-weight:900}
.tapbox .t.hit.c-sense{background:#DBEAFE;border-bottom:3px solid var(--bl);color:var(--bld)}
.tapbox .t.hit.c-emo{background:#FCE7F3;border-bottom:3px solid #DB2777;color:#9D174D}
.tapbox .t.hit.c-time{background:#FED7AA;border-bottom:3px solid var(--or);color:var(--ord)}
.tap-log{font-size:.78rem;font-weight:700;color:var(--ink2);margin-top:6px;line-height:1.6}

/* PLAN CHART */
.plan-tbl{width:100%;border-collapse:collapse;background:#fff;border:2px solid var(--bdr);border-radius:4px;overflow:hidden}
.plan-tbl th{background:var(--bl);color:#fff;padding:8px 10px;text-align:left;font-size:.78rem;font-family:var(--fnh);letter-spacing:1px}
.plan-tbl td{border-top:1px solid var(--bdr);padding:6px 8px;font-size:.84rem;font-weight:800;vertical-align:top}
.plan-tbl td:first-child{width:34%;white-space:nowrap}
.plan-tbl textarea{width:100%;border:none;background:#FFFBEB;font-family:var(--fn);font-size:.86rem;font-weight:600;resize:vertical;min-height:44px;padding:7px 9px;border-radius:3px;outline:none}
.plan-tbl textarea:focus{background:#FFF7ED}
.plan-tbl td.model{font-weight:600;color:var(--ink2)}
.counter{font-size:.75rem;font-weight:800;color:var(--ink3);margin-top:5px}
.counter b.ok{color:var(--gnd)}
.chk-item{display:flex;align-items:center;gap:9px;background:var(--surf);border:2px solid var(--bdr);border-radius:4px;padding:9px 11px;cursor:pointer;font-size:.84rem;font-weight:700;color:var(--ink2);font-family:var(--fn);text-align:left;width:100%}
.chk-item.checked{background:#D1FAE5;border-color:var(--gn);color:#065F46}
.chk-box{width:20px;height:20px;border:2px solid var(--bdr);border-radius:3px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.85rem;background:#fff}
.chk-item.checked .chk-box{background:var(--gn);border-color:var(--gn);color:#fff}
.chk-item small{display:block;font-weight:600;color:var(--ink3);font-size:.74rem}
.choice-row{display:flex;gap:8px;flex-wrap:wrap}
.choice{flex:1;min-width:120px;background:#fff;border:2px solid var(--bdr);border-radius:4px;padding:12px 8px;font-family:var(--fn);font-size:.9rem;font-weight:800;cursor:pointer;text-align:center}
.choice.on{background:var(--bll);border-color:var(--bl);color:var(--bld)}
.draft-view{background:#fff;border:2px dashed var(--bdr);border-radius:4px;padding:10px 12px;font-size:.88rem;font-weight:600;line-height:1.65;white-space:pre-wrap;color:var(--ink2)}

/* QUIZ */
.qz-bar{background:var(--bdr);height:5px;border-radius:3px;overflow:hidden}
.qz-bar-fill{background:var(--or);height:5px;width:0;transition:width .4s}
.qz-head{display:flex;justify-content:space-between;font-family:var(--fnh);font-size:.7rem;font-weight:700;letter-spacing:1px;color:var(--ink3);margin-bottom:6px}
.qz-tag{display:inline-block;font-family:var(--fnh);font-size:.55rem;font-weight:700;letter-spacing:1.5px;padding:2px 7px;border-radius:2px;margin-bottom:6px;background:var(--orl);color:var(--ord)}
.qz-res{background:var(--surf);border:2px solid var(--bdr);border-radius:4px;padding:16px;text-align:center}
.qz-trophy{font-size:3rem;line-height:1;margin-bottom:6px}
.qz-score-big{font-family:var(--fnh);font-size:1.8rem;font-weight:700;color:var(--ink)}
.qz-msg{font-size:.88rem;font-weight:800;color:var(--ink2);margin-top:6px;line-height:1.5}
.wrong-review{background:var(--rdl);border:2px solid var(--rdb);border-radius:4px;padding:9px 12px;text-align:left;margin-top:9px;font-size:.8rem;line-height:1.55}

/* DAD VIEW + REVIEW */

</style>
</head>
<body>

<header class="app-hdr">
  <div class="hdr-left"><span class="hdr-badge">LEEA</span><span class="hdr-title">LEO</span><span class="hdr-unit">· L5 U1 WRITING</span></div>
  <div class="hdr-btns"><button class="mbk" onclick="openDad()">👨 Dad’s view</button><button class="mbk" onclick="location.href='/'">← Home</button></div>
</header>

<div id="appRoot">
<div class="hero">
  <div class="hero-kick">OUR WORLD · LEVEL 5 · UNIT 1 · STORY DESK</div>
  <div class="hero-title">✍️ Writing: <span>Safe not Sorry!</span></div>
  <div class="hero-sub">Personal narrative — your true storm story with the five senses</div>
  <div class="hero-em">👁️ 👂 ✋ 👅 👃 ⛈️</div>
  <div class="hero-pill" id="progPill">0 / 13 done</div>
</div>
<div class="prog-wrap"><div class="prog-fill" id="progFill"></div></div>
<div id="hwBanner" class="hw-banner"></div>
<div class="home" id="home"></div>
</div>

<div id="modals"></div>

<div id="reviewScreen" class="rv-screen">
  <div class="rv-card" style="background:var(--ink);color:#fff"><b>REVIEW · NERITAN</b> — Leo’s saved work, read-only.</div>
  <div id="reviewBody"></div>
</div>

<div class="dad-ov" id="dad-ov"><div class="dad-modal">
  <div class="dad-head"><b>👨 Dad’s view — Leo’s wrong first tries</b><button class="ghost" onclick="closeDad()">✕ Close</button></div>
  <div class="dad-body" id="dad-body"></div>
</div></div>
<script>
/* ═════════════════════════════════════════════════════════════════════
   LEVEL 5 UNIT 1 WRITING — LEO APP · "Safe not Sorry!" (personal narrative)
   Storage: localStorage 'leea-5-1-writing-<key>' · HOMEWORK_ID leo-5-1-writing
   MODULE_COUNT 13 · done-keys m{n}-done · final quiz score: score (m13)

   Locked writing shell (modal home grid, Vocab Foundations first, SB 5 +
   WB 5 + final quiz). Every module is filled from the teacher deck
   (public/lessons/ow-l5-u1-writing.html), its own items verbatim first:
     m1  Academic Language   <- slides 11-15 (senses · emotions · experience)
     m2  Related Vocab       <- slides 4-10, 16-22 (5 senses · forecaster · heavy)
     m3  Personal Narrative  <- slides 23, 28-33, 36 (what it is + Read 1)
     m4  Key Expressions     <- slides 24-27, 43-47, 49 (saw/heard/felt,
                                time words, before/after, irregular past)
     m5  Plan My Chart       <- slides 37-41 (Read 2/3 tap hunts, chart, steps)
     m6  Write!              <- slides 48, 50, 51 (frame, Dad's two models)
     m7  Edit & Share        <- slides 52-56 (checklist, find mistakes, share)
     m8  WB Act 1 · 7 Steps  <- WB p. 10 Act 1 + sense chart (slides 34, 41)
     m9  WB Act 2 · My Plan  <- WB p. 11 Act 2
     m10 WB Act 4 · Express  <- WB p. 11 Act 4 (happy / scary / beautiful)
     m11 WB Act 5 · In Order <- WB p. 11 Act 5
     m12 WB Act 6 · Story 2  <- WB p. 11 Act 6
     m13 Can Leo Score?      <- slides 57-61 (recap, builder) + 10Q quiz
   (WB Act 3 — "write your narrative" — is the SB story in m6.)
   Each module is a list of blocks; every block saves as Leo answers and
   restores its own DOM; the module's done-key saves itself when all its
   blocks are done, which is also what enables Mark complete.
═════════════════════════════════════════════════════════════════════ */
const SAVE_PREFIX = 'leea-5-1-writing-';
const HOMEWORK_ID = new URLSearchParams(location.search).get('hw') || 'leo-5-1-writing';
const REVIEW = new URLSearchParams(location.search).get('review') === '1';
const MODULE_COUNT = 13;
function lSave(k,v){ try{ localStorage.setItem(SAVE_PREFIX+k, JSON.stringify(v)); }catch(e){} }
function lLoad(k){ try{ const r = localStorage.getItem(SAVE_PREFIX+k); return r ? JSON.parse(r) : null; }catch(e){ return null; } }
function lDel(k){ try{ localStorage.removeItem(SAVE_PREFIX+k); }catch(e){} }
const $ = id => document.getElementById(id);
function shuffle(a){ const b = a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function strip(h){ return String(h).replace(/<[^>]+>/g,''); }
function norm(s){ return String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/[.,!?;:"“”]/g,' ').replace(/\s+/g,' ').trim(); }

/* Homework flag: learnerProgress.ts reads `leea-<homeworkId>-done` exactly. */
function hwFlag(value){
  try{ if(value) localStorage.setItem('leea-' + HOMEWORK_ID + '-done', JSON.stringify(value)); else localStorage.removeItem('leea-' + HOMEWORK_ID + '-done'); }catch(e){}
  try{ if(window.LEEA_CLOUD && typeof window.LEEA_CLOUD.saveProgress === 'function') window.LEEA_CLOUD.saveProgress(HOMEWORK_ID, 'leea-' + HOMEWORK_ID + '-done', value || null); }catch(e){}
}

/* ═══ MODULE MACHINERY — K is 'm1' … 'm13' ═══ */
const MODS = {}, ORDER = [];
const INIT = {};
function defineMod(K, cfg){ cfg.k = K; MODS[K] = cfg; ORDER.push(K); }
function isDone(K){ return !!lLoad(K + '-done'); }
function blocksDone(K){ return MODS[K].blocks.filter(b => BLOCK_DONE[b.type] && BLOCK_DONE[b.type](K + '-' + b.id, b)).length; }
function blocksTotal(K){ return MODS[K].blocks.filter(b => BLOCK_DONE[b.type]).length; }
function started(K){ try{ return Object.keys(localStorage).some(k => k.indexOf(SAVE_PREFIX + K + '-') === 0 && k.slice(-4) !== '-att'); }catch(e){ return false; } }
function paintBadge(K){
  const b = $('badge-' + K); if(!b) return;
  const m = MODS[K];
  if(isDone(K)){ b.className = 'mod-badge badge-done'; b.textContent = '✓ DONE'; }
  else if(started(K)){ b.className = 'mod-badge badge-prog'; b.textContent = 'IN PROGRESS'; }
  else { b.className = 'mod-badge badge-new'; b.textContent = m.badge || 'NOT STARTED'; }
}
function refreshProg(){
  try{
    let n = 0; ORDER.forEach(K=>{ if(isDone(K)) n++; paintBadge(K); });
    $('progFill').style.width = Math.round(n / MODULE_COUNT * 100) + '%';
    $('progPill').textContent = n + ' / ' + MODULE_COUNT + ' done';
    const has = !!localStorage.getItem('leea-' + HOMEWORK_ID + '-done');
    if(n >= MODULE_COUNT){ if(!has) hwFlag({ complete:true, completedAt:new Date().toISOString() }); }
    else if(has) hwFlag(null);
  }catch(e){}
}
function paintFooter(K){
  const cb = $('mark-' + K); if(!cb) return;
  if(isDone(K)){ cb.disabled = false; cb.classList.add('confirmed'); cb.textContent = '✓ ' + MODS[K].name + ' complete'; }
  else { cb.disabled = true; cb.classList.remove('confirmed'); cb.textContent = 'Mark ' + MODS[K].name + ' complete ✓  (' + blocksDone(K) + ' / ' + blocksTotal(K) + ')'; }
  MODS[K].blocks.forEach(b=>{ const l = $('kl-' + K + '-' + b.id); if(l && BLOCK_DONE[b.type]) l.classList.toggle('ok', !!BLOCK_DONE[b.type](K + '-' + b.id, b)); });
}
function finishMod(K){
  try{
    $('done-' + K).classList.add('show');
    if(!isDone(K)) lSave(K + '-done', { done:true, completedAt:new Date().toISOString() });
    paintFooter(K); refreshProg();
  }catch(e){}
}
/* Called by every block after progress: the done-key saves itself. */
function checkMod(K){ if(blocksDone(K) >= blocksTotal(K)) finishMod(K); else { paintFooter(K); paintBadge(K); } }
function markComplete(K){ checkMod(K); }
function redoMod(K){
  try{
    const btn = $('redo-' + K);
    if(!btn.classList.contains('armed')){ btn.classList.add('armed'); btn.textContent = 'Tap again ↺'; setTimeout(()=>{ btn.classList.remove('armed'); btn.textContent = '↺ Redo'; }, 3000); return; }
    btn.classList.remove('armed'); btn.textContent = '↺ Redo';
    Object.keys(localStorage).filter(k => k.indexOf(SAVE_PREFIX + K + '-') === 0).forEach(k => localStorage.removeItem(k));
    if(K === 'm13') lDel('score');
    $('done-' + K).classList.remove('show');
    renderMod(K); paintFooter(K); refreshProg();
  }catch(e){}
}
function openModal(K){
  try{
    $(K).classList.add('open'); document.body.style.overflow = 'hidden';
    if(!INIT[K]) renderMod(K);
    else MODS[K].blocks.forEach(b => { if(b.type === 'view') BLOCK_RENDER.view(K + '-' + b.id, K + '-' + b.id, b, K); });  /* show the latest work from other modules */
    paintFooter(K);
  }catch(e){ console.error(e); }
}
function closeModal(K){ $(K).classList.remove('open'); document.body.style.overflow = ''; refreshProg(); }
function renderMod(K){
  const m = MODS[K];
  $('blocks-' + K).innerHTML = m.blocks.map(b =>
    (b.label ? '<div class="section-h" id="kl-' + K + '-' + b.id + '">' + b.label + ' <span class="kdone">✓ done</span></div>' : '') +
    (b.hint ? '<div class="info-card">' + b.hint + '</div>' : '') +
    '<div class="blk" id="' + K + '-' + b.id + '"></div>').join('');
  m.blocks.forEach(b => { try{ BLOCK_RENDER[b.type](K + '-' + b.id, K + '-' + b.id, b, K); }catch(e){ console.error(K, b.type, e); } });
  INIT[K] = true;
  if(isDone(K)) $('done-' + K).classList.add('show');
}
function buildShell(){
  let h = '';
  SECTIONS.forEach(sec=>{
    h += '<div class="sec-lbl">' + sec.label + '</div><div class="mod-grid">';
    sec.mods.forEach(K=>{ const m = MODS[K];
      h += '<button class="mod-card ' + sec.cls + (m.wide ? ' wide' : '') + '" onclick="openModal(\'' + K + '\')">' + (sec.cls === 'always' ? '<div class="mod-tag">ALWAYS</div>' : '') +
        '<div class="mod-icon">' + m.icon + '</div><div class="mod-name">' + m.name + '</div><div class="mod-desc">' + m.desc + '</div><div class="mod-badge badge-new" id="badge-' + K + '">' + (m.badge || 'NOT STARTED') + '</div></button>';
    });
    h += '</div>';
  });
  $('home').innerHTML = h;
  $('modals').innerHTML = ORDER.map((K,i)=>{ const m = MODS[K];
    return '<div class="modal" id="' + K + '"><div class="mbox"><div class="mhd ' + m.color + '"><div class="mhd-title">' + m.icon + ' ' + m.title + '</div><div class="mhd-num">' + (i+1) + ' / ' + MODULE_COUNT + '</div><button class="mhd-close" onclick="closeModal(\'' + K + '\')">✕</button></div>' +
      '<div class="mbody">' + (m.dad ? '<div class="dad-card">💬 ' + m.dad + '</div>' : '') +
      '<div id="blocks-' + K + '" style="display:flex;flex-direction:column;gap:12px"></div>' +
      '<div class="done-banner" id="done-' + K + '">' + m.done + '</div>' +
      '<div class="mod-footer"><button class="mark-btn" id="mark-' + K + '" onclick="markComplete(\'' + K + '\')" disabled>Mark complete ✓</button><button class="redo-btn" id="redo-' + K + '" onclick="redoMod(\'' + K + '\')">↺ Redo</button></div></div></div></div>';
  }).join('');
}

/* ── Wrong first tries, for Dad (cleared with that module's Redo) ── */
function logAtt(K, rec){ const a = lLoad(K + '-att') || []; a.push(rec); lSave(K + '-att', a); }
function openDad(){
  let h = '<div class="dad-sec">Leo’s <b>wrong first tries</b>, exactly as he tapped or typed them.</div>', any = false;
  ORDER.forEach(K=>{
    const a = lLoad(K + '-att') || []; if(!a.length) return; any = true;
    h += '<div class="dad-sec"><b>' + MODS[K].icon + ' ' + esc(MODS[K].name) + (isDone(K) ? ' ✓' : '') + ' — ' + a.length + '</b>' +
      a.map(r => '<div class="dad-row">✖ ' + (r.q ? '<i>' + esc(r.q) + '</i> → ' : '') + '<b>' + esc(r.a) + '</b></div>').join('') + '</div>';
  });
  if(!any) h += '<div class="dad-sec">No wrong first tries yet. 🎉</div>';
  $('dad-body').innerHTML = h; $('dad-ov').classList.add('open');
}
function closeDad(){ $('dad-ov').classList.remove('open'); }

/* ═════════════════════════════════════════════════════════════════════
   BLOCKS. Each: render(host, key, cfg, K) + done(key, cfg).
═════════════════════════════════════════════════════════════════════ */
const BLOCK_RENDER = {}, BLOCK_DONE = {}, BS = {};

BLOCK_RENDER.note = (host, key, b) => { $(host).innerHTML = b.html; };

/* flash — the deck's word cards; done when every card is flipped */
BLOCK_RENDER.flash = function(host, key, b, K){
  BS[host] = { key, b, K, i:0 };
  $(host).innerHTML = '<div class="flashcard-wrap" onclick="fcFlip(\'' + host + '\')"><div class="flashcard" id="' + host + '-card">' +
    '<div class="fc-face fc-front"><div class="fc-emoji" id="' + host + '-em"></div><div class="fc-word" id="' + host + '-w"></div><div class="fc-pos" id="' + host + '-pos"></div><div class="fc-tap">tap to flip</div></div>' +
    '<div class="fc-face fc-back"><div class="fc-def" id="' + host + '-def"></div><div class="fc-sample" id="' + host + '-s"></div><button class="fc-jp-btn" id="' + host + '-jb" onclick="fcJp(event,\'' + host + '\')">🇯🇵 日本語</button><div class="fc-jp jp" id="' + host + '-jp"></div></div></div></div>' +
    '<div class="fc-nav"><button onclick="fcStep(\'' + host + '\',-1)">◀ Prev</button><div class="fc-dots" id="' + host + '-dots"></div><button onclick="fcStep(\'' + host + '\',1)">Next ▶</button></div>';
  fcPaint(host);
};
BLOCK_DONE.flash = (key, b) => (lLoad(key) || []).length >= b.words.length;
function fcPaint(host){
  const s = BS[host], w = s.b.words[s.i], seen = new Set(lLoad(s.key) || []);
  $(host + '-card').classList.remove('flipped');
  $(host + '-em').textContent = w.emoji; $(host + '-w').textContent = w.word; $(host + '-pos').textContent = w.pos;
  $(host + '-def').textContent = w.def; $(host + '-s').innerHTML = w.sample;
  $(host + '-jp').textContent = '🇯🇵 ' + w.jp; $(host + '-jp').classList.remove('revealed'); $(host + '-jb').textContent = '🇯🇵 日本語';
  $(host + '-dots').innerHTML = s.b.words.map((x,i)=>'<div class="fc-dot' + (seen.has(i) ? ' seen' : '') + (i === s.i ? ' on' : '') + '"></div>').join('');
}
function fcFlip(host){
  const s = BS[host];
  if($(host + '-card').classList.toggle('flipped')){
    const seen = new Set(lLoad(s.key) || []); seen.add(s.i); lSave(s.key, Array.from(seen));
    const d = $(host + '-dots').children[s.i]; if(d) d.classList.add('seen');
    checkMod(s.K);
  }
}
function fcStep(host, d){ const s = BS[host]; s.i = (s.i + d + s.b.words.length) % s.b.words.length; fcPaint(host); }
function fcJp(e, host){ e.stopPropagation(); const on = $(host + '-jp').classList.toggle('revealed'); $(host + '-jb').textContent = on ? '🇯🇵 隠す' : '🇯🇵 日本語'; }

/* mcq — { clue?, q, opts, ok, why?, jp? }. Retry until right; solved items save. */
BLOCK_RENDER.mcq = function(host, key, b, K){
  BS[host] = { key, b, K };
  $(host).innerHTML = b.items.map((it,i)=>{
    const raw = it.opts.map((o,oi)=>({ text:o, ok:oi===it.ok }));
    const opts = (b.keep || it.keep) ? raw : shuffle(raw);
    return '<div class="qcard" data-idx="' + i + '">' + (it.clue ? '<div class="qclue">' + it.clue + '</div>' : '') +
      '<div class="qtext">' + (b.nonum ? '' : (i+1) + '. ') + it.q + '</div><div class="' + (it.two || b.two ? 'opt2' : '') + '">' +
      opts.map(o=>'<button class="opt" data-ok="' + (o.ok ? 1 : 0) + '" onclick="mcqPick(this,\'' + host + '\',' + i + ')">' + o.text + '</button>').join('') + '</div>' +
      (it.why ? '<div class="qwhy">💡 ' + it.why + '</div>' : '') + (it.jp ? '<div class="qjp jp">🇯🇵 ' + it.jp + '</div>' : '') + '</div>';
  }).join('');
  (lLoad(key) || []).forEach(i=>{ const c = $(host).querySelector('[data-idx="' + i + '"]'); if(c) mcqSolve(c); });
};
BLOCK_DONE.mcq = (key, b) => (lLoad(key) || []).length >= b.items.length;
function mcqSolve(card){ card.classList.add('solved'); card.querySelectorAll('.opt').forEach(o=>{ o.disabled = true; if(o.dataset.ok === '1') o.classList.add('good'); }); }
function mcqPick(btn, host, i){
  const card = btn.closest('.qcard'); if(!card || card.classList.contains('solved')) return;
  const s = BS[host], right = btn.dataset.ok === '1';
  if(!card.dataset.tried){ card.dataset.tried = '1'; if(!right) logAtt(s.K, { q:strip(s.b.items[i].q), a:strip(btn.innerHTML) }); }
  if(right){
    mcqSolve(card);
    const set = new Set(lLoad(s.key) || []); set.add(i); lSave(s.key, Array.from(set));
    if(s.b.after) s.b.after(host);
    checkMod(s.K);
  } else { btn.classList.add('bad'); setTimeout(()=>btn.classList.remove('bad'), 380); }
}

/* match — tap a left card, then its partner. pairs: [{ l, r }] */
BLOCK_RENDER.match = function(host, key, b, K){
  BS[host] = { key, b, K, sel:null };
  const right = shuffle(b.pairs.map((p,i)=>({ t:p.r, i })));
  $(host).innerHTML = (b.heads ? '<div class="match-grid"><div class="qclue">' + b.heads[0] + '</div><div class="qclue">' + b.heads[1] + '</div></div>' : '') + '<div class="match-grid"><div class="mcol">' +
    b.pairs.map((p,i)=>'<button class="mbtn" id="' + host + '-l' + i + '" onclick="mtL(\'' + host + '\',' + i + ')">' + p.l + '</button>').join('') +
    '</div><div class="mcol">' + right.map((x,k)=>'<button class="mbtn" id="' + host + '-r' + k + '" data-t="' + esc(x.t) + '" onclick="mtR(\'' + host + '\',' + k + ')">' + x.t + '</button>').join('') + '</div></div>' +
    '<div class="fb" id="' + host + '-fb"></div>';
  (lLoad(key) || []).forEach(i=>mtPaint(host, i));
};
BLOCK_DONE.match = (key, b) => (lLoad(key) || []).length >= b.pairs.length;
function mtPaint(host, i){
  const s = BS[host], t = s.b.pairs[i].r;
  $(host + '-l' + i).classList.add('matched'); $(host + '-l' + i).disabled = true;
  const r = Array.from($(host).querySelectorAll('.mcol:last-child .mbtn')).find(x => x.dataset.t === esc(t) && !x.classList.contains('matched'));
  if(r){ r.classList.add('matched'); r.disabled = true; }
}
function mtL(host, i){ const s = BS[host]; $(host).querySelectorAll('.mbtn.sel').forEach(x=>x.classList.remove('sel')); s.sel = i; $(host + '-l' + i).classList.add('sel'); }
function mtR(host, k){
  const s = BS[host], btn = $(host + '-r' + k), fb = $(host + '-fb');
  if(s.sel === null){ fb.className = 'fb no'; fb.textContent = 'Tap a card on the left first.'; return; }
  const p = s.b.pairs[s.sel];
  if(btn.dataset.t === esc(p.r)){
    const m = new Set(lLoad(s.key) || []); m.add(s.sel); lSave(s.key, Array.from(m));
    $(host + '-l' + s.sel).classList.remove('sel'); mtPaint(host, s.sel); s.sel = null;
    fb.className = 'fb ok'; fb.textContent = '✅ Match! ' + (m.size >= s.b.pairs.length ? 'All matched.' : '');
    checkMod(s.K);
  } else {
    logAtt(s.K, { q:strip(p.l), a:strip(btn.innerHTML) });
    btn.classList.add('err'); setTimeout(()=>btn.classList.remove('err'), 380);
    fb.className = 'fb no'; fb.textContent = 'Not that one — try again.';
  }
}

/* typed — { p, pre?, post?, ans?[..] | free+min, model }. Two tries, then the answer. */
BLOCK_RENDER.typed = function(host, key, b, K){
  BS[host] = { key, b, K };
  const st = lLoad(key) || {};
  $(host).innerHTML = b.items.map((it,i)=>{
    const s = st[i] || {};
    return '<div class="qcard" id="' + host + '-c' + i + '"><div class="qtext">' + (b.nonum ? '' : (i+1) + '. ') + it.p + '</div><div class="type-row">' +
      (it.pre ? '<span class="pre">' + esc(it.pre) + '</span>' : '') +
      '<input class="type-in" id="' + host + '-in' + i + '" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="' + (it.ph || 'type here…') + '" value="' + esc(s.last || '') + '" onkeydown="if(event.key===\'Enter\')tyCheck(\'' + host + '\',' + i + ')">' +

/* narrative — the story, with a live meter for the four checklist points. */
const TIME_WORDS = ['last year','last summer','last winter','last spring','last fall','last week','last night','last saturday','last sunday','yesterday','first','next','then','after that','after','before','soon','suddenly','finally','when','later','at last'];
const SENSE_WORDS = ['saw','see','looked','heard','hear','felt','feel','touched','touch','smelled','smelt','smell','tasted','taste','loud','quiet','noise','sound','crash','boom','roar','roared','howling','dark','bright','black','gray','grey','white','yellow','orange','cold','wet','hot','warm','heavy','strong','hard','soft','salty','sweet','shook','shake','flash','lightning','thunder'];
const EMO_WORDS = ['scared','scary','worried','happy','excited','exciting','afraid','nervous','sad','glad','surprised','angry','calm','relieved','frightened','tired','bored','safe','brave','proud','lucky'];
const BAD_PAST = { goed:'went', seed:'saw', telled:'told', comed:'came', heared:'heard', shaked:'shook', feeled:'felt', putted:'put', hitted:'hit', maked:'made', runned:'ran', eated:'ate', drinked:'drank', thinked:'thought', buyed:'bought', catched:'caught', taked:'took', gived:'gave', falled:'fell', blowed:'blew', knowed:'knew', sayed:'said', haved:'had', doed:'did', getted:'got', winned:'won', leaved:'left', sitted:'sat', standed:'stood', bringed:'brought', breaked:'broke', writed:'wrote' };
function wrongPast(text){
  const out = [], low = ' ' + norm(text) + ' ';
  Object.keys(BAD_PAST).forEach(w => { if(low.indexOf(' ' + w + ' ') >= 0) out.push({ w, fix:BAD_PAST[w] }); });
  if(/ (i|we|he|she|they|you) seen /.test(low)) out.push({ w:'I seen', fix:'I saw' });
  return out;
}
function findIn(text, list){ const low = ' ' + norm(text) + ' '; return list.filter(w => low.indexOf(' ' + w + ' ') >= 0); }
function storyStats(text){
  const sentences = (text.match(/[^.!?]+[.!?]+/g) || []).filter(x => x.trim().split(/\s+/).length >= 3).length;
  return { sentences, time:findIn(text, TIME_WORDS), sense:findIn(text, SENSE_WORDS), emo:findIn(text, EMO_WORDS), bad:wrongPast(text), blanks:text.indexOf('__') >= 0 };
}
BLOCK_RENDER.narrative = function(host, key, b, K){
  BS[host] = { key, b, K };
  const s = lLoad(key) || {};

    (b.starter ? '<div class="type-row"><button class="ghost" onclick="narStarter(\'' + host + '\')">📝 Use the story frame</button></div>' : '') +
    '<textarea class="text-ta" id="' + host + '-ta" placeholder="' + esc(b.ph || 'Write your story here…') + '" oninput="narIn(\'' + host + '\')">' + esc(s.text || '') + '</textarea>' +
    '<div class="meter" id="' + host + '-m"></div><div class="flags" id="' + host + '-fl"></div><div class="found-words" id="' + host + '-fw"></div>' +
    '<div class="type-row"><button class="type-go" onclick="narCheck(\'' + host + '\')">✓ I’m finished</button></div><div class="fb" id="' + host + '-fb"></div></div>';
  narMeter(host);
  if(s.done){ $(host + '-fb').className = 'fb ok'; $(host + '-fb').textContent = '✅ Saved — read it aloud to Dad!'; $(host).querySelector('.qcard').classList.add('solved'); }
};
BLOCK_DONE.narrative = key => !!(lLoad(key) || {}).done;
function narGoal(b){ return { sentences:b.sentences || 6, time:b.time || 3, sense:b.sense || 3, emo:b.emo || 1 }; }
function narMeter(host){
  const b = BS[host].b, g = narGoal(b), st = storyStats($(host + '-ta').value);
  const cell = (ok, n, goal, lbl) => '<div class="' + (ok ? 'ok' : '') + '"><b>' + n + ' / ' + goal + '</b>' + lbl + '</div>';
  $(host + '-m').innerHTML = cell(st.sentences >= g.sentences, st.sentences, g.sentences, '📝 sentences') + cell(st.time.length >= g.time, st.time.length, g.time, '➡️ time words') +
    cell(st.sense.length >= g.sense, st.sense.length, g.sense, '👁️👂✋ sense words') + cell(st.emo.length >= g.emo, st.emo.length, g.emo, '😮 feelings');
  $(host + '-fl').innerHTML = (st.bad.length ? '⏪ Past tense: ' + st.bad.map(x => '<b>' + esc(x.w) + '</b> → ' + esc(x.fix)).join(' · ') + '<br>' : '') + (st.blanks ? '✏️ Fill every ______ in the frame.' : '');
  $(host + '-fw').textContent = (st.time.length ? '➡️ ' + st.time.join(', ') + '   ' : '') + (st.sense.length ? '👁️ ' + st.sense.join(', ') + '   ' : '') + (st.emo.length ? '😮 ' + st.emo.join(', ') : '');

}

const ARM = {};
function confirmArm(host){ if(ARM[host]){ ARM[host] = false; return true; } ARM[host] = true; const f = $(host + '-fb'); f.className = 'fb no'; f.textContent = 'Your story is not empty — tap the frame button again to replace it.'; setTimeout(()=>{ ARM[host] = false; }, 3000); return false; }
function narCheck(host){
  const S = BS[host], b = S.b, g = narGoal(b), st = narMeter(host), s = lLoad(S.key) || {}, fb = $(host + '-fb');
  s.text = $(host + '-ta').value;
  const miss = [];
  if(st.sentences < g.sentences) miss.push(g.sentences + ' sentences');
  if(st.time.length < g.time) miss.push(g.time + ' time words');
  if(st.sense.length < g.sense) miss.push(g.sense + ' sense words');
  if(st.emo.length < g.emo) miss.push('a feeling');
  if(st.bad.length) miss.push('the past tense fixed');

/* quiz — one try per question, scored; saves after every answer; pass gate. */
BLOCK_RENDER.quiz = function(host, key, b, K){
  BS[host] = { key, b, K };
  $(host).innerHTML = '<div id="' + host + '-act"><div class="qz-head"><span id="' + host + '-num"></span><span id="' + host + '-sc"></span></div><div class="qz-bar"><div class="qz-bar-fill" id="' + host + '-bar"></div></div><div class="qcard" style="margin-top:10px" id="' + host + '-qc"></div></div><div id="' + host + '-res" style="display:none"></div>';
  const saved = lLoad(b.scoreKey);
  if(saved && saved.finished){ qzResult(host, saved); return; }
  qzRender(host);
};
BLOCK_DONE.quiz = (key, b) => !!(lLoad(b.scoreKey) || {}).passed;
function qzState(host){ return lLoad(BS[host].key + '-progress') || { idx:0, score:0, wrong:[] }; }
function qzRender(host){
  const S = BS[host], items = S.b.items, p = qzState(host);
  $(host + '-act').style.display = ''; $(host + '-res').style.display = 'none';
  if(p.idx >= items.length){ qzFinish(host); return; }
  $(host + '-num').textContent = 'QUESTION ' + (p.idx+1) + ' OF ' + items.length; $(host + '-sc').textContent = 'SCORE: ' + p.score;
  $(host + '-bar').style.width = Math.round(p.idx / items.length * 100) + '%';
  const it = items[p.idx], card = $(host + '-qc'); card.classList.remove('solved');
  card.innerHTML = (it.tag ? '<div class="qz-tag">' + it.tag + '</div>' : '') + '<div class="qtext">' + it.q + '</div><div class="' + (it.opts.length === 2 ? 'opt2' : '') + '">' + (it.keep ? it.opts.map((o,oi)=>({ text:o, ok:oi===it.ok })) : shuffle(it.opts.map((o,oi)=>({ text:o, ok:oi===it.ok })))).map(o=>'<button class="opt" data-ok="' + (o.ok ? 1 : 0) + '" onclick="qzPick(\'' + host + '\',this)">' + o.text + '</button>').join('') + '</div>' +
    '<div class="fb" id="' + host + '-fb"></div>' + (it.jp ? '<div class="qjp jp">🇯🇵 ' + it.jp + '</div>' : '');
}
function qzPick(host, btn){
  const S = BS[host], card = $(host + '-qc'); if(card.classList.contains('solved')) return;
  const p = qzState(host), it = S.b.items[p.idx], right = btn.dataset.ok === '1', fb = $(host + '-fb');
  mcqSolve(card);
  if(right){ p.score++; fb.className = 'fb ok'; fb.textContent = 'Correct! 🎉'; }
  else { btn.classList.add('bad'); fb.className = 'fb no'; fb.textContent = 'The right answer is in green.'; p.wrong.push({ q:strip(it.q), chose:strip(btn.innerHTML), answer:strip(it.opts[it.ok]) }); logAtt(S.K, { q:strip(it.q), a:strip(btn.innerHTML) }); }
  p.idx++; lSave(S.key + '-progress', p);
  setTimeout(()=>qzRender(host), 1300);
}
function qzFinish(host){
  const S = BS[host], p = qzState(host), total = S.b.items.length, percent = Math.round(p.score / total * 100), passed = percent >= S.b.pass * 100;
  const prev = lLoad(S.b.scoreKey) || {};
  const d = { score:p.score, total, percent, pct:percent, finished:true, passed: passed || !!prev.passed, done: passed || !!prev.passed, best: Math.max(p.score, prev.best || 0),
    timestamp:new Date().toISOString(), wrongQuestions:p.wrong.map(w=>w.q), wrong:p.wrong };
  lSave(S.b.scoreKey, d); lDel(S.key + '-progress'); qzResult(host, d); checkMod(S.K);
}
function qzResult(host, d){
  const S = BS[host];
  $(host + '-act').style.display = 'none';
  const rz = $(host + '-res'); rz.style.display = 'block'; const wrong = d.wrong || [], need = Math.ceil(S.b.pass * d.total), ok = d.score >= need;
  rz.innerHTML = '<div class="qz-res"><div class="qz-trophy">' + (ok ? '🏆' : '💪') + '</div><div class="qz-score-big">' + d.score + ' / ' + d.total + '</div>' +
    '<div class="qz-msg">' + (ok ? S.b.win : 'You need ' + need + ' / ' + d.total + '. Read the cards again and try once more!') + (d.passed && !ok ? '<br>(You already passed — best ' + d.best + ' / ' + d.total + '.)' : '') + '</div>' +
    (wrong.length ? '<div class="wrong-review"><b>Go over these:</b><br>' + wrong.map(w=>'• ' + esc(w.q) + '<br>&nbsp;&nbsp;You chose: <b style="color:var(--rd)">' + esc(w.chose) + '</b> · Answer: <b style="color:var(--gnd)">' + esc(w.answer) + '</b>').join('<br>') + '</div>' : '<div class="dad-card" style="margin-top:9px">Perfect — no mistakes! 🏆</div>') +
    '<button class="type-go" style="margin-top:12px" onclick="qzRetry(\'' + host + '\')">↺ Try the quiz again</button></div>';
}
function qzRetry(host){ const S = BS[host], d = lLoad(S.b.scoreKey) || {}; d.finished = false; lSave(S.b.scoreKey, d); lDel(S.key + '-progress'); qzRender(host); }

/* ═══ REVIEW MODE (?review=1) — Leo’s saved work for Neritan ═══ */
function initReviewMode(){
  $('appRoot').style.display = 'none'; $('reviewScreen').classList.add('show');
  const card = (lbl, txt) => txt ? '<div class="rv-card"><div class="rv-lbl">' + lbl + '</div><div class="rv-text">' + esc(txt) + '</div></div>' : '';
  const sc = (k, lbl) => { const d = lLoad(k); return d && d.finished !== undefined ? card(lbl, d.score + ' / ' + d.total + ' · ' + d.percent + '%' + (d.passed ? ' ✅ passed' : ' — not passed yet') + (d.best ? ' · best ' + d.best : '')) : ''; };
  const done = ORDER.filter(isDone).map(K => MODS[K].name);
  const choice = lLoad('m10-pick');
  let h = card('MODULES DONE', done.length + ' / ' + MODULE_COUNT + (done.length ? '\n' + done.join(' · ') : '')) +
    sc('score', 'FINAL QUIZ') + sc('m1-quiz-score', 'ACADEMIC QUIZ') + sc('m2-quiz-score', 'RELATED VOCAB QUIZ') +
    card('STORM CHOICE (m5)', typedText('m5-choose', [{ pre:'I want to write about a ' },{ pre:'I felt ' }])) +
    card('MY CHART (m5)', planText('m5-chart', M5_ROWS)) +
    card('FIRST + CLOSING SENTENCES (m5)', typedText('m5-ends', [{ pre:'If a ', post:' comes, we know what to do.' },{ pre:'Hopefully, ' }])) +
    card('SB STORY (m6)', (lLoad('m6-story') || {}).text) +
    card('REVISION PLAN (m7)', typedText('m7-revise', [{ pre:'I will add a sense: ' },{ pre:'I will fix a verb: ' },{ pre:'I will add a time word: ' },{ pre:'Thank you! I will change ' }])) +
    card('MATCH STORY (m7)', typedText('m7-match', [{ pre:'Last ' },{ pre:'Then, suddenly, ', post:' scored!' },{ pre:'I heard ' },{ pre:'I felt ' }])) +
    card('WB ACT 2 (m9)', [typedText('m9-qs', [{ pre:'I will write about ' },{ pre:'I will write about feeling ' }]), planText('m9-chart', M9_ROWS)].filter(Boolean).join('\n')) +
    card('WB ACT 4 (m10)', [choice !== null ? 'Chose: ' + ['a happy thing','a scary thing','a beautiful thing'][choice] : '', planText('m10-table', M10_ROWS)].filter(Boolean).join('\n')) +
    card('WB ACT 5 (m11)', typedText('m11-events', M11_ITEMS)) +
    card('WB ACT 6 STORY (m12)', (lLoad('m12-story') || {}).text);
  const att = ORDER.map(K => (lLoad(K + '-att') || []).length ? MODS[K].name + ': ' + (lLoad(K + '-att') || []).map(r => r.a).join(' · ') : '').filter(Boolean).join('\n');
  h += card('WRONG FIRST TRIES', att);
  $('reviewBody').innerHTML = done.length || h.indexOf('rv-card') >= 0 ? h : '<div class="rv-not-started">📋 Work not started yet.</div>';
}

/* ═══ BOOT ═══ */
document.addEventListener('DOMContentLoaded', function(){
  try{
    buildShell();
    if(REVIEW){ initReviewMode(); return; }
    if(new URLSearchParams(location.search).get('hw')){ const b = $('hwBanner'); b.style.display = 'flex'; b.textContent = '🎯 Homework mode — your progress will be saved to Neritan.'; }
    refreshProg();
  }catch(e){ console.error(e); }
});
