LEEA.boot({"prefix":"leea-6-3-grammar-2-","homeworkId":"leo-6-3-grammar-2","keys":["tab-0-done","tab-1-done","tab-2-done","tab-3-done","tab-4-done","tab-5-done","tab-6-done","tab-7-done","tab-8-done","tab-9-done","tab-10-done","tab-11-done"],"scoreKey":"score","scoreTab":10,"tabs":[{"icon":"🧪","name":"Word Lab","sub":"Cause and effect with simple past and modals","hint":"The study words this grammar lesson uses. Practice AND Quiz.","type":"flashcards","data":{"words":[{"word":"sequence","emoji":"🔢","ipa":"ˈsikwəns","def":"the order that events or steps happen in","jp":"じゅんじょ — 出来事や手順が起こる順番です。（要確認）","sample":"The sequence shows what happened first, next, and last."},{"word":"steps","emoji":"🪜👣","ipa":"steps","def":"the individual actions in a process; also physical stairs or footprints","jp":"てじゅん — 物事のプロセスにおける個々の行動。または、物理的な階段や足跡。","sample":"There are five simple steps to heat a hot air balloon."},{"word":"cause and effect","emoji":"➡️","ipa":"kɔz ænd ɪˈfɛkt","def":"the reason something happens and what happens because of it","jp":"げんいんとけっか — 何かが起こる理由と、その結果起こることです。（要確認）","sample":"Cause and effect writing explains why something happened."},{"word":"main idea","emoji":"🎯","ipa":"ˌmeɪn aɪˈdi-ə","def":"the most important idea in a paragraph or text","jp":"ちゅうしんとなるかんがえ — 「中心となる考え」は、文章でいちばん大切な考えです。","sample":"The main idea of a paragraph should be clear."},{"word":"summarize","emoji":"📝📋","ipa":"ˈsʌməˌraɪz","def":"to give a brief statement of the main points of something.","jp":"要約する — 要約するとは、大切な部分だけをまとめて短く説明することです。","sample":"Summarize the main idea of the reading passage."}]}},{"icon":"🔥","name":"Warm Up","sub":"TR 3.7 — Cause and effect with simple past and modals","hint":"Eight quick questions on the pattern.","type":"mcq","data":{"items":[{"q":"The boy printed out the recipe so that he  ______  read it.","opts":["would have","can","will","could"],"correct":3,"jp":"読めるように印刷しました。"},{"q":"We put the ingredients on the table so that it  ______  easy to find them.","opts":["will be","could been","is","would be"],"correct":3,"jp":"見つけやすくなるようにしました。"},{"q":"The Aztecs added spices so that it  ______  better.","opts":["would taste","would tasted","will taste","tastes"],"correct":0,"jp":"おいしくなるように香辛料を加えました。"},{"q":"She heated the milk slowly so that it  ______ .","opts":["wouldn't burned","didn't burning","won't burn","wouldn't burn"],"correct":3,"jp":"焦げないようにゆっくり温めました。"},{"q":"“So that” tells you ___. ______","opts":["who did it","why someone did it","when it happened","where it happened"],"correct":1,"jp":"so that は目的を表します。"},{"q":"The Spanish took the seeds back so that they  ______  chocolate in Spain.","opts":["can drink","could drink","could drank","drink"],"correct":1,"jp":"スペインで飲めるように持ち帰りました。"},{"q":"Which sentence is correct? ______","opts":["I wrote it down so that I would remember.","I wrote it down so I remembering.","I wrote it down so that I would remembered.","I wrote it down so that I will remember."],"correct":0,"jp":"過去の文には will ではなく would を使います。"},{"q":"Some were buried with chocolate so that they  ______  it with them.","opts":["take","can take","could take","could took"],"correct":2,"jp":"持って行けるようにチョコレートとともに埋葬されました。"}],"label":"warmed up"}},{"icon":"📐","name":"The Rule","sub":"simple past clause + so that + subject + could / would + base verb","hint":"Open every row of the grammar box, then answer the checks.","type":"reveal","data":{"cards":[{"emoji":"📐","title":"Ability / possibility","text":"…so that + subject + could + base verb  —  He printed the recipe so that he could read it.","jp":"彼は読めるようにレシピを印刷しました。"},{"emoji":"📐","title":"Expected result","text":"…so that + subject + would + base verb  —  We put them on the table so that it would be easy.","jp":"簡単になるように、それらをテーブルに置きました。"},{"emoji":"📐","title":"Negative result","text":"…so that + subject + wouldn't + base verb  —  We wore life jackets so that no one would have an accident.","jp":"事故が起きないように救命胴衣を着けました。"},{"emoji":"📐","title":"Taking it somewhere","text":"…so that + subject + could + take / drink / buy  —  Some were buried with chocolate so that they could take it with them.","jp":"持って行けるように、チョコレートとともに埋葬された人もいました。"},{"emoji":"📐","title":"Short form","text":"so that → so (in speech)  —  He showed me how to climb rocks, so that I can get stronger.","jp":"強くなれるように、彼は岩の登り方を教えてくれました。"}],"checks":[{"q":"The boy printed out the recipe so that he  ______  read it.","opts":["would have","could","can","will"],"correct":1,"jp":"読めるように印刷しました。"},{"q":"We put the ingredients on the table so that it  ______  easy to find them.","opts":["is","could been","will be","would be"],"correct":3,"jp":"見つけやすくなるようにしました。"},{"q":"The Aztecs added spices so that it  ______  better.","opts":["would taste","will taste","tastes","would tasted"],"correct":0,"jp":"おいしくなるように香辛料を加えました。"}]}},{"icon":"🕵️","name":"Detective","hint":"Find the sentence that is written correctly.","type":"mcq","data":{"items":[{"q":"Choose the correct sentence. ______","opts":["He printed the recipe so that he can read it.","He printed the recipe so that he could reading it.","He printed the recipe so that he could read it.","He printed the recipe so he could read it so that."],"correct":2,"jp":"読めるようにレシピを印刷しました。"},{"q":"Fix it: “She stirred it so that it would burned.” ______","opts":["She stirred it so that it will burn.","She stirred it so that it wouldn't burn.","She stirred it so that it burned.","She stirred it so that it would burn."],"correct":1,"jp":"焦げないようにかき混ぜました。"},{"q":"Choose the correct modal: “The Mayas used ten seeds so that they ___ buy a rabbit.” ______","opts":["shall","could","will","can"],"correct":1,"jp":"could は can の過去形です。"},{"q":"Which is NOT a purpose clause? ______","opts":["He printed it because he was bored.","They wrote it so that others could follow.","He printed it so that he could read it.","She stirred it so that it wouldn't burn."],"correct":0,"jp":"because は理由、so that は目的です。"}],"label":"solved"}},{"icon":"🔧","name":"Build It","hint":"Tap the chips in order to rebuild each sentence.","type":"build","data":{"items":[{"words":["The","boy","printed","out","the","recipe","so","that","he","could","read","it","while","he","was","cooking"],"jp":"その男の子は料理しながら読めるようにレシピを印刷しました。"},{"words":["We","put","all","the","ingredients","on","the","table","so","that","it","would","be","easy","to","find","them","later"],"jp":"あとで見つけやすいように、材料を全部テーブルに置きました。"},{"words":["The","Aztecs","added","spices","so","that","it","would","taste","better"],"jp":"アステカの人々は、おいしくなるように香辛料を加えました。"},{"words":["Some","were","buried","with","chocolate","so","that","they","could","take","it","with","them"],"jp":"持って行けるように、チョコレートとともに埋葬された人もいました。"},{"words":["The","Spanish","took","the","seeds","back","to","Spain","so","that","they","could","drink","chocolate","there"],"jp":"スペイン人は、そこでチョコレートを飲めるように種を持ち帰りました。"},{"words":["We","wore","life","jackets","so","that","no","one","would","have","an","accident"],"jp":"だれも事故に遭わないように救命胴衣を着けました。"}]}},{"icon":"🗂️","name":"Sort","hint":"Which sentences use the pattern correctly?","type":"sort","data":{"title":"Correct or broken?","zones":[{"id":"right","label":"✅ Correct"},{"id":"wrong","label":"❌ Broken"}],"tiles":[{"text":"The boy printed out the recipe so that he could read it while he was cooking.","zone":"right"},{"text":"We put all the ingredients on the table so that it would be easy to find them later.","zone":"right"},{"text":"The Aztecs added spices so that it would taste better.","zone":"right"},{"text":"Some were buried with chocolate so that they could take it with them.","zone":"right"},{"text":"The Spanish took the seeds back to Spain so that they could drink chocolate there.","zone":"right"},{"text":"The boy printed out the recipe so that he can read it.","zone":"wrong"},{"text":"We put the ingredients on the table so that it will be easy to find them.","zone":"wrong"},{"text":"The Aztecs added spices so that it will taste better.","zone":"wrong"},{"text":"She heated the milk slowly so that it won't ],"correct":2,"jp":"ココアが冷めないように、おばあちゃんはカップを温めました。"},{"q":"I set a timer so that I wouldn't forget ______","opts":["the milkshake.","would work.","every step."],"correct":0,"jp":"ミルクセーキを忘れないように、タイマーをかけました。"},{"q":"They wrote everything down so that other cooks could ______","opts":["would work.","every step.","follow it."],"correct":2,"jp":"ほかの料理人が従えるように、彼らはすべて書きとめました。"}],"label":"guessed"}},{"icon":"📝","name":"Quiz","hint":"Ten questions. Eight or more to pass.","type":"quiz","data":{"items":[{"q":"Choose the correct sentence. ______","opts":["He printed the recipe so that he can read it.","He printed the recipe so he could read it so that.","He printed the recipe so that he could reading it.","He printed the recipe so that he could read it."],"correct":3,"jp":"読めるようにレシピを印刷しました。"},{"q":"Which one shows an expected result rather than an ability? ______","opts":["I climbed rocks so that I could get stronger.","He printed it so that he could read it.","They took the seeds so that they could drink it.","We put them out so that it would be easy."],"correct":3,"jp":"would は期待される結果を表します。"},{"q":"Complete: “We wore life jackets so that no one  ______  an accident.”","opts":["would have","would had","will have","having"],"correct":0,"jp":"だれも事故に遭わないようにしました。"},{"q":"Fix it: “She stirred it so that it would burned.” ______","opts":["She stirred it so that it burned.","She stirred it so that it will burn.","She stirred it so that it would burn.","She stirred it so that it wouldn't burn."],"correct":3,"jp":"焦げないようにかき混ぜました。"},{"q":"Which question does so that answer? ______","opts":["How many did they do?","When did they do it?","Why did they do it?","Where did they do it?"],"correct":2,"jp":"so that は「なぜ」に答えます。"},{"q":"Choose the correct modal: “The Mayas used ten seeds so that they ___ buy a rabbit.” ______","opts":["shall","can","could","will"],"correct":2,"jp":"could は can の過去形です。"},{"q":"Which sentence has the clauses in the right order? ______","opts":["So that I wouldn't forget I set a timer so.","I set a timer so that I wouldn't forget.","I so that wouldn't forget set a timer.","Set a timer I so that wouldn't forget."],"correct":1,"jp":"先に行動、あとに理由です。"},{"q":"Complete: “We weighed the sugar in grams so that the recipe ___ work.” ______","opts":["would","would to","is","will"],"correct":0,"jp":"主節が過去なので would を使います。"},{"q":"Which is NOT a purpose clause? ______","opts":["They wrote it so that others could follow.","He printed it because he was bored.","She stirred it so that it wouldn't burn.","He printed it so that he could read it."],"correct":1,"jp":"because は理由、so that は目的です。"},{"q":"Complete: “Grandma warmed the cups so that the cocoa ___ cool down.” ______","opts":["will not","wouldn't","didn't","would"],"correct":1,"jp":"冷めないように、には wouldn't を使います。"}],"pass":8}},{"icon":"⚽","name":"Dribble!","hint":"Every right answer beats a defender.","type":"dribble","data":{"items":[{"q":"Champions League final ⚽ The boy printed out the recipe so that he  ______  read it.","opts":["will","could","can","would have"],"correct":1,"jp":"読めるように印刷しました。"},{"q":"Premier League derby ⚽ We put the ingredients on the table so that it  ______  easy to find them.","opts":["could been","will be","would be","is"],"correct":2,"jp":"見つけやすくなるようにしました。"},{"q":"La Liga clásico ⚽ The Aztecs added spices so that it  ______  better.","opts":["would taste","would tasted","will taste","tastes"],"correct":0,"jp":"おいしくなるように香辛料を加えました。"},{"q":"Bundesliga night ⚽ She heated the milk slowly so that it  ______ .","opts":["wouldn't burn","didn't burning","won't burn","wouldn't burned"],"correct":0,"jp":"焦げないようにゆっくり温めました。"},{"q":"Ligue 1 away day ⚽ “So that” tells you ___. ______","opts":["who did it","when it happened","why someone did it","where it happened"],"correct":2,"jp":"so that は目的を表します。"},{"q":"Serie A matchday ⚽ The Spanish took the seeds back so that they  ______  chocolate in Spain.","opts":["could drink","can drink","drink","could drank"],"correct":0,"jp":"スペインで
