 amount of water we use","A kind of glacier"],"correct":1,"jp":"私たちが使う水の総量のことです。"},{"t":"For example, we don't see the water that was used to make a T-shirt. We only see the T-shirt. But 2,700 liters of water were used to produce it! Earth has always had the same amount of water. However, there are more people on the planet now, and we all need water. If we want water in the future, we must not waste it or pollute it now!","q":"How much water is used to make one T-shirt?","opts":["27 liters","270 liters","2,700 liters"],"correct":2,"jp":"2,700リットルです。"}]}},{"icon":"🧭","name":"Strategy","sub":"Reading strategy — reading percentages","hint":"This passage is built out of percentages: 75%, 97.5%, 70%, 30%, 5%, 95%, 1%. Every time you meet one, ask “a percentage of what?” — the whole changes from sentence to sentence.","type":"mcq","data":{"items":[{"q":"How much of the earth is covered by water?","opts":["Nearly 100%","Nearly 75%","Nearly 25%"],"correct":1,"jp":"約75パーセントです。"},{"q":"What is water in the sky called?","opts":["Surface water","Groundwater","Water vapor"],"correct":2,"jp":"水蒸気と呼ばれます。"},{"q":"Why can't we use most of our fresh water?","opts":["It tastes bad","Most of it is frozen or polluted","It is too expensive"],"correct":1,"jp":"多くが凍っているか汚染されているからです。"},{"q":"What is 95% of our fresh water used for?","opts":["Filling swimming pools","Producing food, clothes and energy","Washing cars"],"correct":1,"jp":"食べ物・衣類・エネルギーを作るために使われます。"}],"label":"strategy checks"}},{"icon":"🔢","name":"Order","sub":"Follow the water from the whole earth to your glass","hint":"Tap the events in the order they happened.","type":"order","data":{"items":["Nearly 75% of the earth is covered by water.","97.5% of that water is salt water we can't drink.","Of the fresh water left, 70% is frozen.","We can reach only 30% of groundwater, and most is polluted.","In the end we can drink about 1% of the world's fresh water.","Only 5% of that reaches the faucets in our homes."]}},{"icon":"🔍","name
