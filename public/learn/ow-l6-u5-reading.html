 of different living things in one place.","jp":"生物多様性（せいぶつたようせい）— 一つの場所にいる生き物の種類の多さ。","sample":"The coral reef had the most biodiversity."},{"word":"transparent","emoji":"🫧","ipa":"trænsˈpærənt","def":"clear enough to see through.","jp":"透明な（とうめいな）— 向こうが見えるほど澄んでいること。","sample":"He discovered a strange transparent octopus."},{"word":"a predator","emoji":"🦅","ipa":"ˈpredətər","def":"an animal that hunts and eats other animals.","jp":"捕食者（ほしょくしゃ）— ほかの動物をとらえて食べる動物。","sample":"There are tiny habitats where predator and prey have tiny battles."}]}},{"icon":"📖","name":"Read","sub":"One Cubic Foot","hint":"Answer the question under each paragraph to unlock the next one.","type":"read","data":{"intro":"There are about 1.5 million species on Earth, but how many do you see every day? You often see the big colorful animals, like birds, mammals, and fish. But look more closely.","paras":[{"t":"Can you see the tiny creatures, too? Eighty percent of the world's species are insects. Look on the ground. Imagine you could look under the ground. Many tiny creatures live there, too. Every cubic foot on Earth has life in it.","q":"What percentage of the world's species are insects?","opts":["Eighteen percent","Eighty percent","Eight percent"],"correct":1,"jp":"80パーセントです。"},{"t":"David Liittschwager is a photographer. He wanted to find out how many creatures are in one cubic foot. So he made an empty 12-inch cube with a green metal frame and put it in five different places around the world.","q":"What did Liittschwager want to find out?","opts":["How deep the ocean is","How many creatures are in one cubic foot","How fast a hummingbird flies"],"correct":1,"jp":"1立方フィートに何匹の生き物がいるかです。"},{"t":"He chose a tropical rainforest (Costa Rica), a coral reef (Pacific Ocean), the Table Mountain (South Africa), a freshwater river (USA), and a city park (New York). He put the cube in each place for three weeks. He observed, counted, and took photos of everything—down to 1 millimeter in size—that crawled or flew into the cube.","q":"How long did the cube stay in each place?","opts":["Three weeks","Three months","Three days"],"correct":0,"jp":"3週間です。"},{"t":"The results were amazing. Liittschwager found both common and rare creatures. He also discovered many new species, like a strange transparent octopus that is the size of a fingernail! In total, more than a thousand different organisms were photographed and studied. Although the coral reef had the most biodiversity, all the other places were also full of life. Even the city park!","q":"Which place had the most biodiversity?","opts":["The coral reef","The city park","Table Mountain"],"correct":0,"jp":"サンゴ礁です。"}]}},{"icon":"🧭","name":"Strategy","sub":"Reading strategy — although and even","hint":"Watch for although and even. Although the coral reef had the most biodiversity tells you a surprise is coming; Even the city park! tells you the surprise has landed.","type":"mcq","data":{"items":[{"q":"About how many species are there on Earth?","opts":["1.5 million","1.5 thousand","1.5 billion"],"correct":0,"jp":"約150万種です。"},{"q":"What is David Liittschwager's job?","opts":["A photographer","A pilot","A doctor"],"correct":0,"jp":"写真家です。"},{"q":"How big was the cube?","opts":["12 inches","12 feet","12 meters"],"correct":0,"jp":"12インチです。"},{"q":"How many places did he choose?","opts":["Ten","Three","Five"],"correct":2,"jp":"5か所です。"}],"label":"strategy checks"}},{"icon":"🔢","name":"Order","sub":"Put the One Cubic Foot project in order","hint":"Tap the events in the order they happened.","type":"order","data":{"items":["Liittschwager wanted to know how many creatures live in one cubic foot.","He made an empty 12-inch cube with a green metal frame.","He put the cube in five different places around the world.","He left the cube in each place for three weeks.","He observed, counted and photographed everything down to 1 millimeter.","More than a thousand different organisms were photographed and studied."]}},{"icon":"🔍","name"
