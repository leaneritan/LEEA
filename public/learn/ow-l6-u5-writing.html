itat and size"],"correct":2,"jp":"生息地と大きさを書きます。"},{"q":"Which is a characteristic, not an opinion?","opts":["It is my favourite.","It grabs food that floats by.","It is horrible."],"correct":1,"jp":"行動の説明が特徴です。"},{"q":"Which adjective is an opinion?","opts":["gray","wonderful","sixteen-millimeter"],"correct":1,"jp":"wonderful は意見です。"},{"q":"“Can” in reported speech becomes ___.","opts":["will","can","could"],"correct":2,"jp":"could になります。"},{"q":"Where does an origin adjective like “Colombian” go?","opts":["After the noun","Right before the noun","First"],"correct":1,"jp":"名詞の直前です。"}],"pass":6}}]});
