","hint":"Open the rest of the photos and check what you found.","type":"reveal","data":{"cards":[{"emoji":"💦","title":"The water test","text":"Waterproof toys are dipped in water. Machines tear balloons. If something doesn't work, manufacturers fix the problem.","jp":"防水のおもちゃは水に浸されます。機械が風船を引き裂きます。うまくいかなければ、製造業者は問題を直します。"},{"emoji":"🙋","title":"Why bother?","text":"It can cost a lot of money to replace a broken product, and unhappy customers tell others if a product isn't good quality.","jp":"壊れた商品を交換するには多くの費用がかかります。また、品質が悪ければ不満な客がほかの人に伝えます。"}],"checks":[{"q":"What happens to waterproof toys?","opts":["They are frozen","They are dipped in water","They are torn"],"correct":1,"jp":"水に浸されます。"},{"q":"Why is a broken product bad for a manufacturer?","opts":["It is too heavy","It is illegal","It costs a lot to replace and customers complain"],"correct":2,"jp":"交換に費用がかかり、客が不満を言うからです。"}]}},{"icon":"🔎","name":"Look and Check","hint":"Four quick questions about the unit opener.","type":"mcq","data":{"items":[{"q":"Most manufacturers test their products ___.","opts":["before selling them","never","after a year"],"correct":0,"jp":"売る前に検査します。"},{"q":"A dummy looks like a ___.","opts":["human","balloon","car"],"correct":0,"jp":"人間に似ています。"},{"q":"Crash tests show what happens on ___.","opts":["holiday","impact","delivery"],"correct":1,"jp":"衝撃のときに何が起こるかを示します。"},{"q":"What does the drop test do?","opts":["Drops customers","Drops toys on the floor","Drops prices"],"correct":1,"jp":"おもちゃを床に落とします。"}],"label":"checks answered"}},{"icon":"✍️","name":"Write Your Caption","hint":"Write your own caption for the Smart Choices photo. Two sentences is enough.","type":"write","data":{"minWords":20,"minSentences":2,"captionKey":"m5-caption","placeholder":"A caption for the Smart Choices opener photo…","checklist":["My caption says what is happening in the photo.","I used one word from this unit."]}},{"icon":"🗂️","name":"Theme Sorter","hint":"Drag each card into the right column.","type":"sort",
