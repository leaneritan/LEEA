tain brand of sneakers."},{"word":"a review","emoji":"📝","ipa":"rɪˈvjuː","def":"what someone writes about how good a product is.","jp":"レビュー（れびゅー）— 商品がどれくらいよいかを書いたもの。","sample":"Try these tips: read product reviews and compare products."},{"word":"an opportunity","emoji":"⏳","ipa":"ˌɑːpərˈtuːnəti","def":"a chance to do something good.","jp":"機会（きかい）— よいことができるチャンス。","sample":"Buy now before you miss a great opportunity!"}]}},{"icon":"📖","name":"Read","sub":"Be an Ad Detective!","hint":"Answer the question under each paragraph to unlock the next one.","type":"read","data":{"intro":"Every day we see ads—on TV, in magazines, on websites, in the street, and on our computer screens. We hear them, too. But often we don't notice them.","paras":[{"t":"A famous film producer once showed over one hundred products in his movie, but most people didn't notice them! Are you an ad detective? Can you understand the messages advertisers send you? To be an ad detective, it is useful to know how ads work.","q":"What did most people fail to notice in the film?","opts":["The music","The actors","Over one hundred products"],"correct":2,"jp":"100点以上の商品に気づきませんでした。"},{"t":"1. Group pressure: An ad shows lots of young people, each with their own cell phone. Message: Everyone has a cell phone. You need one, too! 2. Association: Everyone looks happy and healthy in the ad. Message: If you buy the product, you will be happy and cool like these people.","q":"What is the message of “group pressure”?","opts":["Buy it before the shop closes","This product is cheap","Everyone has one, so you need one too"],"correct":2,"jp":"みんな持っているから、あなたも必要だ、というメッセージです。"},{"t":"3. Testimonials: A famous athlete says he wears a certain brand of sneakers. Message: You'll be good at sports, too, if you buy these sneakers. 4. Repetition: These ads mention the product many times and say wonderful things about it. Message: You need to remember the product.","q":"Which technique uses a famous athlete?","opts":["Time pressure","Repetition","Testimonials"],"correct":2,"jp":"推薦（テスティモニアル）です。"},{"t":"5. Time pressure: These ads use expressions like “Buy now! Half price this week.” Message: You should buy the product quickly before you miss a great opportunity. Ads are interesting, but you can make better decisions when you know these techniques! Try these tips: read product reviews, compare products, test products in the store, and, if you are not sure, wait 24 hours before buying.","q":"What should you do if you are not sure?","opts":["Wait 24 hours before buying","Buy it immediately","Ask the advertiser"],"correct":0,"jp":"24時間待ってから買いましょう。"}]}},{"icon":"🧭","name":"Strategy","sub":"Reading strategy — numbered techniques","hint":"This passage is a numbered list: 1 group pressure, 2 association, 3 testimonials, 4 repetition, 5 time pressure. Each one has a name and a Message. Read the name, then the Message — that pair is the whole idea.","type":"mcq","data":{"items":[{"q":"Where do we see ads?","opts":["On TV, in magazines, on websites and in the street","Only in shops","Only on TV"],"correct":0,"jp":"テレビ・雑誌・ウェブサイト・街中などです。"},{"q":"How many products did the film producer show?","opts":["Over one hundred","Exactly five","Over ten"],"correct":0,"jp":"100点以上です。"},{"q":"Which technique repeats the product many times?","opts":["Group pressure","Repetition","Association"],"correct":1,"jp":"くり返し（repetition）です。"},{"q":"“Half price this week” is an example of ___.","opts":["time pressure","association","testimonials"],"correct":0,"jp":"時間の圧力です。"}],"label":"strategy checks"}},{"icon":"🔢","name":"Order","sub":"Put the five advertising techniques in the order the article gives them","hint":"Tap the events in the order they happened.","type":"order","data":{"items":["Group pressure — everyone has one, so you need one too.","Association — buy it and you will be happy and cool.","Testimonials — a famous athlete says he uses it.","Repetition — the product is mentioned again and again.","Time pressure — buy ect":0,"jp":"よりよい判断ができるようになるからです。"},{"q":"What might you decide after waiting 24 hours?","opts":["That you don't really need the product","That the shop is closed","That the ad was true"],"correct":0,"jp":"本当はその商品が必要ないと気づくかもしれません。"}],"pass":6}}]});
