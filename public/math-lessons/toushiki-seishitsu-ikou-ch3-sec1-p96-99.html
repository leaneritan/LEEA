<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>等式の性質と移項 ｜ 3章1節 p.96-99</title>
<style>
  :root{
    --gothic:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP","Meiryo",sans-serif;
    --mincho:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","MS Mincho",serif;
  }
  /* ---- 説明編：黒板 ---- */
  .theme-setsumei{
    --ink:#22312C; --ink-soft:#5C6E67; --paper:#E8EDE9; --card:#FFFFFF;
    --accent:#9C6B15; --accent-bg:#FAF2E2; --deep:#2F4739; --deep-fg:#F2F5EE;
    --ok:#3D7A5A; --ok-bg:#E7F1EB; --no:#A64B3C; --no-bg:#F9EDEA; --line:#D3DCD6;
  }
  /* ---- テスト編：赤ペン ---- */
  .theme-test{
    --ink:#1F2328; --ink-soft:#63696F; --paper:#F4F3EF; --card:#FFFFFF;
    --accent:#C62828; --accent-bg:#FBEDEC; --deep:#1F2328; --deep-fg:#FFFFFF;
    --ok:#2F6F4E; --ok-bg:#E8F1EC; --no:#C62828; --no-bg:#FBEDEC; --line:#DEDCD4;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--gothic);font-size:17px;line-height:1.9;-webkit-text-size-adjust:100%;
       background:var(--paper);color:var(--ink);transition:background .3s}
  .wrap{max-width:660px;margin:0 auto;padding:18px 15px 70px}

  header.top{background:var(--deep);color:var(--deep-fg);border-radius:13px;
             padding:16px 18px 0;margin-bottom:16px;transition:background .3s}
  header.top .eyebrow{font-size:11.5px;letter-spacing:.2em;opacity:.68;margin:0 0 3px}
  header.top h1{font-size:24px;font-weight:800;margin:0;letter-spacing:.03em}
  header.top .sub{font-size:13.5px;opacity:.68;margin:3px 0 0}
  .bar{display:flex;gap:4px;margin-top:12px}
  .bar i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.22);transition:background .25s}
  .bar i.hit{background:#8FC5A5} .bar i.miss{background:#C58C82} .bar i.now{background:#fff}

  /* ---- tabs ---- */
  .tabs{display:flex;gap:6px;margin:14px -18px 0;padding:0 18px;border-top:1px solid rgba(255,255,255,.14)}
  .tabs button{flex:1;background:none;border:none;color:inherit;opacity:.55;
    font-family:inherit;font-size:14.5px;font-weight:700;padding:12px 4px 11px;
    cursor:pointer;border-bottom:3px solid transparent;letter-spacing:.04em}
  .tabs button:hover{opacity:.85}
  .tabs button.on{opacity:1;border-bottom-color:currentColor}
  .tabs .badge{display:inline-block;font-size:11px;font-weight:700;margin-left:6px;
    padding:1px 7px;border-radius:20px;background:rgba(255,255,255,.16)}
  .tabs .badge.done{background:#8FC5A5;color:#1B2E24}

  .card{background:var(--card);border-radius:13px;padding:21px 19px;
        box-shadow:0 1px 2px rgba(0,0,0,.05),0 8px 20px rgba(0,0,0,.07)}
  .screen{animation:rise .3s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

  .tag{display:inline-block;font-size:12px;letter-spacing:.12em;font-weight:700;
       padding:3px 11px;border-radius:20px;background:var(--accent-bg);color:var(--accent);margin-bottom:8px}
  .sec{display:inline-block;font-size:12px;letter-spacing:.06em;color:var(--ink-soft);
       margin:0 0 8px 9px;font-weight:700}
  .pg{display:inline-block;font-size:11.5px;letter-spacing:.06em;font-weight:700;
      padding:2px 9px;border-radius:6px;background:var(--deep);color:var(--deep-fg);
      margin:0 0 8px 8px;vertical-align:2px}
  h2{font-size:21px;font-weight:800;margin:0 0 12px;letter-spacing:.02em}
  p{margin:0 0 13px}
  .lead{color:var(--ink-soft);font-size:15.5px}
  .prompt{font-size:12.5px;letter-spacing:.1em;color:var(--accent);font-weight:700;margin:18px 0 4px}

  .m{font-family:var(--mincho);font-size:27px;text-align:center;margin:14px 0;letter-spacing:.04em}
  .m.sm{font-size:21px;line-height:1.8}
  .quote{background:rgba(0,0,0,.02);border:1px dashed var(--line);border-radius:10px;
         padding:12px 14px;margin:12px 0;font-size:15.5px}
  .quote .src{display:block;font-size:11.5px;letter-spacing:.1em;color:var(--accent);
              font-weight:700;margin-bottom:4px}
  .prob{background:rgba(0,0,0,.02);border:1px solid var(--line);border-radius:11px;
        padding:13px 15px;margin:12px 0;font-size:16px;line-height:1.95}

  .choices{display:grid;gap:9px;margin-top:8px}
  .choice{text-align:left;padding:12px 15px;border-radius:10px;border:1.5px solid var(--line);
          background:#fff;color:var(--ink);font-size:15.5px;line-height:1.7;
          transition:border-color .15s,background .15s;font-family:inherit;cursor:pointer}
  .choice.mid{text-align:center;font-family:var(--mincho);font-size:19px}
  .choice:hover:not(:disabled){border-color:var(--accent)}
  .choice:disabled{cursor:default;opacity:.82}
  .choice.ok{border-color:var(--ok);background:var(--ok-bg);font-weight:700}
  .choice.no{border-color:var(--no);background:var(--no-bg)}
  .choice.reveal{border-color:var(--ok);background:var(--ok-bg)}

  .ord{display:grid;gap:8px;margin-top:8px}
  .ord .item{text-align:left;padding:11px 14px;border-radius:10px;border:1.5px solid var(--line);
             background:#fff;color:var(--ink);font-size:15.5px;line-height:1.7;
             position:relative;font-family:inherit;cursor:pointer}
  .ord .item:hover:not(:disabled){border-color:var(--accent)}
  .ord .item.placed{border-color:var(--ok);background:var(--ok-bg);opacity:.9;cursor:default}
  .ord .item.placed .rank{position:absolute;left:-9px;top:-9px;width:22px;height:22px;border-radius:50%;
    background:var(--ok);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .ord .item.shake{animation:shake .32s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .ordcap{font-size:13.5px;color:var(--ink-soft);margin:8px 0 0;text-align:center}

  textarea{width:100%;min-height:110px;font-family:var(--gothic);font-size:16px;line-height:1.8;
    padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);resize:vertical}
  textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  textarea:disabled{background:rgba(0,0,0,.03);color:var(--ink-soft)}
  .cnt{font-size:12.5px;color:var(--ink-soft);text-align:right;margin:4px 0 0}

  .board{background:var(--deep);color:var(--deep-fg);border-radius:12px;padding:16px 18px;margin-top:16px;
         display:none;box-shadow:inset 0 0 40px rgba(0,0,0,.22)}
  .board.show{display:block;animation:rise .35s ease both}
  .board .who{font-size:11.5px;letter-spacing:.16em;opacity:.7;font-weight:700;margin:0 0 6px}
  .board .say{font-family:var(--mincho);font-size:18px;line-height:1.95;margin:0}
  .board .say em{font-style:normal;border-bottom:1.5px solid rgba(255,255,255,.45);padding-bottom:1px}

  .selfcheck{background:var(--accent-bg);border-radius:11px;padding:14px 16px;margin-top:14px;display:none}
  .selfcheck.show{display:block;animation:rise .3s ease both}
  .selfcheck .t{font-size:12.5px;letter-spacing:.1em;font-weight:700;color:var(--accent);margin:0 0 8px}
  .selfcheck label{display:flex;gap:10px;align-items:flex-start;font-size:15.5px;
                   line-height:1.7;margin-bottom:7px;cursor:pointer}
  .selfcheck input{width:19px;height:19px;margin-top:5px;flex-shrink:0;accent-color:var(--ok)}
  .selfcheck .hintline{font-size:14px;color:var(--ink-soft);margin:8px 0 0}

  .row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:8px}
  .row .pre{font-family:var(--mincho);font-size:22px}
  .row .unit{font-size:15px;color:var(--ink-soft)}
  input[type=text]{font-family:var(--mincho);font-size:22px;width:120px;padding:8px 10px;
    border:1.5px solid var(--line);border-radius:10px;text-align:center;color:var(--ink);background:#fff}
  input[type=text]:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  input[type=text]:disabled{background:rgba(0,0,0,.03)}

  .btn{padding:11px 20px;border-radius:10px;border:none;background:var(--ink);color:#fff;
       font-weight:700;font-family:inherit;font-size:16px;cursor:pointer}
  .btn:hover:not(:disabled){opacity:.88}
  .btn:disabled{opacity:.4;cursor:default}
  .btn.accent{background:var(--accent)}
  .btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
  .helprow{display:flex;gap:8px;margin-top:12px;justify-content:flex-end}
  .btn.tiny{padding:7px 14px;font-size:13.5px;background:#fff;color:var(--ink-soft);
            border:1.5px solid var(--line);font-weight:700}
  .btn.tiny:hover:not(:disabled){color:var(--accent);border-color:var(--accent)}
  .btn.tiny[hidden]{display:none}
  .usedmark{font-size:12.5px;color:var(--ink-soft);margin:10px 0 0;text-align:right}

  .fb{margin-top:13px;padding:12px 14px;border-radius:10px;font-size:15px;display:none}
  .fb.show{display:block;animation:rise .22s ease both}
  .fb.hint{background:var(--accent-bg);border:1px solid var(--line)}
  .fb.wrong{background:var(--no-bg);border:1px solid var(--line)}
  .fb.right{background:var(--ok-bg);border:1px solid var(--line)}
  .fb b{display:block;margin-bottom:2px}
  .fb .work{font-family:var(--mincho);font-size:16.5px;display:block;margin-top:4px;line-height:1.75}

  .nav{margin-top:20px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .stepno{font-size:12.5px;color:var(--ink-soft);letter-spacing:.08em}

  .big{font-size:42px;font-weight:800;text-align:center;margin:6px 0 0}
  .big small{font-size:18px;color:var(--ink-soft);font-weight:400}
  table{width:100%;border-collapse:collapse;margin:16px 0 6px;font-size:15px}
  th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line)}
  th{font-size:12.5px;letter-spacing:.08em;color:var(--ink-soft);font-weight:700}
  td.s{text-align:right;font-family:var(--mincho);font-size:18px;white-space:nowrap}
  .pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:20px;font-weight:700}
  .pill.good{background:var(--ok-bg);color:var(--ok)}
  .pill.watch{background:var(--no-bg);color:var(--no)}
  .note{border-left:3px solid var(--accent);background:var(--accent-bg);
        padding:11px 13px;border-radius:0 8px 8px 0;font-size:15px;margin:14px 0}
  ul.rev,ul.tips{padding-left:1.15em;margin:6px 0 0;font-size:15px}
  ul.rev li,ul.tips li{margin-bottom:5px}

  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  @media (max-width:420px){body{font-size:16px}header.top h1{font-size:21px}.m{font-size:23px}}
</style>
</head>
<body>
<div class="wrap theme-setsumei" id="root">

<header class="top">
  <p class="eyebrow">3章 方程式 ／ 1節 方程式とその解</p>
  <h1>等式の性質と移項</h1>
  <p class="sub">教科書 p.96〜99　等式の性質・移項・方程式を解く手順</p>
  <div class="bar" id="bar"></div>
  <nav class="tabs">
    <button data-tab="setsumei" class="on">説明編<span class="badge" id="b-setsumei">9問</span></button>
    <button data-tab="test">テスト編<span class="badge" id="b-test">13問</span></button>
  </nav>
</header>

<main id="stage"></main>

</div>

<script>
(function(){
  "use strict";

  /* ================= 説明編 ================= */
  var STEPS = [

  /* 1 — p.97 例2 : why subtract 9 */
  { kind:"choice", tag:"はじめに", sec:"1節 方程式とその解", pg:"p.97",
    title:"なぜ「9をひく」のか",
    lead:'教科書 p.97 の 例2。左辺を x だけにするために、両辺から 9 をひいている。でも、なぜ 9 なのだろう。',
    body:'<div class="m sm">x ＋ 9 ＝ 4<br>x ＋ 9 − 9 ＝ 4 − 9<br>x ＝ −5</div>'+
         '<div class="quote"><span class="src">はるきさんのことば</span>'+
         '「9 と −9 で 0 をつくっているね。」</div>',
    prompt:"両辺から 9 をひく理由として、いちばんよい説明はどれ？",
    opts:[
      "方程式はそう解くと決まっているから。",
      "左辺の ＋9 と −9 で 0 をつくり、x だけを残すため。",
      "右辺の 4 を小さくして、計算しやすくするため。",
      "両辺から同じ数をひくと、いつでも答えが出るから。"],
    ans:1,
    hint:"はるきさんのことばがヒント。9をひいた結果、左辺には何が残った？",
    work:'ねらいは <b>左辺を x だけにすること</b>。そのために ＋9 を消したい。'+
         '＋9 と −9 をたすと 0 になるので、9 をひけば消える。<br>'+
         '4番も正しそうに聞こえるが、「同じ数ならなんでもよい」わけではない。9 でなければ 0 はつくれない。' },

  /* 2 — p.97 例3 : why divide by 4 */
  { kind:"choice", tag:"つづき", sec:"1節 方程式とその解", pg:"p.97",
    title:"なぜ「4でわる」のか",
    lead:'同じ p.97 の 例3。こんどは両辺を 4 でわっている。ねらいは 例2 と似ているが、つくるものがちがう。',
    body:'<div class="m sm">4x ＝ 8<br>4x ÷ 4 ＝ 8 ÷ 4<br>x ＝ 2</div>'+
         '<div class="quote"><span class="src">あおいさんのことば</span>'+
         '「4 ÷ 4 で 1 をつくっているね。」</div>',
    prompt:"両辺を 4 でわる理由として、いちばんよい説明はどれ？",
    opts:[
      "8 が 4 でわりきれるから。",
      "数を小さくしたほうが見やすいから。",
      "4 ÷ 4 で 1 をつくり、x の係数を 1 にするため。",
      "8 ÷ 4 ＝ 2 だから。"],
    ans:2,
    hint:"あおいさんは「1 をつくっている」と言っている。何を 1 にしたいのだろう。",
    work:'例2 は <b>0</b> をつくって項を消した。例3 は <b>1</b> をつくって係数を消している。'+
         'どちらも目的は同じで、<b>x だけを残すこと</b>。<br>'+
         '1番と4番は、たまたまわりきれたことを言っているだけで、理由になっていない。' },

  /* 3 — p.97 問5 : the notation error */
  { kind:"choice", tag:"まちがいさがし", sec:"1節 方程式とその解", pg:"p.97",
    title:"この書き方はどこが変？",
    lead:'教科書 p.97 の 問5。答えの 2 は合っているのに、書き方がまちがっているという問題。',
    body:'<div class="quote"><span class="src">✕ まちがい例</span>'+
         '<span style="font-family:var(--mincho);font-size:19px">3x ＝ 6 ÷ 3 ＝ 2<br>x ＝ 2</span></div>',
    prompt:"どこがまちがっている？",
    opts:[
      "答えの 2 がまちがっている。正しくは 3 になる。",
      "「3x ＝ 6 ÷ 3」と書くと、3x が 2 と等しいことになってしまう。3x は 6 のままである。",
      "わり算ではなく、かけ算を使わなければいけない。",
      "3 でわってはいけない。両辺から 3 をひくのが正しい。"],
    ans:1,
    hint:"「＝」は「左と右が同じ」という意味。3x ＝ 6 ÷ 3 と書いたら、3x はいくつだと言っていることになる？",
    work:'「＝」でつないだものは、すべて等しくなければならない。3x ＝ 6 なのに、'+
         '3x ＝ 6 ÷ 3 と書くと 3x ＝ 2 と主張したことになってしまう。<br>'+
         '正しくは、<b>両辺を</b> 3 でわると書く：3x ÷ 3 ＝ 6 ÷ 3　したがって x ＝ 2。' },

  /* 4 — p.98 : derive 移項, ordering */
  { kind:"order", tag:"組み立てる", sec:"1節 方程式の解き方", pg:"p.98",
    title:"移項はどこから来たのか",
    lead:'教科書 p.98 の Q。5x ＝ 6 ＋ 3x を解く場面から、移項という考えが生まれる。その筋道を並べよう。',
    body:'<div class="m sm">5x ＝ 6 ＋ 3x</div>',
    prompt:"説明の順になるように、正しい順にタップしよう。",
    items:[
      "右辺の ＋3x を消したいので、等式の性質を使って両辺から 3x をひく。",
      "5x − 3x ＝ 6 ＋ 3x − 3x となる。",
      "右辺を計算すると、5x − 3x ＝ 6 となる。",
      "はじめの式とくらべると、右辺にあった ＋3x が、左辺に −3x として現れている。"],
    hint:"まず「何をしたいか」から。消したい項を決めて、そのために両辺から何をひくかを考える。",
    work:'これが教科書 p.98 の ① と ② でやっていること。'+
         'はじめの式 5x ＝ 6 ＋ 3x と、できた式 5x − 3x ＝ 6 を見くらべると、'+
         '<b>項が辺をこえて移り、符号が変わっている</b>。これを <b>移項</b> という。' },

  /* 5 — p.98 : write the why */
  { kind:"write", tag:"説明してみよう", sec:"1節 方程式の解き方", pg:"p.98",
    title:"なぜ移項すると符号が変わるのか",
    lead:'ここが 1節 でいちばん大事な「なぜ」。教科書には「移項の考えは、等式の性質をもとにしているね」と書いてある。それを自分のことばにしよう。',
    body:'<div class="quote"><span class="src">教科書 p.98</span>'+
         '等式の一方の辺にある項は、その項の符号を変えて他方の辺に移すことができる。このことを <b>移項</b> という。</div>',
    prompt:"なぜ「符号を変えて」移してよいのか、等式の性質を使って説明しよう。",
    ph:"例：右辺の ＋3x を消すには…／両辺から…",
    model:'移項は、新しい決まりではない。<em>両辺から同じ項をひく（または加える）</em>ことを、短く書いただけ。<br>'+
          '5x ＝ 6 ＋ 3x で右辺の ＋3x を消すには、両辺から 3x をひく。'+
          'すると右辺の ＋3x は 0 になって消え、そのかわり左辺に <em>−3x</em> が現れる。<br>'+
          'つまり項が「移った」ように見えるのは、<em>実際には両辺から引き算をしている</em>から。'+
          '引いた分が反対の辺に残るので、符号が変わって見える。',
    checks:["移項が「両辺から同じ項をひく（たす）」ことだと書けた",
            "消したい項が 0 になることにふれた",
            "だから反対の辺では符号が変わる、とつなげられた"] },

  /* 6 — p.98 例1(1) : apply */
  { kind:"choice", tag:"使ってみる", sec:"1節 方程式の解き方", pg:"p.98",
    title:"移項してみよう",
    lead:'教科書 p.98 の 例1(1)。−3 を右辺へ移項する。',
    body:'<div class="m sm">x − 3 ＝ 11</div>',
    prompt:"−3 を移項すると、どうなる？",
    opts:["x ＝ 11 − 3", "x ＝ 11 ＋ 3", "x ＝ −11 ＋ 3", "x ＝ 3 − 11"],
    ans:1,
    hint:"移すと符号が変わる。−3 は右辺で何になる？",
    work:'x ＝ 11 ＋ 3 ＝ 14。<br>'+
         '確かめ方は、両辺に 3 をたすこと：x − 3 ＋ 3 ＝ 11 ＋ 3。やはり x ＝ 14。'+
         '<br>検算：14 − 3 ＝ 11 ○' },

  /* 7 — p.98 例1(2) : error hunt with x on both sides */
  { kind:"choice", tag:"まちがいさがし", sec:"1節 方程式の解き方", pg:"p.98",
    title:"符号を変えわすれると",
    lead:'教科書 p.98 の 例1(2)。両辺に x があるときは、まちがいが起きやすい。',
    body:'<div class="m sm">4x ＝ −2x ＋ 18</div>'+
         '<div class="quote"><span class="src">ある人の答え</span>'+
         '<span style="font-family:var(--mincho);font-size:19px">4x − 2x ＝ 18　→　2x ＝ 18　→　x ＝ 9</span></div>',
    prompt:"このまちがいの説明として正しいのはどれ？",
    opts:[
      "−2x を移項すると ＋2x になるので、4x ＋ 2x ＝ 18 が正しい。",

      .replace(/[\u2212\u30FC\uFF0D\u2010\u2011\u2013\u2014\u2015\uFF70]/g,"-")
      .replace(/\uFF0B/g,"+").replace(/\uFF0F/g,"/").replace(/\uFF0E/g,".")

  function val(s){

    var st=S[mode], b=bar.children;
    for(var k=0;k<n;k++){

      if(k===st.i && !st.done) cls="now";

        var r=st.res[k];

  function render(){
    if(S[mode].done){ report(); return; }
    return (mode==="setsumei") ? renderStep() : renderQ();
  }

  function renderStep(){
    var st=S.setsumei, s=STEPS[st.i]; st.tries=0;
    var mid;
    if(s.kind==="choice"){
      mid='<p class="prompt">'+s.prompt+'</p><div class="choices" id="opts">'+
          s.opts.map(function(o,k){ return '<button class="choice" data-k="'+k+'">'+o+'</button>'; }).join("")+
          '</div><div class="fb" id="fb"></div>';
    } else if(s.kind==="order"){
      mid='<p class="prompt">'+s.prompt+'</p><div class="ord" id="ord">'+
          shuffled(s.items.length).map(function(k){
            return '<button class="item" data-k="'+k+'"><span class="rank"></span>'+s.items[k]+'</button>'; }).join("")+
          '</div><p class="ordcap" id="ordcap">0 / '+s.items.length+' 並んだ</p><div class="fb" id="fb"></div>';
    } else {
      mid='<p class="prompt">'+s.prompt+'</p>'+
          '<textarea id="ta" placeholder="'+s.ph+'"></textarea><p class="cnt" id="cnt">0 文字</p>'+
          '<p style="text-align:right;margin:0"><button class="btn accent" id="send">書けた。先生の説明を見る</button></p>'+
          '<div class="board" id="board"><p class="who">先生の説明</p><p class="say">'+s.model+'</p></div>'+
          '<div class="selfcheck" id="sc"><p class="t">自分の説明とくらべよう</p>'+
          s.checks.map(function(c,k){ return '<label><input type="checkbox" data-c="'+k+'"><span>'+c+'</span></label>'; }).join("")+
          '<p class="hintline">できていなかったところは、いま書きたして直してみよう。</p></div>';
    }
    stage.innerHTML='<section class="screen"><div class="card">'+
      '<span class="tag">'+s.tag+'</span><span class="sec">'+s.sec+'</span><span class="pg">'+s.pg+'</span>'+
      '<h2>'+s.title+'</h2><p class="lead">'+s.lead+'</p>'+s.body+mid+
      '<div class="nav"><span class="stepno">'+(st.i+1)+' / '+STEPS.length+'</span>'+
      '<button class="btn" id="next" disabled>'+(st.i===STEPS.length-1?"けっかを見る →":"次へ →")+'</button></div>'+
      '</div></section>';
    wireStep();
    paintBar(); window.scrollTo({top:0,behavior:"smooth"});
  }

  function wireStep(){
    var st=S.setsumei, s=STEPS[st.i];
    if(s.kind==="choice"){
      var opts=document.getElementById("opts");
      Array.prototype.forEach.call(opts.children,function(b){
        b.addEventListener("click",function(){
          if(b.disabled) return;
          var ok=Number(b.getAttribute("data-k"))===s.ans, fb=document.getElementById("fb");
          st.tries++;
          if(ok){
            if(st.res[st.i].first===null) st.res[st.i].first=(st.tries===1);
            b.classList.add("ok");
            fb.className="fb show right"; fb.innerHTML="<b>そのとおり。</b>"+s.work;
            lockChoices();
          } else {
            st.res[st.i].first=false; b.classList.add("no");
            if(st.tries===1){ fb.className="fb show hint"; fb.innerHTML="<b>もう一度考えよう</b>"+s.hint; }
            else{ fb.className="fb show wrong";
                  fb.innerHTML="<b>答えは「"+s.opts[s.ans].replace(/<[^>]+>/g,"")+"」</b>"+s.work;
                  opts.children[s.ans].classList.add("reveal"); lockChoices(); }
            paintBar();
          }
        });
      });
    } else if(s.kind==="order"){
      var placed=0, ord=document.getElementById("ord");
      Array.prototype.forEach.call(ord.children,function(b){
        b.addEventListener("click",function(){
          if(b.disabled) return;
          if(Number(b.getAttribute("data-k"))===placed){
            b.disabled=true; b.classList.add("placed");
            b.querySelector(".rank").textContent=++placed;
            document.getElementById("ordcap").textContent=placed+" / "+s.items.length+" 並んだ";
            if(placed===s.items.length){
              if(st.res[st.i].first===null) st.res[st.i].first=(st.tries===0);
              var fb=document.getElementById("fb");
              fb.className="fb show right"; fb.innerHTML="<b>きれいにつながった。</b>"+s.work;
              document.getElementById("next").disabled=false; paintBar();
            }
          } else {
            st.tries++; st.res[st.i].first=false;
            b.classList.add("shake"); setTimeout(function(){ b.classList.remove("shake"); },340);
            var fb2=document.getElementById("fb");
            fb2.className="fb show hint"; fb2.innerHTML="<b>その順番ではないみたい</b>"+s.hint;
            paintBar();
          }
        });
      });
    } else {
      var ta=document.getElementById("ta"), send=document.getElementById("send");
      ta.addEventListener("input",function(){
        document.getElementById("cnt").textContent=ta.value.trim().length+" 文字"; });
      send.addEventListener("click",function(){
        if(ta.disabled) return;
        if(ta.value.trim().length<10){
          document.getElementById("cnt").textContent="もう少し書いてみよう（10文字以上）"; ta.focus(); return; }
        st.res[st.i].wrote=true; ta.disabled=true; send.disabled=true;
        document.getElementById("board").classList.add("show");
        var sc=document.getElementById("sc"); sc.classList.add("show");
        document.getElementById("next").disabled=false;
        Array.prototype.forEach.call(sc.querySelectorAll("input"),function(cb){
          cb.addEventListener("change",function(){
            st.res[st.i].checks=sc.querySelectorAll("input:checked").length; paintBar(); });
        });
        paintBar();
      });
      ta.focus();
    }
    document.getElementById("next").addEventListener("click",function(){
      if(this.disabled) return;
      if(st.i===STEPS.length-1){ st.done=true; report(); return; }
      st.i++; renderStep();
    });
  }

  function lockChoices(){
    var opts=document.getElementById("opts");
    Array.prototype.forEach.call(opts.children,function(b){ b.disabled=true; });
    document.getElementById("next").disabled=false; paintBar();
  }

  function renderQ(){
    var st=S.test, q=Q[st.i]; st.tries=0;
    var input = q.type==="choice"
      ? '<div class="choices" id="opts">'+
        q.opts.map(function(o,k){ return '<button class="choice'+(o.length<12?" mid":"")+'" data-k="'+k+'">'+o+'</button>'; }).join("")+'</div>'
      : '<div class="row"><span class="pre">'+q.pre+'</span>'+
        '<input type="text" id="ans" autocomplete="off" aria-label="答え">'+
        (q.unit?'<span class="unit">'+q.unit+'</span>':'')+
        '<button class="btn accent" id="check">たしかめる</button></div>';
    stage.innerHTML='<section class="screen"><div class="card">'+
      '<span class="tag">第 '+(st.i+1)+' 問</span><span class="pg">'+q.pg+'</span>'+
      q.body+'<p class="prompt">'+q.prompt+'</p>'+input+
      '<div class="helprow">'+
        '<button class="btn tiny" id="hintbtn">ヒントを見る</button>'+
        '<button class="btn tiny" id="showbtn" hidden>答えを見る</button>'+
      '</div>'+
      '<div class="fb" id="fb"></div>'+
      '<div class="nav"><span class="stepno">'+(st.i+1)+' / '+Q.length+'</span>'+
      '<button class="btn" id="next" disabled>'+(st.i===Q.length-1?"けっかを見る →":"次へ →")+'</button></div>'+
      '</div></section>';

    if(q.type==="choice"){
      var opts=document.getElementById("opts");
      Array.prototype.forEach.call(opts.children,function(b){
        b.addEventListener("click",function(){
          if(b.disabled) return; judgeQ(Number(b.getAttribute("data-k"))===q.ans,b); });
      });
    } else {
      var inp=document.getElementById("ans");
      var go=function(){
        if(inp.disabled) return;
        var raw=norm(inp.value), fb=document.getElementById("fb");
        if(raw===""){ fb.className="fb show hint"; fb.innerHTML="<b>答えを入れてね</b>数字を入力してから、たしかめるを押そう。"; return; }
        var v=val(raw);
        if(isNaN(v)){ fb.className="fb show hint"; fb.innerHTML="<b>数字で答えよう</b>マイナスは − でも - でも入力できるよ。"; return; }
        judgeQ(Math.abs(v-q.ans)<1e-9,null);
      };
      document.getElementById("check").addEventListener("click",go);
      inp.addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); go(); } });
      inp.focus();
    }
    var hintbtn=document.getElementById("hintbtn"), showbtn=document.getElementById("showbtn");
    hintbtn.addEventListener("click",function(){
      if(hintbtn.disabled) return;
      if(st.help[st.i]<1) st.help[st.i]=1;
      if(st.first[st.i]===null) st.first[st.i]=false;   // no longer counts as 自力
      var fb=document.getElementById("fb");
      fb.className="fb show hint"; fb.innerHTML="<b>ヒント</b>"+q.hint;
      hintbtn.disabled=true; showbtn.hidden=false;
      paintBar();
    });
    showbtn.addEventListener("click",function(){
      if(showbtn.disabled) return;
      st.help[st.i]=2; st.first[st.i]=false;
      var fb=document.getElementById("fb");
      fb.className="fb show wrong";
      fb.innerHTML="<b>答えは "+(q.type==="choice"?"「"+q.opts[q.ans]+"」":fmt(q.ans))+
                   "</b><span class='work'>"+q.work+"</span>";
      var opts=document.getElementById("opts");
      if(opts) opts.children[q.ans].classList.add("reveal");
      lockQ();
      var m=document.createElement("p");
      m.className="usedmark"; m.textContent="この問題は、あとでもう一度といてみよう。";
      fb.parentNode.insertBefore(m, fb.nextSibling);
      paintBar();
    });

    document.getElementById("next").addEventListener("click",function(){
      if(this.disabled) return;
      if(st.i===Q.length-1){ st.done=true; report(); return; }
      st.i++; renderQ();
    });
    paintBar(); window.scrollTo({top:0,behavior:"smooth"});
  }

  function judgeQ(ok,btn){
    var st=S.test, q=Q[st.i], fb=document.getElementById("fb");
    st.tries++;
    if(ok){
      if(st.first[st.i]===null) st.first[st.i]=(st.tries===1 && st.help[st.i]===0);
      if(btn) btn.classList.add("ok");
      fb.className="fb show right";
      fb.innerHTML="<b>"+(st.help[st.i]>0?"よくできました。":"せいかい！")+
                   "</b><span class='work'>"+q.work+"</span>";
      lockQ(); paintBar(); return;
    }
    st.first[st.i]=false;
    if(btn) btn.classList.add("no");
    if(st.tries===1){
      if(st.help[st.i]<1) st.help[st.i]=1;
      fb.className="fb show hint"; fb.innerHTML="<b>おしい。ヒント</b>"+q.hint;
      var hb=document.getElementById("hintbtn"), sb=document.getElementById("showbtn");
      if(hb) hb.disabled=true; if(sb) sb.hidden=false;
    }
    else{
      fb.className="fb show wrong";
      fb.innerHTML="<b>答えは "+(q.type==="choice"?"「"+q.opts[q.ans]+"」":fmt(q.ans))+"</b><span class='work'>"+q.work+"</span>";
      var opts=document.getElementById("opts");
      if(opts) opts.children[q.ans].classList.add("reveal");
      st.help[st.i]=2;
      lockQ();
    }
    paintBar();
  }

  function lockQ(){
    var opts=document.getElementById("opts");
    if(opts) Array.prototype.forEach.call(opts.children,function(b){ b.disabled=true; });
    var inp=document.getElementById("ans");
    if(inp){ inp.disabled=true; document.getElementById("check").disabled=true; }
    var hb=document.getElementById("hintbtn"), sb=document.getElementById("showbtn");
    if(hb) hb.disabled=true;
    if(sb) sb.disabled=true;
    document.getElementById("next").disabled=false;
  }

  /* ---------- reports ---------- */
  function report(){
    if(mode==="setsumei"){
      var st=S.setsumei;
      var autos=st.res.filter(function(r){ return r.kind==="auto"; });
      var autoOk=autos.filter(function(r){ return r.first===true; }).length;
      var writes=st.res.filter(function(r){ return r.kind==="write"; });
      var wrote=writes.filter(function(r){ return r.wrote; }).length;
      var checks=writes.reduce(function(a,r){ return a+r.checks; },0);
      var of=writes.reduce(function(a,r){ return a+r.of; },0);
      var advice = (autoOk===autos.length && checks>=of-1)
        ? "説明する力がついている。テスト編に進んで、身についたか確かめよう。"
        : (autoOk<autos.length
          ? "「どの説明がよいか」を見分けるところをもう一度。きまりをくり返すだけの説明と、理由を示す説明のちがいに注目しよう。"
          : "書くところをよくがんばった。チェックが入らなかった項目をつけ足して書きなおすと、説明がぐっとよくなる。");
      stage.innerHTML='<section class="screen"><div class="card">'+
        '<span class="tag">けっか</span><h2>説明編のふり返り</h2>'+
        '<p class="big">'+autoOk+' <small>/ '+autos.length+'</small></p>'+
        '<p class="lead" style="text-align:center;margin-top:0">見きわめ問題</p>'+
        '<table><tbody><tr><td>説明を書いた回数</td><td class="s">'+wrote+' / '+writes.length+'</td></tr>'+
        '<tr><td>自己チェックがついた数</td><td class="s">'+checks+' / '+of+'</td></tr></tbody></table>'+
        '<div class="note">'+advice+'</div>'+
        '<p class="lead" style="margin:16px 0 2px"><b>説明するときの3つの型</b></p>'+
        '<ul class="tips"><li><b>〜だから、〜になる。</b>　理由を先に、結論をあとに。</li>'+
        '<li><b>たとえば〜の場合は。</b>　具体的な数や場面で確かめる。</li>'+
        '<li><b>もし〜だとしたら、〜になってしまう。</b>　まちがいのほうを試して確かめる。</li></ul>'+
        '<div class="note" style="border-color:var(--ok);background:var(--ok-bg)">'+
        'おうちの人へ：書いた説明を声に出して読んでもらい、「どうしてそう思ったの？」と一度だけ聞き返すと、'+
        '説明がもう一段くわしくなります。正しさより、理由が言えたことをほめてください。</div>'+
        '<div class="nav" style="justify-content:center;gap:10px">'+
        '<button class="btn ghost" id="again">もう一度</button>'+
        '<button class="btn accent" id="goto-test">テスト編へ →</button></div>'+
        '</div></section>';
      document.getElementById("goto-test").addEventListener("click",function(){ switchTo("test"); });
    } else {
      var t=S.test, rows="", weak=[];
      var solo=0, hinted=0, shown=0;
      for(var k=0;k<Q.length;k++){
        if(t.help[k]===2) shown++;
        else if(t.first[k]===true) solo++;
        else hinted++;
      }
      var n=solo;
      CATS.forEach(function(c){
        var idx=Q.map(function(q,k){ return q.cat===c?k:-1; }).filter(function(k){ return k>=0; });
        var got=idx.filter(function(k){ return t.first[k]===true; }).length;
        var sh =idx.filter(function(k){ return t.help[k]===2; }).length;
        if(got<idx.length) weak.push(c);
        var label = got===idx.length ? "OK" : (sh ? "要復習" : "あと少し");
        var pill  = got===idx.length ? "good" : "watch";
        rows+="<tr><td>"+c+"</td><td class='s'>"+got+" / "+idx.length+"</td>"+
          "<td style='text-align:right'><span class='pill "+pill+"'>"+label+"</span></td></tr>";
      });
      stage.innerHTML='<section class="screen"><div class="card">'+
        '<span class="tag">けっか</span><h2>テスト編の結果</h2>'+
        '<p class="big">'+n+' <small>/ '+Q.length+'</small></p>'+
        '<p class="lead" style="text-align:center;margin-top:0">自力で正解した数</p>'+
        '<table><tbody>'+
          '<tr><td>自力で正解</td><td class="s">'+solo+' 問</td></tr>'+
          '<tr><td>ヒントを見て正解</td><td class="s">'+hinted+' 問</td></tr>'+
          '<tr><td>答えを見た</td><td class="s">'+shown+' 問</td></tr>'+
        '</tbody></table>'+
        '<table><thead><tr><th>種類</th><th style="text-align:right">自力正答</th><th></th></tr></thead>'+
        '<tbody>'+rows+'</tbody></table>'+
        '<div class="note">'+(
          solo===Q.length
          ? "全問を自力で正解。移項の考え方が身についている。次は p.100〜101 のいろいろな方程式へ。"
          : shown===0
          ? "答えを見ずに、最後まで自分で解けた。ヒントが必要だった問題をもう一度といてみよう。"
          : shown<=2
          ? "ほとんど自分で解けている。答えを見た問題だけ、教科書のページにもどって確かめよう。"
          : "答えを見た問題が多い。まず教科書の該当ページを読みなおしてから、もう一度このテストをやってみよう。"
        )+'</div>'+
        '<div class="note" style="border-color:var(--ok);background:var(--ok-bg)">'+
        'おうちの人へ：<b>ヒントを見て正解</b>と<b>答えを見た</b>では、必要な手当てがちがいます。'+
        'ヒントで解けたなら、理解はできていて思い出すきっかけが必要なだけ。'+
        '答えを見た問題が続くなら、その内容をもう一度教えるところから始めてください。</div>'+
        (weak.length ? '<p class="lead" style="margin:14px 0 2px"><b>もどるページ</b></p><ul class="rev">'+
          weak.map(function(c){ return "<li><b>"+c+"</b>　"+BACK[c]+"</li>"; }).join("")+'</ul>' : '')+
        '<div class="nav" style="justify-content:center;gap:10px">'+
        '<button class="btn ghost" id="again">もう一度</button>'+
        '<button class="btn accent" id="goto-setsumei">説明編へ →</button></div>'+
        '</div></section>';
      document.getElementById("goto-setsumei").addEventListener("click",function(){ switchTo("setsumei"); });
    }
    document.getElementById("again").addEventListener("click",function(){
      if(mode==="setsumei"){
        S.setsumei={ i:0, tries:0, done:false, res: STEPS.map(function(s){
          return s.kind==="write" ? {kind:"write",checks:0,of:s.checks.length,wrote:false}
                                  : {kind:"auto",first:null}; }) };
      } else {
        S.test={ i:0, tries:0, done:false, first:new Array(Q.length).fill(null),
                 help:new Array(Q.length).fill(0) };
      }
      render();
    });
    paintBar(); window.scrollTo({top:0,behavior:"smooth"});
  }

  /* ---------- tabs ---------- */
  function switchTo(m){
    mode=m;
    root.className="wrap theme-"+m;
    Array.prototype.forEach.call(document.querySelectorAll(".tabs button"),function(b){
      b.classList.toggle("on", b.getAttribute("data-tab")===m); });
    render();
  }
  Array.prototype.forEach.call(document.querySelectorAll(".tabs button"),function(b){
    b.addEventListener("click",function(){ switchTo(b.getAttribute("data-tab")); });
  });

  render();
})();
</script>
</body>
</html>
